<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTF 報告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:"Microsoft JhengHei";background:#f5f7fa;margin:0;padding:20px;}
.container{max-width:900px;margin:auto;background:#fff;padding:30px;border-radius:10px;}
.circle{width:120px;height:120px;border:10px solid red;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;}
.bar{background:#eee;height:10px;border-radius:5px;margin:5px 0;}
.fill{height:100%;border-radius:5px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.card{background:#fafafa;padding:15px;border-radius:10px;}
</style>
</head>

<body>

<div class="container">

<h1>MMTF 組織診斷報告</h1>

<div style="display:flex;gap:20px;align-items:center;">
<div class="circle" id="circle"><span id="total">0</span></div>
<div>
<h2 id="rank"></h2>
<div id="model"></div>
</div>
</div>

<h3>四大維度</h3>
<div id="bars"></div>

<canvas id="chart"></canvas>

<h3>AI分析</h3>
<div class="grid" id="analysis"></div>

<h3>結論</h3>
<div id="summary"></div>

</div>

<script>

// 參數
const p=new URLSearchParams(location.search);
const s={
mirror:+p.get('mirror')||0,
matrix:+p.get('matrix')||0,
flow:+p.get('flow')||0,
safe:+p.get('safe')||0
};

// 總分
const total=s.mirror+s.matrix+s.flow+s.safe;
document.getElementById('total').innerText=total;

// 風險
let rank="低風險",color="green";
if(total<=50){rank="高風險";color="red"}
else if(total<=75){rank="中風險";color="orange"}

document.getElementById('rank').innerText=rank;
document.getElementById('circle').style.borderColor=color;

// 模型
let model="過渡型";
if(s.mirror<12&&s.matrix<12&&s.flow<12&&s.safe<12) model="全面崩壞型";
document.getElementById('model').innerText=model;

// 維度
const dims=[["Mirror",s.mirror],["Matrix",s.matrix],["Flow",s.flow],["Safety",s.safe]];

// bars
document.getElementById('bars').innerHTML=dims.map(d=>{
let c=d[1]<=12?"red":d[1]<=18?"orange":"green";
return `${d[0]} ${d[1]}
<div class="bar"><div class="fill" style="width:${d[1]*4}%;background:${c}"></div></div>`;
}).join('');

// chart
new Chart(document.getElementById('chart'),{
type:'radar',
data:{labels:["Mirror","Matrix","Flow","Safety"],datasets:[{data:[s.mirror,s.matrix,s.flow,s.safe]}]},
options:{scales:{r:{min:0,max:25}}}
});

// AI
document.getElementById('analysis').innerHTML=dims.map(d=>{
return `<div class="card">${d[0]}：${d[1]}</div>`;
}).join('');

// summary
document.getElementById('summary').innerText="建議進行組織改善";

</script>

</body>
</html>
