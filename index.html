<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>MMTF 顧問診斷報告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
 font-family:"Microsoft JhengHei";
 background:#f4f6f9;
 margin:0;
 padding:20px;
}

.container{
 max-width:1100px;
 margin:auto;
 background:#fff;
 padding:25px;
 border-radius:12px;
 box-shadow:0 4px 20px rgba(0,0,0,0.05);
}

/* Header */
.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px;
}

.score{
 font-size:36px;
 font-weight:bold;
}

/* 風險 */
.risk{
 padding:15px;
 border-radius:10px;
 margin-bottom:20px;
}

.high{background:#fff1f0;border-left:6px solid #ff4d4f;}
.mid{background:#fff7e6;border-left:6px solid #faad14;}
.low{background:#f6ffed;border-left:6px solid #52c41a;}

/* 區塊 */
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:20px;
}

/* 卡片 */
.card{
 background:#fafafa;
 padding:15px;
 border-radius:10px;
}

h3{margin-top:0}

/* 條 */
.bar{background:#eee;height:10px;border-radius:6px;}
.fill{height:100%;border-radius:6px;}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>MMTF 組織診斷報告</h2>
<div class="score" id="total"></div>
</div>

<div id="riskBox" class="risk"></div>

<div class="grid">

<!-- 左 -->
<div class="card">
<h3>📊 四大維度</h3>
<div id="bars"></div>
</div>

<!-- 右 -->
<div class="card">
<h3>📈 結構圖</h3>
<canvas id="chart"></canvas>
</div>

</div>

<div class="card" style="margin-top:20px;">
<h3>🧠 顧問分析</h3>
<div id="analysis"></div>
</div>

<div class="card" style="margin-top:20px;">
<h3>🚀 改善策略</h3>
<div id="strategy"></div>
</div>

</div>

<script>

// 讀參數
const p=new URLSearchParams(location.search);
const s={
mirror:+p.get('mirror')||0,
matrix:+p.get('matrix')||0,
flow:+p.get('flow')||0,
safe:+p.get('safe')||0
};

const total=s.mirror+s.matrix+s.flow+s.safe;
document.getElementById("total").innerText=total;

// 風險
let riskClass="low",text="",desc="";
if(total<=50){
riskClass="high";
text="高風險";
desc="組織運作已出現系統性失效";
}
else if(total<=75){
riskClass="mid";
text="中風險";
desc="部分構面影響效率與決策";
}
else{
riskClass="low";
text="低風險";
desc="組織運作穩定";
}

document.getElementById("riskBox").classList.add(riskClass);
document.getElementById("riskBox").innerHTML=
`<b>${text}</b><br>${desc}`;

// bars
const dims=[["Mirror",s.mirror],["Matrix",s.matrix],["Flow",s.flow],["Safety",s.safe]];

document.getElementById("bars").innerHTML=dims.map(d=>{
let c=d[1]<=12?"#ff4d4f":d[1]<=18?"#faad14":"#52c41a";
return `
<div>${d[0]} ${d[1]}/25</div>
<div class="bar"><div class="fill" style="width:${d[1]*4}%;background:${c}"></div></div>
`;
}).join('');

// 雷達圖
new Chart(document.getElementById('chart'),{
type:'radar',
data:{
labels:["Mirror","Matrix","Flow","Safety"],
datasets:[{
data:[s.mirror,s.matrix,s.flow,s.safe],
backgroundColor:"rgba(74,144,226,.2)",
borderColor:"#4a90e2"
}]
},
options:{scales:{r:{min:0,max:25}}}
});

// 分析
document.getElementById("analysis").innerHTML=dims.map(d=>{
let txt=d[1]<=12?"關鍵風險":"需優化";
return `<p><b>${d[0]}</b>：${txt}</p>`;
}).join('');

// 策略
let strategy="";
if(total<=50){
strategy="建議啟動組織重整（90天）";
}
else if(total<=75){
strategy="建議導入流程與溝通優化（60天）";
}
else{
strategy="建議持續優化並建立標準化";
}
document.getElementById("strategy").innerText=strategy;

</script>

</body>
</html>
