<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTF 組織診斷結果報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --high: #ff4d4f; --mid: #faad14; --low: #52c41a;
            --primary: #1a3a63; --bg: #f8f9fb;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .report-container { max-width: 950px; margin: auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        .main-header { text-align: center; margin-bottom: 30px; }
        .main-header h1 { font-size: 32px; color: var(--primary); margin: 0; }
        .main-header p { color: #888; font-size: 15px; margin-top: 10px; }

        /* 頂部風險等級區 */
        .risk-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; border: 1px solid #f0f0f0; border-radius: 10px; padding: 25px; align-items: center; }
        .risk-left { display: flex; align-items: center; gap: 25px; border-right: 1px solid #eee; }
        .circle-ui { width: 100px; height: 100px; border: 10px solid #eee; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
        .risk-info h2 { margin: 0; font-size: 30px; }
        .risk-info p { font-size: 13px; color: #777; margin-top: 5px; line-height: 1.5; }
        
        .risk-right { padding-left: 15px; }
        .legend-list { list-style: none; padding: 0; font-size: 13px; line-height: 2.2; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

        /* 數據顯示區 (縮小雷達圖部分) */
        .visual-row { display: grid; grid-template-columns: 1.4fr 0.6fr; gap: 20px; margin-bottom: 40px; }
        .section-h { font-size: 16px; font-weight: bold; color: var(--primary); margin-bottom: 20px; border-left: 4px solid var(--primary); padding-left: 10px; }
        
        .bar-item { margin-bottom: 20px; position: relative; }
        .bar-label { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: bold; margin-bottom: 8px; }
        .bar-track { background: #f0f2f5; height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 1.5s ease; }
        .bar-status { font-size: 11px; position: absolute; right: 0; bottom: -18px; font-weight: bold; }

        .radar-box { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #radarChart { max-width: 180px !important; max-height: 180px !important; } /* 強制縮小 1/2 */

        /* AI 卡片區 (1x4 橫排) */
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 40px; }
        .ai-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 10px; padding: 15px; border-top: 5px solid var(--primary); display: flex; flex-direction: column; }
        .ai-card-h { font-weight: bold; font-size: 13px; margin-bottom: 10px; color: var(--primary); display: flex; align-items: center; gap: 5px; }
        .ai-card p { font-size: 11.5px; color: #666; line-height: 1.6; margin-bottom: 12px; text-align: justify; flex-grow: 1; }
        .ai-card b { font-size: 11.5px; display: block; margin-bottom: 6px; border-top: 1px solid #f9f9f9; padding-top: 10px; }
        .ai-card ul { padding-left: 12px; margin: 0; font-size: 10.5px; color: #777; }

        /* 總結區 */
        .summary-box { background: #f4f8ff; padding: 25px; border-radius: 12px; border-top: 5px solid var(--primary); }
        .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .step-card { background: #fff; padding: 12px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .step-n { width: 24px; height: 24px; background: #e6efff; color: var(--primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
        .step-t { font-size: 12px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="report-container">
    <div class="main-header">
        <h1>MMTF 組織診斷報告</h1>
        <p>透過數據洞察組織管理效能與心理安全文化</p>
    </div>

    <div class="risk-section">
        <div class="risk-left">
            <div class="circle-ui" id="risk-circle">
                <span id="total-score" style="font-size:32px;">0</span>
                <span style="font-size:10px; color:#999;">/ 100</span>
            </div>
            <div class="risk-info">
                <h2 id="level-name">載入中...</h2>
                <p>數據顯示多項指標低於標準值，組織結構可能處於「系統性失效」初期。</p>
            </div>
        </div>
        <div class="risk-right">
            <ul class="legend-list">
                <li><span class="dot" style="background:var(--high)"></span> <b>高風險 (0-50分)</b>：需立即介入改善</li>
                <li><span class="dot" style="background:var(--mid)"></span> <b>中風險 (51-75分)</b>：建議積極強化優化</li>
                <li><span class="dot" style="background:var(--low)"></span> <b>低風險 (76-100分)</b>：狀態良好，持續維持</li>
            </ul>
        </div>
    </div>

    <div class="visual-row">
        <div>
            <div class="section-h">📊 四大維度量化結果</div>
            <div id="bar-box"></div>
        </div>
        <div class="radar-box">
            <div class="section-h" style="width: 100%; text-align: left;">🕸️ 雷達分佈圖</div>
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <div class="section-h">🧠 AI 實證分析建議</div>
    <div class="ai-grid" id="ai-row"></div>

    <div class="summary-box">
        <div class="section-h" style="margin-top:0;">💡 綜合分析總結</div>
        <p style="font-size:13.5px; line-height:1.7; color:#1a3a63;">當前總分 42 分屬於高風險。管理層應優先聚焦於「Mirror (鏡像)」與「Matrix (結構)」的對齊，改善資訊阻塞問題，並重建基層的安全感以防止人才流失。</p>
        <div class="steps" id="steps-box"></div>
    </div>
</div>

<script>
window.onload = function() {
    const url = new URLSearchParams(window.location.search);
    const data = {
        mirror: parseInt(url.get('mirror')) || 0,
        matrix: parseInt(url.get('matrix')) || 0,
        flow: parseInt(url.get('flow')) || 0,
        safe: parseInt(url.get('safe')) || 0
    };
    const total = data.mirror + data.matrix + data.flow + data.safe;
    document.getElementById('total-score').innerText = total;

    // 風險判定與顏色設定
    let rank = { n: "高風險", c: "var(--high)" };
    if(total > 50 && total <= 75) rank = { n: "中風險", c: "var(--mid)" };
    else if(total > 75) rank = { n: "低風險", c: "var(--low)" };
    
    document.getElementById('level-name').innerText = rank.n;
    document.getElementById('level-name').style.color = rank.c;
    document.getElementById('risk-circle').style.borderColor = rank.c;

    // MMTF 分析內容庫
    const lib = [
        { k:'mirror', l:'Mirror (鏡像)', d:'認知落差大。管理者自我覺察與員工感受存在斷層，導致回饋機制失效。', act:['建立360度回饋','強化管理透明度'] },
        { k:'matrix', l:'Matrix (結構)', d:'權責劃分不清，指令傳遞在矩陣式結構中產生重疊與推諉現象。', act:['重新定義RACI矩陣','優化核決路徑'] },
        { k:'flow', l:'Flow (資訊流)', d:'資訊孤島嚴重。關鍵數據傳遞受阻，導致跨部門協作成本極高。', act:['導入數位透明看板','規範同步會議'] },
        { k:'safe', l:'Safe (心理安全)', d:'團隊缺乏包容。員工因擔心錯誤而隱匿真相，阻礙組織創新動能。', act:['推行無責異常申報','建立心理安全對話'] }
    ];

    let barsH = ""; let aiH = "";
    lib.forEach(i => {
        let v = data[i.k];
        let color = v <= 12 ? "var(--high)" : v <= 18 ? "var(--mid)" : "var(--low)";
        barsH += `<div class="bar-item">
            <div class="bar-label"><span>${i.l}</span><span>${v}/25</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${v*4}%; background:${color}"></div></div>
            <span class="bar-status" style="color:${color}">${v<=12?'高風險':'穩定'}</span>
        </div>`;
        aiH += `<div class="ai-card" style="border-top-color:${color}">
            <div class="ai-card-h"><span style="color:${color}">●</span> ${i.l}</div>
            <p>${i.d}</p>
            <b>行動建議</b>
            <ul>${i.act.map(a => `<li>${a}</li>`).join('')}</ul>
        </div>`;
    });
    document.getElementById('bar-box').innerHTML = barsH;
    document.getElementById('ai-row').innerHTML = aiH;

    const st = ["數據透明化揭露", "權責矩陣重導", "溝通渠道優化", "安全文化建設"];
    document.getElementById('steps-box').innerHTML = st.map((s, i) => `
        <div class="step-card"><div class="step-n">${i+1}</div><div class="step-t">${s}</div></div>
    `).join('');

    // 雷達圖
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ['Mirror', 'Matrix', 'Flow', 'Safe'],
            datasets: [{
                data: [data.mirror, data.matrix, data.flow, data.safe],
                backgroundColor: 'rgba(255, 77, 79, 0.2)',
                borderColor: '#ff4d4f',
                pointBackgroundColor: '#ff4d4f',
                borderWidth: 2,
                pointRadius: 2
            }]
        },
        options: {
            maintainAspectRatio: true,
            scales: { r: { min: 0, max: 25, ticks: { display: false } } },
            plugins: { legend: { display: false } }
        }
    });
};
</script>
</body>
</html>
