<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTF 組織診斷結果報告（含分析模組）</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --high:#ff4d4f;--mid:#faad14;--low:#52c41a;--primary:#4a90e2;
            --bg:#f8f9fb;--card-bg:#fff;
        }
        body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);margin:0;padding:20px;color:#333;}
        .container{max-width:1000px;margin:auto;background:var(--card-bg);padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.05);}
        .summary-box{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:#fff;border:1px solid #f0f0f0;border-radius:15px;padding:25px;margin-bottom:30px;}
        .total-score-circle{width:120px;height:120px;border:10px solid var(--high);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:auto;}
        .dim-section{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-bottom:40px;}
        .progress-bar-bg{background:#eee;height:12px;border-radius:6px;overflow:hidden;margin:8px 0;}
        .progress-bar-fill{height:100%;border-radius:6px;transition:width 1s ease;}
        .analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px;}
        .analysis-card{background:#fff;border:1px solid #ffeef0;padding:20px;border-radius:12px;}
        .analysis-card.high{background:#fff1f0;border-color:#ffccc7;}
        .analysis-card.mid{background:#fffbe6;border-color:#ffe58f;}
        .analysis-card.low{background:#f6ffed;border-color:#b7eb8f;}
        .suggest-footer{background:#f0f7ff;padding:25px;border-radius:12px;border-left:6px solid var(--primary);margin-top:30px;}
    </style>
</head>
<body>
<div class="container">

<h1 style="text-align:center;">MMTF 組織診斷報告（AI分析升級版）</h1>

<div class="summary-box">
    <div style="display:flex;gap:20px;align-items:center;">
        <div class="total-score-circle" id="circle">
            <span id="total" style="font-size:36px;font-weight:bold;">0</span>
            <span style="font-size:12px;">/100</span>
        </div>
        <div>
            <h2 id="level">分析中</h2>
            <p style="font-size:13px;color:#666;">整體組織風險評估</p>
        </div>
    </div>
</div>

<div class="dim-section">
    <div id="bars"></div>
    <canvas id="radar"></canvas>
</div>

<h3>🧠 AI進階分析模組</h3>
<div id="aiModule" class="analysis-grid"></div>

<div class="suggest-footer">
    <h3>📌 組織診斷策略建議（進階版）</h3>
    <div id="strategy"></div>
</div>

</div>

</html>
