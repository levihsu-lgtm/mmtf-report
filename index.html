<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 組織診斷結果報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --high: #ff4d4f; --mid: #faad14; --low: #52c41a; --primary: #1a3a63; --bg: #f8f9fb; }
        body { font-family: "PingFang TC", sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 36px; margin: 0; color: #000; }
        
        /* 頂部風險區 */
        .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .risk-card { border: 1px solid #f0f0f0; border-radius: 10px; padding: 20px; display: flex; align-items: center; }
        .score-circle { width: 100px; height: 100px; border: 10px solid var(--high); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-right: 20px; font-weight: bold; }
        .score-val { font-size: 32px; color: var(--high); }
        .risk-label { font-size: 28px; color: var(--high); font-weight: bold; margin: 0; }
        .legend-list { list-style: none; padding: 0; font-size: 13px; line-height: 2; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

        /* 數據區 */
        .data-row { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 30px; margin-bottom: 30px; }
        .bar-item { margin-bottom: 15px; position: relative; }
        .bar-info { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .bar-track { background: #eee; height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; }
        .bar-status { position: absolute; right: -55px; top: 20px; font-size: 11px; font-weight: bold; color: var(--high); }
        #radarChart { max-width: 180px !important; max-height: 180px !important; }

        /* AI 卡片 */
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 30px; }
        .ai-card { border: 1px solid #f0f0f0; border-radius: 8px; padding: 15px; border-top: 5px solid var(--primary); }
        .ai-h { font-weight: bold; font-size: 13px; color: var(--high); margin-bottom: 8px; }
        .ai-p { font-size: 11px; color: #666; line-height: 1.6; margin-bottom: 10px; min-height: 60px; }
        .ai-act { font-size: 11px; font-weight: bold; border-top: 1px solid #eee; padding-top: 8px; margin-bottom: 5px; display: block; }
        .ai-ul { padding-left: 12px; margin: 0; font-size: 10px; color: #777; }

        /* 底部建議 */
        .footer-box { background: #f4f8ff; padding: 20px; border-radius: 10px; border-top: 4px solid var(--primary); }
        .step-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .step { background: #fff; padding: 12px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .step-n { width: 22px; height: 22px; background: #e6efff; color: var(--primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MMTF 組織診斷報告</h1>
        <p style="font-size: 14px; color: #888;">透過四大維度評估組織當前運作狀態，提供改善建議與行動方向</p>
    </div>

    <div class="top-row">
        <div class="risk-card">
            <div class="score-circle"><span class="score-val" id="totalVal">0</span><span style="font-size:10px; color:#999;">/ 100</span></div>
            <div><h2 class="risk-label">高風險</h2><p style="font-size:12px; color:#666; margin:5px 0 0 0;">組織存在明顯風險，建議優先改善。</p></div>
        </div>
        <div class="risk-card" style="display:block;">
            <div style="font-weight:bold; font-size:14px; margin-bottom:10px;">💡 風險等級說明</div>
            <ul class="legend-list">
                <li><span class="dot" style="background:var(--high)"></span> 高風險 (0-50分)：需立即關注改善</li>
                <li><span class="dot" style="background:var(--mid)"></span> 中風險 (51-75分)：建議積極強化</li>
                <li><span class="dot" style="background:var(--low)"></span> 低風險 (76-100分)：狀態良好持續維持</li>
            </ul>
        </div>
    </div>

    <div class="data-row">
        <div>
            <div style="font-weight:bold; margin-bottom:20px;">📊 四大維度得分</div>
            <div id="bars"></div>
        </div>
        <div style="text-align:center;">
            <div style="font-weight:bold; margin-bottom:15px; text-align:left;">🕸️ 診斷雷達圖</div>
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <div style="font-weight:bold; margin-bottom:15px;">🧠 AI 分析結果</div>
    <div class="ai-grid" id="aiCards"></div>

    <div class="footer-box">
        <div style="font-weight:bold; font-size:14px;">💡 總結與建議</div>
        <p style="font-size:12px; color:var(--primary); margin:10px 0;">整體處於高風險狀態，應優先聚焦於 Mirror 與 Matrix 的對齊，重建基層安全感。</p>
        <div class="step-grid" id="steps"></div>
    </div>
</div>

<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const data = { mirror: 12, matrix: 10, flow: 10, safe: 10 }; // 依網址數據
    const total = data.mirror + data.matrix + data.flow + data.safe;
    document.getElementById('totalVal').innerText = total;

    const config = [
        { k:'mirror', l:'Mirror (鏡像)', d:'回饋機制薄弱，認知落差大。', a:['建立雙向回饋','強化主管傾聽'] },
        { k:'matrix', l:'Matrix (結構)', d:'職責劃分不清，容易造成權責不明。', a:['釐清角色職責','優化組織架構'] },
        { k:'flow', l:'Flow (資訊流)', d:'資訊流通不順，導致協作效率低落。', a:['建立共享平台','減少傳遞層級'] },
        { k:'safe', l:'Safe (心理安全)', d:'員工擔心犯錯，隱匿真相影響創新。', a:['建立包容文化','鼓勵表達觀點'] }
    ];

    let bH = ""; let aH = "";
    config.forEach(i => {
        bH += `<div class="bar-item">
            <div class="bar-info"><span>${i.l}</span><span>${data[i.k]}/25</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${data[i.k]*4}%; background:var(--high)"></div></div>
            <span class="bar-status">高風險</span>
        </div>`;
        aH += `<div class="ai-card">
            <div class="ai-h">● ${i.l} 偏低</div>
            <div class="ai-p">${i.d}</div><b class="ai-act">建議行動</b>
            <ul class="ai-ul">${i.a.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>`;
    });
    document.getElementById('bars').innerHTML = bH;
    document.getElementById('aiCards').innerHTML = aH;

    const st = ["數據透明揭露", "權責矩陣重導", "溝通渠道優化", "安全文化建設"];
    document.getElementById('steps').innerHTML = st.map((s,i)=>`<div class="step"><div class="step-n">${i+1}</div><div style="font-size:10px; font-weight:bold;">${s}</div></div>`).join('');

    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ['Mirror', 'Matrix', 'Flow', 'Safe'],
            datasets: [{ data:[12,10,10,10], backgroundColor:'rgba(255,77,79,0.2)', borderColor:'#ff4d4f', borderWidth:2 }]
        },
        options: { scales:{ r:{ min:0, max:25, ticks:{display:false} } }, plugins:{ legend:{display:false} } }
    });
};
</script>
</body>
</html>
