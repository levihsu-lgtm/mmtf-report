<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTF 專家診斷系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --high: #ff4d4f; --mid: #faad14; --low: #52c41a;
            --primary: #1a3a63; --bg: #f8fafc;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); }
        
        /* 標題與整體性診斷 */
        .header-box { border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        .overall-card { background: #f0f7ff; border-radius: 12px; padding: 25px; margin-bottom: 30px; border-left: 8px solid var(--primary); }

        /* 圖表佈局 */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .score-bar-unit { margin-bottom: 18px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .bar-track { background: #eee; height: 12px; border-radius: 6px; overflow: hidden; }
        .bar-inner { height: 100%; transition: width 1s ease-in-out; }

        /* AI 理論庫卡片 */
        .theory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .theory-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background: #fff; border-top: 4px solid #cbd5e1; }
        .theory-tag { font-size: 11px; font-weight: bold; color: var(--primary); background: #eef5ff; padding: 2px 8px; border-radius: 4px; }
        .theory-title { font-size: 17px; font-weight: bold; margin: 10px 0; display: flex; justify-content: space-between; }
        .theory-content { font-size: 13.5px; line-height: 1.6; color: #555; margin-bottom: 15px; }
        .evidence-list { font-size: 13px; color: #444; padding-left: 18px; border-top: 1px dashed #eee; padding-top: 10px; }

        /* 行動建議圖 */
        .step-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .step-item { background: #fff; border: 1px solid #d0e3ff; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--primary); }
        .step-num { font-weight: bold; color: var(--primary); font-size: 20px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div>
            <h1 style="margin:0;">MMTF 組織氣候與管理效能診斷</h1>
            <p style="margin:5px 0 0 0; color:#666;">Mirror Matrix Theory Feedback - 智慧化顧問分析報告</p>
        </div>
        <div id="date-ui" style="font-size:12px; color:#999;"></div>
    </div>

    <div class="overall-card">
        <h3 style="margin:0 0 10px 0;">🎯 整體組織效能判別：<span id="holistic-title">分析中...</span></h3>
        <p id="holistic-desc" style="margin:0; font-size:14.5px; line-height:1.7; color:#334155;"></p>
    </div>

    <div class="main-grid">
        <div class="card">
            <h4 style="margin-top:0;">📊 各維度量化指標</h4>
            <div id="bars-ui"></div>
        </div>
        <div class="card" style="text-align:center;">
            <h4 style="margin-top:0;">🕸️ 診斷模型雷達圖</h4>
            <canvas id="radarChart" style="max-height:240px;"></canvas>
        </div>
    </div>

    <h3 style="margin: 40px 0 20px 0;">🧠 深度維度理論對照 (理論與實證分析)</h3>
    <div class="theory-grid" id="theory-ui"></div>

    <h3 style="margin: 40px 0 20px 0;">🚀 階段性行動建議 (Step-by-Step)</h3>
    <div class="step-row" id="steps-ui"></div>
</div>

<script>
window.onload = function() {
    const p = new URLSearchParams(window.location.search);
    const s = {
        mirror: parseInt(p.get('mirror')) || 0,
        matrix: parseInt(p.get('matrix')) || 0,
        flow: parseInt(p.get('flow')) || parseInt(p.get('informationFlow')) || 0,
        safe: parseInt(p.get('safe')) || parseInt(p.get('psychologicalSafety')) || 0
    };
    
    document.getElementById('date-ui').innerText = "診斷時間：" + new Date().toLocaleDateString();

    // 1. 理論庫數據結構
    const theoryDb = {
        mirror: {
            name: "Mirror (鏡像回饋)", theory: "回饋環路理論 (Feedback Loop)",
            low: "文獻指出認知落差 >40% 會導致管理失靈。Mirror 分數偏低代表組織存在「過度自我感覺良好」或「基層噤聲」現象。",
            high: "具備高品質的鏡像回饋，能有效降低管理盲點，促進組織的自我修正能力。",
            evidence: ["導入雙向 360 度匿名回饋", "建立定期的認知對齊會議"]
        },
        matrix: {
            name: "Matrix (結構權責)", theory: "權變理論與 RACI 模型",
            low: "得分低反映結構混亂。依據組織效能研究，權責不明是導致專案延宕 35% 以上的主因，造成人力重疊與資源內耗。",
            high: "穩定的 Matrix 結構提供明確的行動指南，使決策路徑縮短，提升執行力。",
            evidence: ["釐清崗位說明書 (JD) 與職責", "優化決策層級與核准流程"]
        },
        flow: {
            name: "Flow (資訊效能)", theory: "資訊傳遞效能模型",
            low: "資訊流阻塞會產生「資訊孤島」。實證研究顯示，資訊不對稱會降低團隊協作意願並提高錯誤率。",
            high: "高效率流動確保決策依據即時且精準，是組織邁向數位轉型成功的基礎指標。",
            evidence: ["建立視覺化數據中心 (Dashboard)", "減少冗長會議，推動非同步溝通"]
        },
        safe: {
            name: "Safety (心理安全)", theory: "Amy Edmondson 安全感框架",
            low: "得分偏低警告：員工因恐懼處罰而隱匿錯誤。這是半導體等精密工業中引發重大事故的隱形殺手。",
            high: "高度安全感鼓勵實驗精神與誠實反饋，是驅動持續改善 (Kaizen) 的核心引擎。",
            evidence: ["建立無責申報機制 (No-Blame)", "推行領導力行為準則培訓"]
        }
    };

    // 2. 整體性邏輯判斷 (Holistic Strategy)
    function analyzeHolistic(s) {
        const total = s.mirror + s.matrix + s.flow + s.safe;
        const top = (s.mirror + s.matrix) / 2;
        const bot = (s.flow + s.safe) / 2;
        
        if (total <= 40) return { t: "全面性系統失效", d: "組織目前處於極高風險。結構混亂且心理安全感極低，建議立即停止擴張，優先進行內部管理重整。" };
        if (top > 18 && bot < 12) return { t: "官僚阻塞型組織", d: "雖然有強大的結構與管理指標，但底層資訊流動與安全感極差，易導致人才大量流失。" };
        if (top < 12 && bot > 18) return { t: "鬆散自發型組織", d: "團隊氛圍良好且願意溝通，但缺乏結構與目標校準，導致行動力分散，難以達成關鍵 KPI。" };
        if (total >= 75) return { t: "高效能卓越模型", d: "組織各維度平衡發展。應致力於將此文化標準化，成為企業的核心競爭力。" };
        return { t: "轉型期過渡狀態", d: "組織正處於改善的過程中，建議針對得分最低的特定維度進行精準打擊。" };
    }

    const holistic = analyzeHolistic(s);
    document.getElementById('holistic-title').innerText = holistic.t;
    document.getElementById('holistic-desc').innerText = holistic.d;

    // 3. 渲染 UI
    let barsHtml = ""; let theoryHtml = "";
    Object.keys(theoryDb).forEach(key => {
        const val = s[key];
        const db = theoryDb[key];
        const color = val <= 12 ? "var(--high)" : val <= 18 ? "var(--mid)" : "var(--low)";
        
        // Bar
        barsHtml += `
            <div class="score-bar-unit">
                <div class="bar-label"><span>${db.name}</span><span>${val}/25</span></div>
                <div class="bar-track"><div class="bar-inner" style="width:${val*4}%; background:${color}"></div></div>
            </div>`;
        
        // Theory Card
        theoryHtml += `
            <div class="theory-card" style="border-top-color:${color}">
                <span class="theory-tag">${db.theory}</span>
                <div class="theory-title"><span>${db.name} 診斷</span> <span style="color:${color}">${val <= 15 ? '警戒' : '穩定'}</span></div>
                <div class="theory-content">${val <= 15 ? db.low : db.high}</div>
                <div class="evidence-list">
                    <strong>實證改善方向：</strong>
                    <ul style="margin:5px 0">${db.evidence.map(e => `<li>${e}</li>`).join('')}</ul>
                </div>
            </div>`;
    });
    document.getElementById('bars-ui').innerHTML = barsHtml;
    document.getElementById('theory-ui').innerHTML = theoryHtml;

    // 4. 行動建議
    const steps = ["痛點共識與數據揭露", "建立跨部門專案小組", "制度化管理工具導入", "定期滾動式診斷復盤"];
    document.getElementById('steps-ui').innerHTML = steps.map((txt, i) => `
        <div class="step-item"><div class="step-num">0${i+1}</div><div class="step-txt">${txt}</div></div>
    `).join('');

    // 5. 圖表
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ['Mirror', 'Matrix', 'Flow', 'Safety'],
            datasets: [{
                data: [s.mirror, s.matrix, s.flow, s.safe],
                backgroundColor: 'rgba(26, 58, 99, 0.15)',
                borderColor: '#1a3a63',
                borderWidth: 2,
                pointBackgroundColor: '#1a3a63'
            }]
        },
        options: {
            scales: { r: { min: 0, max: 25, ticks: { display: false } } },
            plugins: { legend: { display: false } }
        }
    });
};
</script>
</body>
</html>
