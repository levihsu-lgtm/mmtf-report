<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTF 顧問診斷報告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--high:#ff4d4f;--mid:#faad14;--low:#52c41a;
--primary:#1a3a63;
}
body{
margin:0;
font-family:"Microsoft JhengHei";
background:#f5f7fb;
}
.container{
width:1000px;
height:680px;
margin:auto;
background:#fff;
padding:25px;
box-sizing:border-box;
overflow:hidden;
}

/* header */
.header{text-align:center;margin-bottom:10px;}
.header h1{margin:0;color:var(--primary);font-size:22px;}
.sub{font-size:12px;color:#888;}

/* top */
.top{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:10px;
}
.card{
border:1px solid #eee;
border-radius:8px;
padding:10px;
}

.circle{
width:90px;height:90px;
border:8px solid var(--mid);
border-radius:50%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:bold;
}

/* grid */
.grid{
display:grid;
grid-template-columns:1.3fr 0.7fr;
gap:10px;
}

/* bars */
.bar{margin-bottom:6px;font-size:12px;}
.bar-bg{height:6px;background:#eee;border-radius:4px;}
.bar-fill{height:6px;border-radius:4px;}

/* ai */
.ai{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin-top:6px;
}
.ai-card{
border:1px solid #eee;
border-radius:6px;
padding:6px;
font-size:11px;
}

/* summary */
.summary{
margin-top:8px;
padding:10px;
background:#f0f6ff;
border-radius:8px;
font-size:12px;
line-height:1.4;
}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>MMTF 組織診斷報告</h1>
<div class="sub">顧問分析版（單頁固定）</div>
</div>

<div class="top">
<div class="card" style="display:flex;gap:10px;align-items:center;">
<div class="circle" id="circle">0</div>
<div>
<div id="level"></div>
<div id="model" style="font-size:12px;color:#888;"></div>
</div>
</div>

<div class="card">
🔴高風險｜🟡中風險｜🟢低風險<br>
代表組織運作穩定程度
</div>
</div>

<div class="grid">

<div>
<div id="bars"></div>
<div class="ai" id="ai"></div>
</div>

<canvas id="radar"></canvas>

</div>

<div class="summary" id="summary"></div>

</div>

<script>
const p=new URLSearchParams(location.search);

const s={
mirror:+p.get('mirror')||0,
matrix:+p.get('matrix')||0,
flow:+p.get('flow')||0,
safe:+p.get('safe')||0
};

const total=s.mirror+s.matrix+s.flow+s.safe;
document.getElementById('circle').innerText=total;

/* 風險 */
let level="低風險",color="var(--low)";
if(total<=50){level="高風險";color="var(--high)"}
else if(total<=75){level="中風險";color="var(--mid)"}

document.getElementById('level').innerText=level;
document.getElementById('circle').style.borderColor=color;

/* 模型 */
function model(){
let top=(s.mirror+s.matrix)/2;
let bot=(s.flow+s.safe)/2;

if(top>=18&&bot<12) return "制度失真型";
if(top<12&&bot>=15) return "官僚失衡型";
if(top<12&&bot<12) return "全面崩壞型";
if(top>=18&&bot>=18) return "高效能型";
return "過渡型";
}
document.getElementById('model').innerText="模型："+model();

/* bars */
const dims=[
["Mirror",s.mirror],
["Matrix",s.matrix],
["Flow",s.flow],
["Safety",s.safe]
];

document.getElementById('bars').innerHTML=dims.map(d=>{
let c=d[1]<=12?"var(--high)":d[1]<=18?"var(--mid)":"var(--low)";
return `
<div class="bar">
${d[0]} ${d[1]}/25
<div class="bar-bg">
<div class="bar-fill" style="width:${d[1]*4}%;background:${c}"></div>
</div>
</div>`;
}).join("");

/* radar */
new Chart(document.getElementById('radar'),{
type:'radar',
data:{labels:["Mirror","Matrix","Flow","Safety"],
datasets:[{data:[s.mirror,s.matrix,s.flow,s.safe],
borderColor:"#1a3a63",backgroundColor:"rgba(26,58,99,.1)"}]},
options:{plugins:{legend:{display:false}},scales:{r:{min:0,max:25}}}
});

/* AI分析 */
const aiText=[
"管理認知落差",
"組織結構問題",
"資訊傳導效率",
"心理安全狀態"
];

document.getElementById('ai').innerHTML=aiText.map((t,i)=>{
let v=Object.values(s)[i];
return `<div class="ai-card">${t}<br>${v<=12?"高風險":"需優化"}</div>`;
}).join("");

/* 顧問結論 */
let summary="";

if(total<=50){
summary=`
【診斷結論】
組織已進入高風險狀態，屬於「${model()}」。

【核心問題】
管理認知存在，但結構與資訊流無法支撐執行。

【主要風險】
1. 決策失真
2. 組織內耗
3. 管理失效

【90天建議】
- 0~30天：重建組織結構
- 30~60天：建立資訊流
- 60~90天：提升心理安全
`;
}
else if(total<=75){
summary="組織處於中風險，需優化流程與溝通";
}
else{
summary="組織穩定，建議持續優化";
}

document.getElementById('summary').innerText=summary;

</script>
</body>
</html>
