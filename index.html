<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 組織氣候與管理效能診斷專業報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #1a3a63; --bg: #f0f2f5; --card-blue: #f8fafc; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background-color: #cbd5e1; display: flex; flex-direction: column; align-items: center; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        
        .report-container { width: 1100px; background: #fff; padding: 30px 40px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); color: #1e293b; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 30px; color: var(--primary); margin: 0; font-weight: 700; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 8px; }
        
        .top-risk-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-bottom: 20px; }
        .risk-main { border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; display: flex; align-items: center; background: #fff; border-left: 8px solid #eee; }
        .score-circle { width: 110px; height: 110px; border: 8px solid #eee; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-right: 25px; transition: all 0.8s ease; }
        .score-circle.animated { animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .score-val { font-size: 34px; font-weight: bold; line-height: 1; }
        .score-label { font-size: 11px; font-weight: bold; margin-top: 2px; }
        
        .section-title { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 12px; border-left: 5px solid var(--primary); padding-left: 10px; }
        
        /* 維度分析卡片內容緊湊化 */
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        .ai-card { background: #fff; border: 1px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
        .ai-card h4 { margin: 0 0 4px 0; color: var(--primary); font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
        .status-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: bold; }
        .ai-theory { font-size: 11px; color: #94a3b8; font-style: italic; margin-bottom: 8px; }
        .ai-content { font-size: 13px; line-height: 1.4; color: #334155; margin-bottom: 8px; }
        .ai-content strong { display: inline-block; margin-top: 4px; color: #1e293b; }
        .action-list-title { font-size: 13px; font-weight: bold; color: #1e293b; margin-bottom: 4px; border-top: 1px solid #f1f5f9; padding-top: 8px; }
        .action-list { list-style: none; padding: 0; margin: 0; }
        .action-list li { font-size: 12px; color: #475569; margin-bottom: 2px; display: flex; align-items: flex-start; gap: 5px; line-height: 1.3; }
        .action-list li::before { content: '•'; color: var(--primary); }
        
        .mid-row { display: grid; grid-template-columns: 0.4fr 1.6fr; gap: 30px; margin-bottom: 25px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
        .radar-box { text-align: center; border-right: 1px solid #f1f5f9; padding-right: 15px; }
        #radarChart { max-width: 150px !important; margin: 0 auto; }
        .conclusion-box { font-size: 14px; line-height: 1.6; color: #334155; }
        
        .bottom-row { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 25px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
        .steps-box { background: var(--card-blue); padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .step-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; position: relative; }
        .step-item:not(:last-child)::after { content: ''; position: absolute; left: 13px; top: 28px; width: 2px; height: calc(100% - 10px); background: #cbd5e1; }
        .step-num { width: 26px; height: 26px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .step-txt { font-size: 13px; padding-top: 3px; color: #334155; }
        
        .remind-box { padding: 15px; border-radius: 12px; border: 1px dashed #ccc; }
        .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>
<div class="report-container">
    <div class="header"><h1>MMTF 組織診斷與實證分析報告</h1></div>

    <div class="top-risk-row">
        <div class="risk-main" id="riskMainCard">
            <div class="score-circle" id="totalScoreCircle">
                <span class="score-val" id="totalScoreVal">--</span>
                <span class="score-label" id="scoreLabel">分析中</span>
            </div>
            <div class="risk-text">
                <h2 id="riskTitle" style="margin:0;">計算中...</h2>
                <p id="riskDesc" style="font-size:13px; color:#64748b; margin:4px 0 0 0;"></p>
            </div>
        </div>
        <div class="risk-main" style="display:block; background:#fff; border-left:none;">
            <div style="font-weight:bold; font-size:13px; margin-bottom:6px;">📊 MMTF 指標定義</div>
            <p style="font-size:12px; color:#666; line-height:1.5; margin:0;">本診斷透過對稱性理論評估管理能量。分數越高代表組織風險越低[cite: 1]。</p>
        </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-brain"></i> 實證維度分析</div>
    <div class="ai-grid" id="aiGrid"></div>

    <div class="mid-row">
        <div class="radar-box">
            <canvas id="radarChart"></canvas>
            <p style="font-size:10px; color:#94a3b8; margin-top:5px;">MMTF 四維雷達圖</p>
        </div>
        <div class="conclusion-box">
            <h3 style="margin-top:0; color:var(--primary); font-size:18px;">🔍 診斷綜合結論</h3>
            <div id="conclusionText"></div>
        </div>
    </div>

    <div class="bottom-row">
        <div class="steps-box">
            <h4 style="margin:0 0 10px 0; color:var(--primary);">🚀 下一步行動指南</h4>
            <div id="stepsContainer"></div>
        </div>
        <div class="remind-box" id="remindBox">
            <h4 style="margin-top:0; font-size:15px; color:var(--primary);">💡 顧問關鍵提醒</h4>
            <p id="remindText" style="font-size:13px; line-height:1.5; color:#475569; margin:0;"></p>
        </div>
    </div>
    <div class="footer" id="reportDate"></div>
</div>

<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const scores = { mirror: parseInt(params.get('mirror')) || 15, matrix: parseInt(params.get('matrix')) || 15, flow: parseInt(params.get('flow')) || 15, safe: parseInt(params.get('safe')) || 15 };
    const totalScore = Math.round(((scores.mirror + scores.matrix + scores.flow + scores.safe) / 100) * 100);
    
    const insightDB = {
        mirror: { title: "Mirror (鏡像對稱)", theory: "Johari Window", 
            high: { status: "認知共振", color: "#52c41a", insight: "團隊目標認知高度一致。", impact: "決策傳達無須重複確認。", actions: ["建立跨部門共享機制","建立長期追蹤指標 (KPI)"] },
            mid:  { status: "認知雜訊", color: "#faad14", insight: "對策略理解存在細微落差。", impact: "執行過程中可能出現偏差。", actions: ["啟動雙向回饋機制","建立長期追蹤指標 (KPI)"] },
            low:  { status: "認知斷層", color: "#ff4d4f", insight: "認知嚴重不對稱，存在黑箱。", impact: "指示傳遞失真，員工有無力感。", actions: ["召開資訊對齊會議","建立長期追蹤指標 (KPI)"] }
        },
        matrix: { title: "Matrix (結構效能)", theory: "RACI Theory", 
            high: { status: "靈活治理", color: "#52c41a", insight: "權責邊界清晰具彈性。", impact: "溝通成本極低，自主性強。", actions: ["導入去中心化決策","建立長期追蹤指標 (KPI)"] },
            mid:  { status: "職能重疊", color: "#faad14", insight: "權責基本明確，仍有灰色地帶。", impact: "效率耗損，推諉現象偶發。", actions: ["梳理 RACI 矩陣","建立長期追蹤指標 (KPI)"] },
            low:  { status: "結構失序", color: "#ff4d4f", insight: "權責模糊，當責機制失效。", impact: "內耗嚴重，專案停滯。", actions: ["啟動架構診斷","建立長期追蹤指標 (KPI)"] }
        },
        flow: { title: "Flow (資訊能流)", theory: "Communication Theory", 
            high: { status: "透明流動", color: "#52c41a", insight: "數據驅動決策已成為文化。", impact: "反應時間優於同業平均。", actions: ["導入資訊摘要優化","建立長期追蹤指標 (KPI)"] },
            mid:  { status: "節點阻塞", color: "#faad14", insight: "資訊在特定管理層級阻塞。", impact: "基層反應問題存在延遲。", actions: ["建立儀表板回報系統","建立長期追蹤指標 (KPI)"] },
            low:  { status: "資訊孤島", color: "#ff4d4f", insight: "資訊碎片化，僅掌握局部。", impact: "策略扭曲，決策依賴直覺。", actions: ["建立核心數據透明化","建立長期追蹤指標 (KPI)"] }
        },
        safe: { title: "Safety (心理安全)", theory: "Psychological Safety", 
            high: { status: "無畏創新", color: "#52c41a", insight: "團隊容錯率高，具學習力。", impact: "員工敢於挑戰現狀。", actions: ["建立無責回報機制","建立長期追蹤指標 (KPI)"] },
            mid:  { status: "條件信任", color: "#faad14", insight: "信任依賴利益，仍有保留。", impact: "負面消息傳遞緩慢。", actions: ["強化脆弱領導力","建立長期追蹤指標 (KPI)"] },
            low:  { status: "恐懼氛圍", color: "#ff4d4f", insight: "防衛行為主導，隱瞞錯誤。", impact: "失去糾錯能力，風險積聚。", actions: ["停止懲罰，重建邊界","建立長期追蹤指標 (KPI)"] }
        }
    };

    function getLevel(s) { return s >= 18 ? 'high' : (s >= 12 ? 'mid' : 'low'); }
    const worstKey = Object.keys(scores).reduce((a, b) => scores[a] < scores[b] ? a : b);
    const bestKey = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);

    let lv = totalScore >= 70 ? { label: "卓越", color: "#52c41a", bg: "#f6ffed", title: "高能卓越型 (Optimized)", desc: "具備強大的對稱性能量傳導。", remind: "預防「優勢陷阱」。" } :
             totalScore >= 45 ? { label: "警示", color: "#faad14", bg: "#fffbe6", title: "亞健康運作型 (Vulnerable)", desc: "特定維度存在嚴重耗損。", remind: `優先修復「${insightDB[worstKey].title}」。` } :
             { label: "危機", color: "#ff4d4f", bg: "#fff1f0", title: "高風險失能型 (Fragile)", desc: "系統架構已嚴重毀損。", remind: "重建心理安全感為首要。" };

    const circle = document.getElementById('totalScoreCircle');
    circle.style.borderColor = lv.color; circle.classList.add('animated');
    document.getElementById('totalScoreVal').innerText = totalScore;
    document.getElementById('totalScoreVal').style.color = lv.color;
    document.getElementById('scoreLabel').innerText = lv.label;
    document.getElementById('scoreLabel').style.color = lv.color;
    document.getElementById('riskMainCard').style.borderColor = lv.color;
    document.getElementById('riskMainCard').style.background = `linear-gradient(135deg, #fff 0%, ${lv.bg} 100%)`;
    document.getElementById('riskTitle').innerText = lv.title; document.getElementById('riskTitle').style.color = lv.color;
    document.getElementById('riskDesc').innerText = lv.desc; document.getElementById('remindText').innerText = lv.remind;

    const aiGrid = document.getElementById('aiGrid');
    ['mirror', 'matrix', 'flow', 'safe'].forEach(key => {
        const d = insightDB[key][getLevel(scores[key])];
        aiGrid.innerHTML += `
            <div class="ai-card" style="border-top-color: ${d.color}">
                <h4>${insightDB[key].title} <span class="status-tag" style="background:${d.color}22; color:${d.color}">${d.status}</span></h4>
                <div class="ai-theory">${insightDB[key].theory}</div>
                <div class="ai-content"><strong>洞察：</strong>${d.insight}<br><strong>影響：</strong>${d.impact}</div>
                <div class="action-list-title">顧問行動建議</div>
                <ul class="action-list">${d.actions.map(act => `<li>${act}</li>`).join('')}</ul>
            </div>
        `;
    });

    // 文獻建議與詳細結論回歸[cite: 1]
    const bestS = insightDB[bestKey][getLevel(scores[bestKey])].status;
    const worstS = insightDB[worstKey][getLevel(scores[worstKey])].status;
    document.getElementById('conclusionText').innerHTML = `
        本次診斷顯示，組織的核心對稱性指標為 <b>${totalScore}%</b>[cite: 1]。<br>
        最顯著的優勢在於 <b>${insightDB[bestKey].title} (${scores[bestKey]}分)</b>，
        而系統最脆弱的節點則位於 <b>${insightDB[worstKey].title} (${scores[worstKey]}分)</b>[cite: 1]。<br><br>
        這意味著組織雖然在「<strong>${bestS}</strong>」上具備優勢，但整體效能正被「<strong>${worstS}</strong>」所限制[cite: 1]。<br><br>
        <strong>戰略建議：</strong>應優先修復最低構面，避免其成為系統瓶頸[cite: 1]。
    `;

    const steps = [
        `修復專案：針對 ${insightDB[worstKey].title} 進行深度對齊會議[cite: 1]`,
        `優化流程：重新梳理跨維度的 RACI 權責與資訊能流[cite: 1]`,
        `發揮價值：將 ${insightDB[bestKey].title} 的優勢平移至其他部門[cite: 1]`,
        `持續追蹤：啟動 MMTF 每季回測機制，監控認知落差[cite: 1]`
    ];
    document.getElementById('stepsContainer').innerHTML = steps.map((s, i) => `
        <div class="step-item"><div class="step-num">${i+1}</div><div class="step-txt">${s}</div></div>
    `).join('');

    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ["Mirror", "Matrix", "Flow", "Safety"],
            datasets: [{ data: [scores.mirror, scores.matrix, scores.flow, scores.safe], backgroundColor: `${lv.color}22`, borderColor: lv.color, borderWidth: 2 }]
        },
        options: { scales: { r: { min: 0, max: 25, ticks: { display: false } } }, plugins: { legend: { display: false } } }
    });
    document.getElementById('reportDate').innerText = `報告生成日期：${new Date().toISOString().split('T')[0]}`;
};
</script>
</body>
</html>
