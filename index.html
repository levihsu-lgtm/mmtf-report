<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 組織氣候與管理效能診斷專業報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --high: #52c41a; --mid: #faad14; --low: #ff4d4f;
            --primary: #1a3a63; --secondary: #475569; --bg: #f8fafc;
        }
        body { margin: 0; padding: 40px; background-color: #cbd5e1; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; }
        .report-container { width: 1050px; background: #fff; padding: 50px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
        
        /* 標題與版權 */
        .header { text-align: left; border-bottom: 2px solid var(--primary); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 10px; }
        .header h1 { font-size: 28px; color: var(--primary); margin: 0; }
        .copyright-tag { font-size: 12px; color: #94a3b8; }

        /* 總結區塊 */
        .summary-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; margin-bottom: 40px; background: #f1f5f9; padding: 30px; border-radius: 8px; }
        .score-box { text-align: center; border-right: 1px solid #cbd5e1; padding-right: 20px; }
        .score-circle { width: 120px; height: 120px; border: 10px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        .score-val { font-size: 42px; font-weight: bold; color: var(--primary); }

        /* 顧問診斷卡片 */
        .section-title { font-size: 18px; font-weight: bold; color: var(--primary); margin: 30px 0 15px; display: flex; align-items: center; gap: 10px; }
        .ai-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .ai-card { border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; position: relative; transition: transform 0.2s; }
        .ai-card:hover { border-color: var(--primary); }
        .card-tag { position: absolute; top: 15px; right: 15px; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        
        /* 邏輯分析區 */
        .logic-panel { background: #fff; border: 1px solid var(--primary); border-left: 10px solid var(--primary); padding: 20px; margin: 30px 0; border-radius: 4px; }
        .service-opportunity { background: #fff7e6; border: 1px dashed #ffa940; padding: 20px; border-radius: 8px; margin-top: 20px; }

        /* 圖表 */
        .chart-row { display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; margin-top: 40px; }
        #radarChart { max-width: 300px; }

        .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 50px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div class="report-container">
    <div class="header">
        <h1>MMTF 組織氣候與管理效能診斷報告</h1>
        <div class="copyright-tag">許銘祥 / csrrisk.com</div>
    </div>

    <div class="summary-grid">
        <div class="score-box">
            <div class="score-circle"><span class="score-val" id="totalScore">--</span></div>
            <div style="font-weight:bold; color:var(--primary)">MMTF 綜合對稱指數</div>
        </div>
        <div>
            <h3 id="statusTitle" style="margin-top:0">正在進行數據建模...</h3>
            <p id="statusDesc" style="font-size:14px; line-height:1.6; color:var(--secondary)">本診斷透過 Mirror (認知)、Matrix (結構)、Flow (能流)、Safety (安全) 四大對稱構面，評估組織管理能量的損耗係數與導通效率。</p>
        </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-microchip"></i> 四維度顧問邏輯深度分析</div>
    <div class="ai-grid" id="aiGrid"></div>

    <div class="logic-panel">
        <h4 style="margin-top:0; color:var(--primary)"><i class="fa-solid fa-diagram-project"></i> 系統衝突組合偵測 (Conflict Logic)</h4>
        <div id="conflictLogicText" style="font-size:14px; line-height:1.7;">掃描組織內部是否存在相互矛盾的管理慣性...</div>
    </div>

    <div class="chart-row">
        <div>
            <canvas id="radarChart"></canvas>
            <p style="text-align:center; font-size:12px; color:#64748b; margin-top:10px;">MMTF 管理能量分布圖</p>
        </div>
        <div class="service-opportunity">
            <h4 style="margin-top:0; color:#d46b08;"><i class="fa-solid fa-handshake"></i> 專業顧問服務延伸建議 (Service Opportunities)</h4>
            <div id="serviceText" style="font-size:13px; line-height:1.6; color:#873800;">載入深度諮詢方案中...</div>
        </div>
    </div>

    <div class="footer" id="reportDate"></div>
</div>

<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const scores = {
        mirror: parseInt(params.get('mirror')) || 15,
        matrix: parseInt(params.get('matrix')) || 15,
        flow: parseInt(params.get('flow')) || 15,
        safe: parseInt(params.get('safe')) || 15
    };
    const total = Math.round(((scores.mirror + scores.matrix + scores.flow + scores.safe) / 100) * 100);

    const db = {
        mirror: { title: "Mirror 鏡像對稱", high: "高共識度，決策傳導阻力極低。", mid: "存在認知雜訊，需重複溝通確認。", low: "認知嚴重斷層，指令失真率高。" },
        matrix: { title: "Matrix 結構效能", high: "權責邊界清晰且具備治理彈性。", mid: "職能存在重疊，跨單位推諉風險。", low: "結構失序，決策權威性受損。" },
        flow: { title: "Flow 資訊能流", high: "數據驅動，資訊流動近乎無損。", mid: "中層阻滯，基層反饋路徑過長。", low: "資訊孤島嚴重，決策缺乏事實基石。" },
        safe: { title: "Safety 心理安全", high: "高度容錯，組織具備自動修復基因。", mid: "條件式信任，負面消息傳遞受限。", low: "恐懼氛圍主導，風險隱藏風險高。" }
    };

    const getCol = (s) => s >= 20 ? '#52c41a' : (s >= 12 ? '#faad14' : '#ff4d4f');
    const getLv = (s) => s >= 20 ? '卓越' : (s >= 12 ? '穩定' : '風險');

    // 渲染卡片
    const grid = document.getElementById('aiGrid');
    Object.keys(scores).forEach(key => {
        const s = scores[key];
        const info = db[key];
        grid.innerHTML += `
            <div class="ai-card">
                <span class="card-tag" style="background:${getCol(s)}22; color:${getCol(s)}">${getLv(s)}</span>
                <div style="font-weight:bold; color:var(--primary); margin-bottom:8px;">${info.title} (${s}/25)</div>
                <div style="font-size:13px; color:var(--secondary); line-height:1.5;">
                    <strong>狀態洞察：</strong>${s >= 20 ? info.high : (s >= 12 ? info.mid : info.low)}<br>
                    <strong>管理盲點：</strong>${s >= 20 ? "警惕「內部同質化」思維陷阱。" : "能量在傳遞節點發生顯著逃逸。"}
                </div>
            </div>
        `;
    });

    document.getElementById('totalScore').innerText = total;
    document.getElementById('statusTitle').innerText = total >= 80 ? "高能卓越型組織" : (total >= 50 ? "亞健康運作組織" : "系統性失能風險組織");

    // 衝突邏輯分析
    let logicText = "組織運行規律分析：";
    if (scores.flow >= 20 && scores.safe <= 12) {
        logicText = "<strong>假性透明陷阱：</strong>雖然資訊流動快，但心理安全感不足。基層傾向於在系統中回報「美化後的數據」，導致決策層基於錯誤事實進行精準決策。";
    } else if (scores.matrix >= 20 && scores.mirror <= 12) {
        logicText = "<strong>僵化官僚悖論：</strong>組織結構與權責極其清晰，但上下認知不對稱。員工「按章辦事」卻不理解行為目標，導致效率極高但成果偏離策略目標。";
    } else if (total >= 90) {
        logicText = "<strong>完美對稱狀態：</strong>組織處於高能量穩定期。此時最大的風險是「過度穩定」導致對外部市場變化的鈍化，建議刻意引入外部擾動。";
    } else {
        logicText = "<strong>低對稱能量耗損：</strong>組織目前面臨各構面能量不均，管理行為在跨部門邊界時發生嚴重摩擦，建議優先從最低分數構面進行局部修復。";
    }
    document.getElementById('conflictLogicText').innerHTML = logicText;

    // 顧問服務建議
    const serviceMap = {
        mirror: "【高階策略對齊工作坊】：打破黑箱認知，對齊年度 KPI 關鍵認知差異。",
        matrix: "【組織流程再造 (BPR)】：梳理跨部門 RACI 矩陣，消除無人負責的灰色地帶。",
        flow: "【數位看板與異常通報機制導入】：縮短基層資訊回傳路徑，建立數據儀表板。",
        safe: "【心理安全感培訓項目】：建立無責復盤機制，重塑組織容錯與創新的底層文化。"
    };
    const worst = Object.keys(scores).reduce((a, b) => scores[a] < scores[b] ? a : b);
    document.getElementById('serviceText').innerHTML = `
        基於當前診斷，我們建議後續啟動：<br>
        1. <strong>優先干預項：</strong>${serviceMap[worst]}<br>
        2. <strong>中長期規劃：</strong>MMTF 持續性動態監測分析 (季度診斷)。<br>
        3. <strong>專家諮詢：</strong>預約 Hsu Ming-hsiang 進行 1-on-1 管理深度復盤。
    `;

    // 雷達圖
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ["Mirror", "Matrix", "Flow", "Safety"],
            datasets: [{
                data: [scores.mirror, scores.matrix, scores.flow, scores.safe],
                backgroundColor: 'rgba(26, 58, 99, 0.2)',
                borderColor: '#1a3a63',
                borderWidth: 2,
                pointBackgroundColor: '#1a3a63'
            }]
        },
        options: {
            scales: { r: { min: 0, max: 25, ticks: { display: false, stepSize: 5 } } },
            plugins: { legend: { display: false } }
        }
    });

    document.getElementById('reportDate').innerText = `MMTF 診斷模組 v2.0 | 報告產生時間：${new Date().toLocaleString()}`;
};
</script>
</body>
</html>
