<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTF 組織診斷專業報告</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== 基礎設計（顧問級風格）===== */
body{
    margin:0;
    font-family: "Noto Sans TC", Arial;
    background:#f4f6f9;
    color:#333;
}

/* 一頁容器（關鍵） */
.page{
    width: 1100px;
    height: 100vh;
    margin: 0 auto;
    padding: 18px;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: 60px 1fr 1fr;
    gap: 12px;
}

/* ===== Header ===== */
.header{
    background:#1f2a44;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.header h1{
    font-size:18px;
    margin:0;
}
.header .meta{
    font-size:12px;
    opacity:0.8;
}

/* ===== KPI 區 ===== */
.kpi{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:10px;
}

.card{
    background:white;
    border-radius:12px;
    padding:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    text-align:center;
}
.card h2{
    font-size:13px;
    margin:0;
    color:#666;
}
.card .value{
    font-size:22px;
    font-weight:bold;
    margin-top:6px;
}

/* ===== 主內容區 ===== */
.main{
    display:grid;
    grid-template-columns: 1.2fr 1fr;
    gap:12px;
}

/* 雷達圖區 */
.chartBox{
    background:white;
    border-radius:12px;
    padding:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* 風險燈號 */
.riskBox{
    background:white;
    border-radius:12px;
    padding:14px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.risk{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
    font-size:13px;
}

.light{
    width:14px;
    height:14px;
    border-radius:50%;
}
.red{ background:#ff4d4f;}
.yellow{ background:#faad14;}
.green{ background:#52c41a;}

/* ===== footer ===== */
.footer{
    font-size:11px;
    text-align:center;
    color:#888;
}

/* ===== 列印優化 ===== */
@media print{
    body{ background:white;}
    .page{ width:100%; height:auto;}
}
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <div class="header">
        <h1>MMTF 組織氣候與管理效能診斷報告</h1>
        <div class="meta">Mirror Matrix Theory Feedback v2 | Consultant Report</div>
    </div>

    <!-- KPI -->
    <div class="kpi">
        <div class="card">
            <h2>Mirror 指數</h2>
            <div class="value">20</div>
        </div>
        <div class="card">
            <h2>Matrix 結構</h2>
            <div class="value">12</div>
        </div>
        <div class="card">
            <h2>Flow 流動</h2>
            <div class="value">8</div>
        </div>
        <div class="card">
            <h2>Safe 安全</h2>
            <div class="value">8</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- Radar -->
        <div class="chartBox">
            <canvas id="radar" width="380" height="380"></canvas>
        </div>

        <!-- Risk -->
        <div class="riskBox">
            <h3 style="margin-top:0;">風險診斷燈號</h3>

            <div class="risk">
                <span>組織透明度</span>
                <div class="light red"></div>
            </div>

            <div class="risk">
                <span>溝通流動性</span>
                <div class="light yellow"></div>
            </div>

            <div class="risk">
                <span>制度穩定性</span>
                <div class="light green"></div>
            </div>

            <div class="risk">
                <span>心理安全感</span>
                <div class="light yellow"></div>
            </div>

            <hr>

            <p style="font-size:12px; color:#666;">
            ※ 本報告依 MMTF（Mirror Matrix Theory Feedback）模型生成，用於組織氣候與管理效能診斷。
            </p>
        </div>

    </div>

    <div class="footer">
        © MMTF Diagnostic System | Professional Consulting Dashboard
    </div>

</div>

<script>
const ctx = document.getElementById('radar');

new Chart(ctx, {
    type: 'radar',
    data: {
        labels: ['Mirror','Matrix','Flow','Safe','Stability','Trust'],
        datasets: [{
            label: '組織狀態',
            data: [20,12,8,8,10,9],
            backgroundColor: 'rgba(31,42,68,0.2)',
            borderColor: '#1f2a44',
            borderWidth: 2
        }]
    },
    options: {
        responsive: false,
        scales: {
            r: {
                suggestedMin: 0,
                suggestedMax: 25
            }
        }
    }
});
</script>

</body>
</html>
