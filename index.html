<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 組織氣候與管理效能診斷專業報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --high: #52c41a; --mid: #faad14; --low: #ff4d4f;
            --primary: #1a3a63; --bg: #f0f2f5; --card-blue: #f8fafc;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background-color: #cbd5e1; display: flex; flex-direction: column; align-items: center; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        .report-container { width: 1100px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); color: #1e293b; }
        
        .header { text-align: center; margin-bottom: 30px; position: relative; }
        .header h1 { font-size: 32px; color: var(--primary); margin: 0; font-weight: 700; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 10px; }
        .copyright { position: absolute; right: 0; bottom: 0; font-size: 12px; color: #94a3b8; }

        /* 頂部靜態圓環 - 徹底移除動畫 */
        .risk-main { border: 1px solid #e2e8f0; border-radius: 16px; padding: 25px; display: flex; align-items: center; background: #fff; }
        .circle-progress { position: relative; width: 120px; height: 120px; margin-right: 25px; flex-shrink: 0; }
        .circle-progress svg { transform: rotate(-90deg); width: 120px; height: 120px; }
        .circle-bg { fill: none; stroke: #eee; stroke-width: 10; }
        .circle-bar { 
            fill: none; stroke-width: 10; stroke-linecap: round; 
            stroke-dasharray: 314.15; 
            transition: none !important; /* 強制移除動畫 */
        }
        .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .score-num { font-size: 32px; font-weight: 800; line-height: 1; }
        .score-label { font-size: 10px; color: #94a3b8; margin-top: 2px; display: block; }

        /* AI 實證分析卡片 */
        .section-title { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 10px; margin-top: 25px; }
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 35px; }
        .ai-card { background: #fff; border: 1px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; min-height: 310px; }
        .status-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
        .ai-desc { font-size: 12px; line-height: 1.6; color: #475569; margin-bottom: 12px; height: 90px; overflow: hidden; }
        .action-list { list-style: none; padding: 0; margin: 0; font-size: 11px; color: #64748b; }
        .action-list li::before { content: '•'; color: var(--primary); font-weight: bold; margin-right: 5px; }

        /* 結論區塊 */
        .mid-row { display: grid; grid-template-columns: 0.6fr 1.4fr; gap: 40px; margin-bottom: 35px; border-top: 1px solid #f1f5f9; padding-top: 30px; }
        #radarChart { max-width: 180px !important; max-height: 180px !important; margin: 0 auto; }
        .conclusion-box { font-size: 14px; line-height: 1.8; color: #334155; }

        .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>
<div class="report-container">
    <div class="header">
        <h1>MMTF 組織診斷與實證分析報告</h1>
        <div class="copyright">許銘祥 / csrrisk.com</div>
    </div>

    <div class="top-risk-row" style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px; margin-bottom: 30px;">
        <div class="risk-main" id="riskMainCard">
            <div class="circle-progress">
                <svg><circle class="circle-bg" cx="60" cy="60" r="50"></circle><circle class="circle-bar" id="scoreBar" cx="60" cy="60" r="50"></circle></svg>
                <div class="score-text"><span class="score-num" id="totalScoreVal">--</span><span class="score-label">對稱指數</span></div>
            </div>
            <div class="risk-text">
                <h2 id="riskTitle" style="margin:0; font-size:26px;">解析中...</h2>
                <p id="riskDesc" style="font-size:14px; color:#64748b; margin:5px 0 0 0;">管理能量對稱性評估中</p>
            </div>
        </div>
        <div class="risk-main" style="display:block; background:#fff;">
            <div style="font-weight:bold; font-size:14px; margin-bottom:10px;">📊 MMTF 指標定義</div>
            <p style="font-size:12px; color:#666; line-height:1.6; margin:0;">評估認知(Mirror)、結構(Matrix)、能流(Flow)、安全(Safety)四大維度，滿分100代表組織達到完全對稱之理想狀態。</p>
        </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-brain"></i> AI 實證構面分析</div>
    <div class="ai-grid" id="aiGrid"></div>

    <div class="mid-row">
        <div class="radar-box">
            <canvas id="radarChart"></canvas>
        </div>
        <div class="conclusion-box">
            <h3 style="margin-top:0; color:var(--primary);">🔍 顧問綜合結論與戰略建議</h3>
            <div id="conclusionText">載入中...</div>
        </div>
    </div>

    <div class="footer" id="reportDate"></div>
</div>

<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const scores = {
        mirror: parseInt(params.get('mirror')) || 25,
        matrix: parseInt(params.get('matrix')) || 25,
        flow: parseInt(params.get('flow')) || 25,
        safe: parseInt(params.get('safe')) || 25
    };
    const totalScore = Math.round(((scores.mirror + scores.matrix + scores.flow + scores.safe) / 100) * 100);
    const isPerfect = (totalScore === 100);

    // 1. 頂部視覺更新 (徹底關閉動畫)
    const bar = document.getElementById('scoreBar');
    const color = isPerfect ? "#1a3a63" : (totalScore >= 70 ? "#52c41a" : "#faad14");
    bar.style.stroke = color;
    bar.style.strokeDashoffset = 314.15 - (314.15 * totalScore / 100);
    
    document.getElementById('totalScoreVal').innerText = totalScore;
    document.getElementById('totalScoreVal').style.color = color;
    document.getElementById('riskTitle').innerText = isPerfect ? "對稱卓越型組織" : "穩定運作型組織";
    document.getElementById('riskTitle').style.color = color;

    // 2. 結論引擎修正：滿分邏輯[cite: 1]
    const conclusionBox = document.getElementById('conclusionText');
    if (isPerfect) {
        conclusionBox.innerHTML = `
            組織已達成 <b>100分完全對稱狀態</b>。在 MMTF 框架下，這代表認知、結構、能流與安全已進入高度同步的「自動駕駛模式」。<br><br>
            <b>戰略級建議：</b><br>
            • <b>標竿化：</b>將現有管理模式萃取為組織知識庫，作為企業擴張時的標準模板。<br>
            • <b>文化輸出：</b>啟動領航員計畫，將卓越的管理安全感轉化為對外的品牌影響力。<br>
            • <b>前瞻性預演：</b>進行極端壓力測試，確保在高度變動市場中依然維持對稱性能量。`;
    } else {
        const worstKey = Object.keys(scores).reduce((a, b) => scores[a] < scores[b] ? a : b);
        conclusionBox.innerHTML = `
            系統表現穩定，總分為 <b>${totalScore}</b>。目前管理能量分佈尚屬均衡，但仍有微幅非對稱性。<br><br>
            <b>顧問建議：</b><br>
            建議針對評分相對較低的維度進行持續性監測，以維持系統長期的穩定性與抗熵能力。`;
    }

    // 3. 卡片渲染[cite: 1]
    const aiGrid = document.getElementById('aiGrid');
    const fields = [
        {k:'mirror', n:'Mirror 認知'}, {k:'matrix', n:'Matrix 結構'}, 
        {k:'flow', n:'Flow 能流'}, {k:'safe', n:'Safety 安全'}
    ];
    fields.forEach(f => {
        aiGrid.innerHTML += `
            <div class="ai-card" style="border-top-color: ${color}">
                <h4>${f.n} <span class="status-tag" style="background:${color}22; color:${color}">${isPerfect?'卓越':'優良'}</span></h4>
                <div class="ai-desc">對稱性表現極佳，管理能流在傳導過程中幾乎無損耗。</div>
                <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">持續進化</div>
                <ul class="action-list">
                    <li>${isPerfect ? '深化組織默契' : '維持現有水準'}</li>
                    <li>${isPerfect ? '跨維度能量整合' : '定期回訪監測'}</li>
                </ul>
            </div>`;
    });

    // 4. 雷達圖 (關閉動畫)
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ["Mirror", "Matrix", "Flow", "Safety"],
            datasets: [{ 
                data: Object.values(scores), 
                backgroundColor: `${color}22`, 
                borderColor: color, 
                borderWidth: 2 
            }]
        },
        options: { 
            animation: false, 
            scales: { r: { min: 0, max: 25, ticks: { display: false } } }, 
            plugins: { legend: { display: false } } 
        }
    });

    document.getElementById('reportDate').innerText = `MMTF 專業報告 v3.1 | Hsu Ming-hsiang (許銘祥)[cite: 1]`;
};
</script>
</body>
</html>
