<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>MMTF 組織診斷報告（衝突版）</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
    margin:0;
    padding:20px;
    background:#cbd5e1;
    font-family:"Microsoft JhengHei";
}

.report-container{
    width:1100px;
    margin:auto;
    background:#fff;
    padding:40px;
    border-radius:12px;
}

/* 新增：顧問方案區 */
.solution-box{
    margin-top:30px;
    padding:25px;
    border-radius:12px;
    border:1px solid #ddd;
    background:#fafafa;
}
.solution-box h3{
    margin-top:0;
    color:#1a3a63;
}
.solution-item{
    margin-bottom:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="report-container">

<h1>MMTF 衝突型組織診斷報告</h1>

<div id="result"></div>

<div class="solution-box">
    <h3>🧠 顧問方案包（自動生成）</h3>
    <div id="solution"></div>
</div>

</div>

<script>

window.onload = function(){

// =========================
// 1. 讀取分數
// =========================
const params = new URLSearchParams(window.location.search);

const scores = {
    mirror: parseInt(params.get('mirror')) || 10,
    matrix: parseInt(params.get('matrix')) || 10,
    flow: parseInt(params.get('flow')) || 10,
    safe: parseInt(params.get('safe')) || 10
};

// =========================
// 2. 判斷衝突類型
// =========================
let conflictType = "";
let coreIssue = "";

if(scores.mirror <= 8){
    conflictType = "認知衝突型";
    coreIssue = "上下認知斷層";
}
else if(scores.matrix <= 8){
    conflictType = "權責衝突型";
    coreIssue = "權責不清 / 推責";
}
else if(scores.flow <= 8){
    conflictType = "資訊阻塞型";
    coreIssue = "溝通斷裂";
}
else if(scores.safe <= 8){
    conflictType = "心理恐懼型";
    coreIssue = "不敢講真話";
}
else{
    conflictType = "隱性內耗型";
    coreIssue = "慢性效率流失";
}

// =========================
// 3. 顧問方案引擎（核心）
// =========================
const solutionDB = {

"認知衝突型":{
    plan:[
        "Week1：高層與基層對齊會議",
        "Week2：建立共識文件（One Page Strategy）",
        "Week3：雙向回饋機制導入"
    ],
    kpi:[
        "戰略理解一致率 > 80%",
        "會議重工率下降30%",
        "決策回饋時間縮短50%"
    ],
    steps:[
        "盤點認知落差",
        "建立共同語言",
        "固定回饋節點"
    ]
},

"權責衝突型":{
    plan:[
        "Week1：RACI盤點",
        "Week2：流程重建",
        "Week3：責任追蹤制度"
    ],
    kpi:[
        "跨部門衝突下降50%",
        "決策延誤減少40%",
        "專案準時率提升"
    ],
    steps:[
        "列出所有決策點",
        "標定負責人",
        "建立追蹤機制"
    ]
},

"資訊阻塞型":{
    plan:[
        "Week1：資訊流盤點",
        "Week2：建立即時看板",
        "Week3：導入回報制度"
    ],
    kpi:[
        "資訊傳遞時間下降60%",
        "錯誤回報率提升",
        "決策延遲下降"
    ],
    steps:[
        "找出阻塞節點",
        "建立透明化工具",
        "強制回報機制"
    ]
},

"心理恐懼型":{
    plan:[
        "Week1：安全會議",
        "Week2：取消懲罰文化",
        "Week3：建立匿名回報"
    ],
    kpi:[
        "員工發言率提升",
        "問題揭露率提升",
        "離職率下降"
    ],
    steps:[
        "建立安全場域",
        "領導示範",
        "制度保護"
    ]
},

"隱性內耗型":{
    plan:[
        "Week1：效率盤點",
        "Week2：流程精簡",
        "Week3：KPI重設"
    ],
    kpi:[
        "工時下降20%",
        "產出提升30%",
        "無效會議減少"
    ],
    steps:[
        "找浪費",
        "砍流程",
        "強績效"
    ]
}

};

// =========================
// 4. 顯示診斷
// =========================
document.getElementById("result").innerHTML = `
<h2>🔍 衝突診斷結果</h2>
<p><b>衝突類型：</b>${conflictType}</p>
<p><b>核心問題：</b>${coreIssue}</p>
`;

// =========================
// 5. 顯示顧問方案
// =========================
const sol = solutionDB[conflictType];

document.getElementById("solution").innerHTML = `
<div class="solution-item"><b>📅 3週改善計畫</b><br>${sol.plan.join("<br>")}</div>
<br>
<div class="solution-item"><b>📊 KPI</b><br>${sol.kpi.join("<br>")}</div>
<br>
<div class="solution-item"><b>⚙️ 執行步驟</b><br>${sol.steps.join("<br>")}</div>
`;

};

</script>

</body>
</html>
