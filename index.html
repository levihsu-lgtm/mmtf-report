<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 組織氣候與管理效能診斷專業報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --high: #52c41a; --mid: #faad14; --low: #ff4d4f;
            --primary: #1a3a63; --bg: #f0f2f5; --card-blue: #f8fafc;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background-color: #cbd5e1; display: flex; flex-direction: column; align-items: center; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        
        .report-container {
            width: 1100px;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            color: #1e293b;
        }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 32px; color: var(--primary); margin: 0; font-weight: 700; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 10px; }

        /* 1. 指標區 (含動態圓環) */
        .top-risk-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px; margin-bottom: 30px; }
        .risk-main { border: 1px solid #e2e8f0; border-radius: 16px; padding: 25px; display: flex; align-items: center; background: #fff; transition: background 0.3s; }
        
        /* ✅ 動態圓環核心 CSS */
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-right: 25px; position: relative;
            /* 透過 CSS 變數控制漸層進度與顏色 */
            background: conic-gradient(var(--progress-color, #eee) calc(var(--progress, 0) * 1%), #eee 0);
        }
        .score-circle::before {
            content: ""; position: absolute; width: 92px; height: 92px;
            background: #fff; border-radius: 50%;
        }
        .score-val-container { position: relative; z-index: 1; text-align: center; }
        .score-val { font-size: 36px; font-weight: bold; display: block; line-height: 1; }

        .risk-text h2 { font-size: 28px; margin: 0; }
        
        /* 2. AI 實證卡片 */
        .section-title { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 10px; margin-top: 25px; }
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 35px; }
        .ai-card { background: #fff; border: 1px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; min-height: 300px; }
        .ai-card h4 { margin: 0 0 8px 0; color: var(--primary); font-size: 15px; display: flex; align-items: center; gap: 5px; justify-content: space-between; }
        .status-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
        .ai-theory { font-size: 11px; color: #888; font-style: italic; margin-bottom: 8px; }
        .ai-desc { font-size: 12px; line-height: 1.6; color: #475569; margin-bottom: 12px; flex-grow: 1; }
        .action-list-title { font-size: 12px; font-weight: bold; color: #1e293b; margin-bottom: 6px; border-top: 1px solid #f1f5f9; padding-top: 10px; }
        .action-list { list-style: none; padding: 0; margin: 0; }
        .action-list li { font-size: 11px; color: #64748b; margin-bottom: 4px; display: flex; align-items: flex-start; gap: 5px; }
        .action-list li::before { content: '•'; color: var(--primary); font-weight: bold; }

        /* 3. 中段分析 */
        .mid-row { display: grid; grid-template-columns: 0.6fr 1.4fr; gap: 40px; margin-bottom: 35px; border-top: 1px solid #f1f5f9; padding-top: 30px; }
        .radar-box { text-align: center; border-right: 1px solid #f1f5f9; padding-right: 20px; }
        #radarChart { max-width: 200px !important; max-height: 200px !important; margin: 0 auto; }
        .conclusion-box { font-size: 14px; line-height: 1.8; color: #334155; }

        /* 4. 行動指南 */
        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #f1f5f9; padding-top: 30px; }
        .steps-box { background: var(--card-blue); padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .step-item { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 15px; position: relative; }
        .step-num { width: 28px; height: 28px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
        .step-txt { font-size: 13px; font-weight: 500; padding-top: 4px; }
        .remind-box { padding: 25px; border-radius: 16px; border: 1px dashed #ccc; }

        .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 40px; }
    </style>
</head>
<body>

<div class="report-container">
    <div class="header">
        <h1>MMTF 組織診斷與實證分析報告</h1>
    </div>

    <!-- 1. 頂部狀態 -->
    <div class="top-risk-row">
        <div class="risk-main" id="riskMainCard">
            <!-- ✅ 對應圖片中的動態圓環結構 -->
            <div class="score-circle" id="totalScoreCircle">
                <div class="score-val-container">
                    <span class="score-val" id="totalScoreVal">0</span>
                    <span style="font-size:10px; color:#999;">/100</span>
                </div>
            </div>
            <div class="risk-text">
                <h2 id="riskTitle">分析中...</h2>
                <p id="riskDesc" style="font-size:14px; color:#64748b; margin:5px 0 0 0;">正在運算 MMTF 管理能量指數。</p>
            </div>
        </div>
        <div class="risk-main" style="display:block; background:#fff;">
            <div style="font-weight:bold; font-size:14px; margin-bottom:10px;">📊 MMTF 指標定義</div>
            <p style="font-size:12px; color:#666; line-height:1.6; margin:0;">本診斷評估組織對稱性能量。分數越高代表風險越低，管理傳導越精準[cite: 1]。當分數低於 45 分，系統架構與信任鏈條通常已出現嚴重毀損[cite: 1]。</p>
        </div>
    </div>

    <!-- 2. 四維度分析 -->
    <div class="section-title"><i class="fa-solid fa-brain"></i> AI 實證構面分析</div>
    <div class="ai-grid" id="aiGrid"></div>

    <!-- 3. 中段雷達與結論 -->
    <div class="mid-row">
        <div class="radar-box">
            <canvas id="radarChart"></canvas>
            <p style="font-size:11px; color:#94a3b8; margin-top:10px;">MMTF 四維均衡圖</p>
        </div>
        <div class="conclusion-box">
            <h3 style="margin-top:0; color:var(--primary);">🔍 診斷綜合結論</h3>
            <div id="conclusionText">分析中...</div>
        </div>
    </div>

    <!-- 4. 行動指南 -->
    <div class="bottom-row">
        <div class="steps-box">
            <h4 style="margin:0 0 20px 0; color:var(--primary);">🚀 下一步行動指南</h4>
            <div id="stepsContainer"></div>
        </div>
        <div class="remind-box" id="remindBox">
            <h4 id="remindTitle">💡 顧問關鍵提醒</h4>
            <p id="remindText">載入中...</p>
        </div>
    </div>

    <div class="footer" id="reportDate"></div>
</div>

<script>
window.onload = function() {
    // 1. 獲取數據 (URL 參數或預設)
    const params = new URLSearchParams(window.location.search);
    const scores = {
        mirror: parseInt(params.get('mirror')) || 12,
        matrix: parseInt(params.get('matrix')) || 10,
        flow: parseInt(params.get('flow')) || 10,
        safe: parseInt(params.get('safe')) || 10
    };
    
    // 計算 MMTF 總分 (Max 100)
    const targetScore = Math.min(100, Math.round(scores.mirror + scores.matrix + scores.flow + scores.safe));
    const riskColor = targetScore >= 70 ? "#52c41a" : (targetScore >= 45 ? "#faad14" : "#ff4d4f");

    // ✅ 2. 動態圓環動畫控制 (圖片中核心邏輯)
    const circle = document.getElementById("totalScoreCircle");
    const scoreVal = document.getElementById("totalScoreVal");
    let currentScore = 0;
    const duration = 1200; // 1.2秒跑完
    const step = targetScore / (duration / 16);

    const animateUI = setInterval(() => {
        currentScore += step;
        if (currentScore >= targetScore) {
            currentScore = targetScore;
            clearInterval(animateUI);
        }
        
        // 更新數字
        scoreVal.innerText = Math.round(currentScore);
        // ✅ 核心：更新 CSS 變數以驅動 conic-gradient
        circle.style.setProperty("--progress", currentScore);
        circle.style.setProperty("--progress-color", riskColor);
        scoreVal.style.color = riskColor;
    }, 16);

    // 3. 資料庫內容
    const insightDB = {
        mirror: { title: "Mirror (鏡像)", high: "認知共振", mid: "認知雜訊", low: "認知斷層", action: "啟動對齊會議" },
        matrix: { title: "Matrix (矩陣)", high: "靈活治理", mid: "功能重疊", low: "結構失序", action: "釐清 RACI 權責" },
        flow:   { title: "Flow (能流)",   high: "透明流動", mid: "節點阻滯", low: "資訊孤島", action: "建立看板系統" },
        safe:   { title: "Safety (安全)", high: "無畏創新", mid: "條件信任", low: "防衛文化", action: "重建心理邊界" }
    };

    const getLvl = (s) => s >= 19 ? 'high' : (s >= 12 ? 'mid' : 'low');

    // 4. 渲染四維度卡片
    const aiGrid = document.getElementById('aiGrid');
    ['mirror', 'matrix', 'flow', 'safe'].forEach(k => {
        const lvl = getLvl(scores[k]);
        aiGrid.innerHTML += `
            <div class="ai-card" style="border-top-color: ${riskColor}">
                <h4>${insightDB[k].title} <span class="status-tag" style="background:${riskColor}22; color:${riskColor}">${insightDB[k][lvl]}</span></h4>
                <div class="ai-theory">MMTF 指標解析[cite: 1]</div>
                <div class="ai-desc">目前該維度得分為 ${scores[k]}。組織在此層面的管理能量展現為「${insightDB[k][lvl]}」，存在程度不一的傳導損耗。</div>
                <div class="action-list-title">優先行動</div>
                <ul class="action-list"><li>${insightDB[k].action}</li><li>監控異常回報率</li></ul>
            </div>
        `;
    });

    // 5. 渲染風險文字與結論
    const riskUI = targetScore >= 70 ? { title: "高能卓越型 (Optimized)", desc: "組織具備強大的對稱性能量。", remind: "預防「優勢陷阱」，維持認知多樣性。" } :
                   targetScore >= 45 ? { title: "亞健康運作型 (Vulnerable)", desc: "效能在特定維度存在能量跑冒滴漏。", remind: "建議優先修復最低維度，避免拖累全局。" } :
                                    { title: "高風險失能型 (Fragile)", desc: "系統架構與信任鏈條出現嚴重毀損[cite: 1]。", remind: "立即停止新目標追逐，修復基礎安全感。" };
    
    document.getElementById('riskTitle').innerText = riskUI.title;
    document.getElementById('riskTitle').style.color = riskColor;
    document.getElementById('riskDesc').innerText = riskUI.desc;
    document.getElementById('remindText').innerText = riskUI.remind;
    document.getElementById('remindBox').style.background = targetScore < 45 ? "#fff1f0" : "#f6ffed";
    document.getElementById('remindBox').style.borderColor = riskColor;
    
    document.getElementById('conclusionText').innerHTML = `
        <strong>Executive Summary:</strong><br>
        本次 MMTF 診斷得分為 <b>${targetScore}</b> 分。組織正處於「${riskUI.title}」狀態。<br><br>
        這代表管理能量在傳遞過程中受到顯著限制。建議針對得分最低的構面進行深度的管理干預，以防止組織內耗持續擴大。
    `;

    // 6. 下一步行動
    const steps = ["召開管理層共識工作坊", "盤點核心流程阻滯點", "導入心理安全感監測", "重新校準年度 KPI"];
    document.getElementById('stepsContainer').innerHTML = steps.map((s, i) => `<div class="step-item"><div class="step-num">${i+1}</div><div class="step-txt">${s}</div></div>`).join('');

    // 7. 繪製雷達圖
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ["Mirror", "Matrix", "Flow", "Safety"],
            datasets: [{
                data: [scores.mirror, scores.matrix, scores.flow, scores.safe],
                backgroundColor: riskColor + "22",
                borderColor: riskColor,
                borderWidth: 2,
                pointRadius: 3
            }]
        },
        options: {
            scales: { r: { min: 0, max: 25, ticks: { display: false } } },
            plugins: { legend: { display: false } }
        }
    });

    document.getElementById('reportDate').innerText = `MMTF 專業診斷系統 v1.0 | 報告產生日期：${new Date().toLocaleDateString()}`;
};
</script>
</body>
</html>
