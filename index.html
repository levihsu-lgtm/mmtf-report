body{

.container{

.header{

.main{

.left{

}

.bar{background:#eee;height:6px;border-radius:4px;}
.fill{height:100%;border-radius:4px;}
.dim{font-size:12px}

.right{

 gap:8px;
 overflow:hidden;
}
