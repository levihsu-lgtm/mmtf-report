<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTF 組織診斷報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4a90e2; --danger: #ff4d4f; --warning: #faad14; --success: #52c41a; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .score-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 25px 0; }
        .card { padding: 15px; border-radius: 8px; border: 1px solid #eee; text-align: center; }
        .analysis-section { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-top: 30px; }
        .footer-note { font-size: 12px; color: #999; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MMTF 組織診斷結果報告</h1>
            <p>診斷日期：<span id="date"></span></p>
        </div>

        <div class="score-row" id="cards-container">
            </div>

        <div class="analysis-section">
            <div>
                <h3>MMTF 四維度雷達圖</h3>
                <canvas id="mmtfChart"></canvas>
            </div>
            <div>
                <h3>💡 診斷建議</h3>
                <div id="recommendations"></div>
            </div>
        </div>

        <div class="footer-note">本報告由 MMTF 組織診斷系統自動產出</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const data = {
            mirror: Number(params.get('mirror')) || 0,
            matrix: Number(params.get('matrix')) || 0,
            flow: Number(params.get('informationFlow')) || 0,
            safe: Number(params.get('psychologicalSafety')) || 0
        };

        document.getElementById('date').innerText = new Date().toLocaleDateString();

        // 繪製雷達圖 (Chart.js)
        new Chart(document.getElementById('mmtfChart'), {
            type: 'radar',
            data: {
                labels: ['Mirror', 'Matrix', 'Info Flow', 'Psych Safety'],
                datasets: [{
                    label: '組織得分',
                    data: [data.mirror, data.matrix, data.flow, data.safe],
                    backgroundColor: 'rgba(74, 144, 226, 0.2)',
                    borderColor: '#4a90e2',
                    pointBackgroundColor: '#4a90e2'
                }]
            },
            options: { scales: { r: { min: 0, max: 25, ticks: { stepSize: 5 } } } }
        });

        // 這裡可以繼續寫邏輯，根據分數產生您的「綜合建議」
    </script>
</body>
</html>
