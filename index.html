<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTF 組織診斷結果報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --high: #ff4d4f; --mid: #faad14; --low: #52c41a;
            --primary: #1a3a63; --bg: #f8f9fb; --card-bg: #ffffff;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .report-container { max-width: 950px; margin: auto; background: var(--card-bg); padding: 40px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.05); }
        
        /* 標題與副標 */
        .main-header { text-align: center; margin-bottom: 35px; }
        .main-header h1 { font-size: 34px; color: var(--primary); margin: 0; letter-spacing: 1px; }
        .main-header p { color: #888; margin-top: 12px; font-size: 15px; }

        /* 1. 整體風險等級區 (1:1 佈局) */
        .risk-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; border: 1px solid #f0f0f0; border-radius: 12px; padding: 25px; align-items: center; }
        .risk-left { display: flex; align-items: center; gap: 30px; border-right: 1px solid #f0f0f0; }
        .circle-ui { width: 110px; height: 110px; border: 12px solid #eee; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
        .risk-text h2 { margin: 0; font-size: 32px; letter-spacing: 2px; }
        .risk-text p { font-size: 13px; color: #777; line-height: 1.6; margin-top: 8px; max-width: 250px; }
        
        .risk-right { padding-left: 20px; }
        .legend-title { font-weight: bold; font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .legend-list { list-style: none; padding: 0; font-size: 13.5px; line-height: 2; color: #555; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

        /* 2. 四大維度與雷達圖 */
        .data-visual-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; margin-bottom: 40px; padding: 10px; }
        .section-h { font-size: 16px; font-weight: bold; color: var(--primary); margin-bottom: 25px; display: flex; align-items: center; gap: 8px; }
        
        .bar-item { margin-bottom: 22px; position: relative; }
        .bar-info { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .bar-track { background: #f0f2f5; height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 1.5s cubic-bezier(0.1, 0, 0.2, 1); }
        .bar-status { font-size: 12px; color: var(--high); position: absolute; right: -60px; top: 22px; font-weight: bold; }

        /* 3. AI 分析結果 (1x4 佈局) */
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 40px; }
        .ai-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; padding: 20px; border-top: 5px solid var(--primary); display: flex; flex-direction: column; }
        .ai-card-h { font-weight: bold; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 5px; }
        .ai-card p { font-size: 12px; color: #555; line-height: 1.7; margin: 0 0 15px 0; flex-grow: 1; text-align: justify; }
        .ai-card b { font-size: 12px; color: var(--primary); display: block; margin-bottom: 8px; border-top: 1px solid #f9f9f9; padding-top: 10px; }
        .ai-card ul { padding-left: 15px; margin: 0; font-size: 11px; color: #666; }

        /* 4. 底部總結 */
        .summary-box { background: #f4f8ff; padding: 30px; border-radius: 15px; border-top: 5px solid var(--primary); }
        .summary-p { font-size: 14px; line-height: 1.8; color: #1a3a63; margin-bottom: 25px; }
        .steps-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .step-item { background: #fff; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .step-n { width: 26px; height: 26px; background: #e6efff; color: var(--primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
        .step-t { font-size: 12px; font-weight: bold; color: var(--primary); line-height: 1.4; }
    </style>
</head>
<body>

<div class="report-container">
    <header class="main-header">
        <h1>MMTF 組織診斷報告</h1>
        <p>透過四大維度評估組織當前運作狀態，提供改善建議與行動方向</p>
    </header>

    <div class="risk-section">
        <div class="risk-left">
            <div class="circle-ui" id="risk-circle">
                <span id="total-val" style="font-size:36px;">0</span>
                <span style="font-size:11px; color:#999;">/ 100</span>
            </div>
            <div class="risk-text">
                <h2 id="level-name">計算中...</h2>
                <p>組織在多項維度存在明顯風險，建議優先改善以降低潛在影響。</p>
            </div>
        </div>
        <div class="risk-right">
            <div class="legend-title">💡 風險等級說明</div>
            <ul class="legend-list">
                <li><span class="dot" style="background:var(--high)"></span> 高風險 (0-50分)：需立即關注與改善</li>
                <li><span class="dot" style="background:var(--mid)"></span> 中風險 (51-75分)：建議積極改善強化</li>
                <li><span class="dot" style="background:var(--low)"></span> 低風險 (76-100分)：組織狀態良好，持續維持</li>
            </ul>
        </div>
    </div>

    <div class="data-visual-row">
        <div>
            <div class="section-h">📊 四大維度得分</div>
            <div id="bar-list"></div>
        </div>
        <div style="text-align:center;">
            <div class="section-h" style="text-align:left;">🕸️ MMTF 四維度雷達圖</div>
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <div class="section-h" style="margin-left:5px;">🧠 AI 分析結果</div>
    <div class="ai-grid" id="ai-row"></div>

    <div class="summary-box">
        <div class="section-h" style="margin-top:0;">💡 總結與建議</div>
        <p class="summary-p" id="eval-text"></p>
        <div class="steps-row" id="steps-row"></div>
    </div>
    
    <div style="text-align:center; font-size:11px; color:#bbb; margin-top:30px;">
        報告產生時間：<span id="date-now"></span> | MMTF 組織診斷系統自動產出
    </div>
</div>

<script>
window.onload = function() {
    const url = new URLSearchParams(window.location.search);
    const data = {
        mirror: parseInt(url.get('mirror')) || 0,
        matrix: parseInt(url.get('matrix')) || 0,
        flow: parseInt(url.get('flow')) || 0,
        safe: parseInt(url.get('safe')) || 0
    };
    const total = data.mirror + data.matrix + data.flow + data.safe;
    document.getElementById('total-val').innerText = total;
    document.getElementById('date-now').innerText = new Date().toISOString().split('T')[0];

    // 風險等級判定
    let rank = { n: "低風險", c: "var(--low)" };
    if(total <= 50) rank = { n: "高風險", c: "var(--high)" };
    else if(total <= 75) rank = { n: "中風險", c: "var(--mid)" };
    
    document.getElementById('level-name').innerText = rank.n;
    document.getElementById('level-name').style.color = rank.c;
    document.getElementById('risk-circle').style.borderColor = rank.c;

    // MMTF 理論與實證建議資料庫
    const lib = [
        { 
            k:'mirror', l:'Mirror (鏡像)', 
            d:'回饋機制薄弱，認知落差大。員工可能感受不到被理解與被看見，導致參與度下降。', 
            act:['建立雙向回饋機制','定期進行意見收集','強化主管同理與傾聽能力'] 
        },
        { 
            k:'matrix', l:'Matrix (結構)', 
            d:'組織結構與職責劃分不清，容易造成權責不明與資源重疊或缺口。', 
            act:['釐清角色與職責','優化組織架構與流程','建立清晰的決策機制'] 
        },
        { 
            k:'flow', l:'Information Flow (資訊流)', 
            d:'資訊流通不順暢，部門間溝通阻礙可能導致效率低落與誤解增加。', 
            act:['建立有效的資訊共享平台','強化跨部門溝通管道','減少資訊傳遞層級'] 
        },
        { 
            k:'safe', l:'Psychological Safety (心理安全)', 
            d:'員工可能擔心犯錯或被批評，不敢表達想法，影響創新與團隊合作。', 
            act:['建立信任與包容的文化','鼓勵表達不同觀點','領導者以身作則示範支持'] 
        }
    ];

    let barsH = ""; let aiH = "";
    lib.forEach(item => {
        let v = data[item.k];
        let color = v <= 12 ? "var(--high)" : v <= 18 ? "var(--mid)" : "var(--low)";
        let statusText = v <= 12 ? "高風險" : v <= 18 ? "中風險" : "穩定";

        barsH += `
            <div class="bar-item">
                <div class="bar-info"><span>${item.l}</span><span>${v} / 25</span></div>
                <div class="bar-track"><div class="bar-fill" style="width:${v*4}%; background:${color}"></div></div>
                <span class="bar-status" style="color:${color}">${statusText}</span>
            </div>`;
        
        aiH += `
            <div class="ai-card" style="border-top-color:${color}">
                <div class="ai-card-h"><span class="dot" style="background:${color}"></span> ${item.l} 偏低</div>
                <p>${item.d}</p>
                <b>建議行動</b>
                <ul>${item.act.map(a => `<li>${a}</li>`).join('')}</ul>
            </div>`;
    });
    document.getElementById('bar-list').innerHTML = barsH;
    document.getElementById('ai-row').innerHTML = aiH;

    // 總結
    document.getElementById('eval-text').innerText = `整體來看，組織在四大維度均處於高風險狀態，特別是在 Mirror 與 Matrix 構面表現最弱。建議優先從建立清晰的回饋機制與組織結構著手，逐步改善資訊流通與心理安全，打造更高效、協作且具備韌性的組織。`;

    const steps = ["1. 優先改善鏡像與結構", "2. 強化溝通與資訊流通", "3. 提升心理安全感", "4. 持續追蹤與檢視"];
    document.getElementById('steps-row').innerHTML = steps.map((s, i) => `
        <div class="step-item"><div class="step-n">${i+1}</div><div class="step-t">${s}</div></div>
    `).join('');

    // 雷達圖繪製 (Chart.js)
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ['Mirror (鏡像)', 'Matrix (結構)', 'Information Flow (資訊流)', 'Psychological Safety (心理安全)'],
            datasets: [{
                data: [data.mirror, data.matrix, data.flow, data.safe],
                backgroundColor: 'rgba(255, 77, 79, 0.2)',
                borderColor: '#ff4d4f',
                pointBackgroundColor: '#ff4d4f',
                borderWidth: 2,
                pointRadius: 3
            }]
        },
        options: {
            scales: {
                r: {
                    min: 0, max: 25,
                    ticks: { display: false, stepSize: 5 },
                    grid: { color: '#eee' },
                    pointLabels: { font: { size: 10 } }
                }
            },
            plugins: { legend: { display: false } }
        }
    });
};
</script>
</body>
</html>
