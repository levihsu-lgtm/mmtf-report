<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MMTF企業診斷報告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; margin:0; padding:20px;}
.container { max-width:1100px; margin:auto; }
.card {
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}
h1 { text-align:center; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }

.bar { background:#eee; border-radius:10px; overflow:hidden; margin:10px 0;}
.fill { height:20px; }

.red { background:#e53935;}
.orange { background:#fb8c00;}
.green { background:#43a047;}

.center { text-align:center; }

.circle {
  width:150px;
  height:150px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  margin:auto;
  color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>MMTF 組織診斷報告</h1>

<div class="card center">
<h2>整體健康指數</h2>
<div id="circle" class="circle"></div>
</div>

<div class="card">
<h2>四大維度分析</h2>

Mirror
<div class="bar"><div id="b1" class="fill"></div></div>

Matrix
<div class="bar"><div id="b2" class="fill"></div></div>

Information Flow
<div class="bar"><div id="b3" class="fill"></div></div>

Psychological Safety
<div class="bar"><div id="b4" class="fill"></div></div>

</div>

<div class="card">
<h2>雷達圖</h2>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h2>AI診斷分析</h2>
<div id="analysis"></div>
</div>

<div class="card">
<h2>改善建議</h2>
<div id="advice"></div>
</div>

</div>

<script>

// 讀URL參數
const p = new URLSearchParams(window.location.search);

let mirror = Number(p.get("mirror"));
let matrix = Number(p.get("matrix"));
let flow = Number(p.get("flow"));
let safe = Number(p.get("safe"));

// 總分
let total = mirror + matrix + flow + safe;

// ===== 圓形指數 =====
let circle = document.getElementById("circle");

circle.innerText = total;

if(total < 80){
  circle.style.background = "#e53935";
}else if(total < 120){
  circle.style.background = "#fb8c00";
}else{
  circle.style.background = "#43a047";
}

// ===== 條狀圖 =====
function setBar(id, val){
  let el = document.getElementById(id);
  el.style.width = (val*4) + "%";

  if(val < 15) el.className = "fill red";
  else if(val < 25) el.className = "fill orange";
  else el.className = "fill green";
}

setBar("b1", mirror);
setBar("b2", matrix);
setBar("b3", flow);
setBar("b4", safe);

// ===== 雷達圖 =====
new Chart(document.getElementById("chart"), {
type: 'radar',
data: {
labels: ["Mirror","Matrix","Flow","Safety"],
datasets: [{
label:"MMTF",
data:[mirror,matrix,flow,safe],
fill:true
}]
}
});

// ===== AI分析 =====
let txt = "";

if(mirror < 15) txt += "🔴 Mirror偏低：回饋與認知失衡<br>";
if(matrix < 15) txt += "🔴 Matrix偏低：組織結構混亂<br>";
if(flow < 15) txt += "🟡 Flow偏低：溝通效率低<br>";
if(safe < 15) txt += "🟡 Safety偏低：心理安全不足<br>";

if(txt==="") txt="🟢 組織運作良好";

document.getElementById("analysis").innerHTML = txt;

// ===== 建議 =====
let advice = `
1. 優先調整組織結構（Matrix）<br>
2. 建立回饋機制（Mirror）<br>
3. 優化溝通流程（Flow）<br>
4. 建立心理安全文化（Safety）
`;

document.getElementById("advice").innerHTML = advice;

</script>

</body>
</html>
