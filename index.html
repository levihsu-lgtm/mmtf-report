<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 組織氣候與管理效能診斷專業報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --high: #52c41a; --mid: #faad14; --low: #ff4d4f;
            --primary: #1a3a63; --secondary: #64748b; --bg: #f0f2f5; --card-blue: #f8fafc;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background-color: #cbd5e1; display: flex; flex-direction: column; align-items: center; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }

        .report-container {
            width: 1100px;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            color: #1e293b;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 32px; color: var(--primary); margin: 0; font-weight: 700; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 10px; }

        /* 1. 指標區 */
        .top-risk-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px; margin-bottom: 30px; }
        .risk-main { border: 1px solid #e2e8f0; border-radius: 16px; padding: 25px; display: flex; align-items: center; background: #fff; transition: background 0.3s; }
        .score-circle { width: 110px; height: 110px; border: 10px solid #eee; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-right: 25px; background: #fff; }
        .score-val { font-size: 36px; font-weight: bold; }
        .risk-text h2 { font-size: 28px; margin: 0; }

        /* 2. AI 實證分析 1x4 卡片 */
        .section-title { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 10px; margin-top: 25px; }
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 35px; }
        .ai-card { background: #fff; border: 1px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .ai-card h4 { margin: 0 0 8px 0; color: var(--primary); font-size: 15px; display: flex; align-items: center; gap: 5px; justify-content: space-between; }
        .status-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
        
        .ai-theory { font-size: 11px; color: #888; font-style: italic; margin-bottom: 8px; line-height: 1.3; }
        .ai-desc { font-size: 12px; line-height: 1.6; color: #475569; margin-bottom: 12px; min-height: 80px; }
        
        .action-list-title { font-size: 12px; font-weight: bold; color: #1e293b; margin-bottom: 6px; border-top: 1px solid #f1f5f9; padding-top: 10px; }
        .action-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .action-list li { font-size: 11px; color: #64748b; margin-bottom: 4px; display: flex; align-items: flex-start; gap: 5px; }

        /* 3. 中段分析（雷達圖與強化結論） */
        .mid-row { display: grid; grid-template-columns: 0.6fr 1.4fr; gap: 40px; margin-bottom: 35px; border-top: 1px solid #f1f5f9; padding-top: 30px; }
        .radar-box { text-align: center; border-right: 1px solid #f1f5f9; padding-right: 20px; }
        #radarChart { max-width: 220px !important; max-height: 220px !important; margin: 0 auto; }
        
        .conclusion-box { padding: 5px; }
        .summary-card { background: #f8fafc; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; }
        .summary-title { font-weight: bold; color: var(--primary); font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .summary-content { font-size: 14px; line-height: 1.8; color: #334155; }
        
        /* 4. 衝突與警示 */
        .alert-area { margin-top: 15px; }
        .conflict-tag { display: inline-block; background: #fff1f0; border: 1px solid #ffccc7; color: #cf1322; padding: 10px 15px; border-radius: 8px; width: 100%; margin-bottom: 10px; }

        /* 5. 行動與提醒 */
        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #f1f5f9; padding-top: 30px; }
        .steps-box { background: var(--card-blue); padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .step-item { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 15px; position: relative; }
        .step-item:not(:last-child)::after { content: ''; position: absolute; left: 14px; top: 32px; width: 2px; height: calc(100% - 15px); background: #cbd5e1; }
        .step-num { width: 30px; height: 30px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0; }
        .step-txt { font-size: 13px; font-weight: 500; padding-top: 5px; }
        .remind-box { padding: 25px; border-radius: 16px; height: fit-content; border: 1px dashed #ccc; }

        .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 40px; }
    </style>
</head>
<body>

<div class="report-container">
    <div class="header">
        <h1>MMTF 組織診斷與實證分析報告</h1>
    </div>

    <div class="top-risk-row">
        <div class="risk-main" id="riskMainCard">
            <div class="score-circle">
                 <span class="score-val" id="totalScoreVal">--</span>
                 <span style="font-size:11px; color:#999;">/100</span>
            </div>
            <div class="risk-text">
                 <h2 id="riskTitle">分析中...</h2>
                 <p id="riskDesc" style="font-size:14px; color:#64748b; margin:5px 0 0 0;">正在解析 MMTF 管理能量矩陣。</p>
            </div>
        </div>
        <div class="risk-main" style="display:block; background:#fff;">
            <div style="font-weight:bold; font-size:14px; margin-bottom:10px;">📊 MMTF 指標定義</div>
            <p style="font-size:12px; color:#666; line-height:1.6; margin:0;">本診斷基於對稱性管理理論，評估組織在「認知對齊(Mirror)」、「權責結構(Matrix)」、「資訊流動(Flow)」與「心理安全(Safety)」四大維度的協同效應。</p>
        </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-brain"></i> AI 實證構面分析</div>
    <div class="ai-grid" id="aiGrid"></div>

    <div class="mid-row">
        <div class="radar-box">
            <canvas id="radarChart"></canvas>
            <p style="font-size:11px; color:#94a3b8; margin-top:10px;">MMTF 四維雷達圖</p>
        </div>
        <div class="conclusion-box">
            <div class="summary-card">
                <div class="summary-title"><i class="fa-solid fa-file-contract"></i> Executive Summary (診斷核心結論)</div>
                <div id="conclusionContent" class="summary-content">載入中...</div>
                <div id="alertArea" class="alert-area"></div>
            </div>
        </div>
    </div>

    <div class="bottom-row">
        <div class="steps-box">
            <h4 style="margin:0 0 20px 0; color:var(--primary);">🚀 戰略行動指南 (Strategic Actions)</h4>
            <div id="stepsContainer"></div>
        </div>
        <div class="remind-box" id="remindBox">
            <h4 id="remindTitle">💡 顧問關鍵點評</h4>
            <p id="remindText" style="font-size:14px; line-height:1.6; color:#475569;"></p>
        </div>
    </div>

    <div class="footer" id="reportDate"></div>
</div>

<script>
window.onload = function() {
    const params = new URLSearchParams(location.search);
    const scores = {
        mirror: parseInt(params.get('mirror')) || 5,
        matrix: parseInt(params.get('matrix')) || 5,
        flow:   parseInt(params.get('flow'))   || 5,
        safe:   parseInt(params.get('safe'))   || 5
    };
    const totalScore = scores.mirror + scores.matrix + scores.flow + scores.safe;

    // 內容資料庫
    const DB = {
        mirror: { title: "Mirror (鏡像對稱)", high: "認知共振", mid: "認知雜訊", low: "認知斷層" },
        matrix: { title: "Matrix (結構效能)", high: "靈活治理", mid: "功能重疊", low: "結構失序" },
        flow:   { title: "Flow (資訊能流)", high: "透明流動", mid: "節點阻滯", low: "資訊孤島" },
        safe:   { title: "Safety (心理安全)", high: "無畏創新", mid: "條件信任", low: "恐懼文化" }
    };

    function getLv(s) { return s >= 18 ? 'high' : (s >= 12 ? 'mid' : 'low'); }
    const worstK = Object.keys(scores).reduce((a, b) => scores[a] < scores[b] ? a : b);
    const bestK = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);

    // 1. 頂部狀態更新
    const riskUI = totalScore >= 70 ? { title: "高能卓越型 (Optimized)", color: "#52c41a", bg: "#f6ffed" } :
                   totalScore >= 45 ? { title: "亞健康運作型 (Vulnerable)", color: "#faad14", bg: "#fffbe6" } :
                                    { title: "高風險失能型 (Fragile)", color: "#ff4d4f", bg: "#fff1f0" };

    document.getElementById('totalScoreVal').innerText = totalScore;
    document.getElementById('totalScoreVal').style.color = riskUI.color;
    document.getElementById('riskTitle').innerText = riskUI.title;
    document.getElementById('riskTitle').style.color = riskUI.color;
    document.getElementById('riskMainCard').style.background = `linear-gradient(135deg, #fff 0%, ${riskUI.bg} 100%)`;

    // 2. 構面卡片
    const details = {
        mirror: { theory: "Johari Window", desc: "目標理解與反饋一致性。", action: "啟動雙向回饋機制。" },
        matrix: { theory: "RACI Theory", desc: "權責定義與資源分配效率。", action: "重新梳理核心 RACI 矩陣。" },
        flow: { theory: "Communication Theory", desc: "資訊傳遞透明度與損耗率。", action: "建立即時異常回報看板。" },
        safe: { theory: "Psychological Safety", desc: "錯誤容忍度與團隊信任感。", action: "導入無責異常申報文化。" }
    };
    
    let aiGridHTML = "";
    ['mirror', 'matrix', 'flow', 'safe'].forEach(k => {
        const lv = getLv(scores[k]);
        aiGridHTML += `<div class="ai-card" style="border-top-color: ${lv==='high'? '#52c41a' : lv==='mid'?'#faad14':'#ff4d4f'}">
            <h4>${DB[k].title} <span class="status-tag" style="background:#eee;">${DB[k][lv]}</span></h4>
            <div class="ai-theory">${details[k].theory}</div>
            <div class="ai-desc">${details[k].desc}</div>
            <div class="action-list-title">建議行動</div>
            <ul class="action-list"><li>${details[k].action}</li></ul>
        </div>`;
    });
    document.getElementById('aiGrid').innerHTML = aiGridHTML;

    // 3. 🔥【強化核心：綜合結論分析】
    let summaryHTML = "";
    const bestStatus = DB[bestK][getLv(scores[bestK])];
    const worstStatus = DB[worstK][getLv(scores[worstK])];

    summaryHTML = `本次診斷反映組織綜合管理能量為 <b>${totalScore}</b>。
    當前組織展現出強大的 <b>「${bestStatus}」</b> 特質（位於 ${DB[bestK].title}），這是目前維持運作的核心動能。
    然而，系統內部的能量耗損主要源於 <b>「${worstStatus}」</b>（位於 ${DB[worstK].title}），該構面已形成明顯的「管理瓶頸」，限制了整體策略執行力。
    <br><br>
    <b>戰略解讀：</b>組織目前的運作模式呈現「局部優化、整體受限」的特徵。若不優先修復脆弱構面，優勢構面的能量將被內耗持續侵蝕。`;

    document.getElementById('conclusionContent').innerHTML = summaryHTML;

    // 4. 🔥【強化核心：衝突診斷引擎】
    let alerts = [];
    if(scores.safe <= 10 && scores.flow >= 16) {
        alerts.push({ type: "虛假透明度 (False Transparency)", desc: "資訊流動雖快，但因缺乏安全感導致員工隱瞞真實風險。" });
    }
    if(scores.matrix <= 10 && scores.mirror >= 16) {
        alerts.push({ type: "認知空轉 (Cognitive Free-wheeling)", desc: "團隊對目標有共識，但缺乏明確權責落地，導致行動失序。" });
    }
    if(Math.max(...Object.values(scores)) - Math.min(...Object.values(scores)) >= 12) {
        alerts.push({ type: "系統對稱性破缺 (Symmetry Breaking)", desc: "構面間極度不平衡，組織面臨結構性斷層風險。" });
    }
    
    document.getElementById('alertArea').innerHTML = alerts.map(a => `
        <div class="conflict-tag">
            <strong>⚠️ ${a.type}</strong><br>
            <small style="font-size:12px;">診斷警示：${a.desc}</small>
        </div>
    `).join('');

    // 5. 行動指南路徑
    const actionPath = [
        `優先補強核心缺口：針對 <b>${DB[worstK].title}</b> 實施專項干預。`,
        `槓桿現有優勢：利用 <b>${DB[bestK].title}</b> 的能量帶動跨單位協同。`,
        `導入 MMTF 雙向監測：建立 90 天一次的管理能量動態追蹤。`
    ];
    document.getElementById('stepsContainer').innerHTML = actionPath.map((s, i) => `
        <div class="step-item"><div class="step-num">${i+1}</div><div class="step-txt">${s}</div></div>
    `).join('');

    document.getElementById('remindText').innerText = `目前最重要的管理動作是「修補而非擴張」。在「${worstStatus}」未改善前，任何新的流程導入都可能增加員工的心理負荷。`;

    // 6. 雷達圖
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ["Mirror", "Matrix", "Flow", "Safety"],
            datasets: [{
                data: [scores.mirror, scores.matrix, scores.flow, scores.safe],
                backgroundColor: `${riskUI.color}22`,
                borderColor: riskUI.color,
                borderWidth: 2,
                pointRadius: 4
            }]
        },
        options: {
            scales: { r: { min: 0, max: 25, ticks: { display: false } } },
            plugins: { legend: { display: false } }
        }
    });

    document.getElementById('reportDate').innerText = `MMTF 旗艦診斷模組 v2.1 | 生成日期：${new Date().toISOString().split('T')[0]}`;
};
</script>
</body>
</html>
