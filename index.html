<script>
window.onload = function () {

    // ===== 1. 取得分數 =====
    const params = new URLSearchParams(window.location.search);
    const scores = {
        mirror: parseInt(params.get('mirror')) || 10,
        matrix: parseInt(params.get('matrix')) || 10,
        flow: parseInt(params.get('flow')) || 10,
        safe: parseInt(params.get('safe')) || 10
    };

    const totalScore = Math.round(
        ((scores.mirror + scores.matrix + scores.flow + scores.safe) / 100) * 100
    );

    // ===== 2. 顧問語言引擎 =====
    function getNarrative(score) {
        if (score >= 90) {
            return {
                title: "卓越進化型組織",
                color: "#52c41a",
                bg: "#f6ffed",
                desc: "組織已達高度成熟與穩定運作狀態，具備良好決策與執行能力。",
                remind: "建議持續引入外部觀點與挑戰機制，避免成功慣性導致創新停滯。",
                tone: "evolve"
            };
        } else if (score >= 75) {
            return {
                title: "高效成長型組織",
                color: "#73d13d",
                bg: "#fcffe6",
                desc: "組織具備穩定基礎與成長潛力，關鍵能力已逐步建立。",
                remind: "建議放大優勢構面並強化跨部門協同。",
                tone: "grow"
            };
        } else if (score >= 60) {
            return {
                title: "穩定運作型組織",
                color: "#faad14",
                bg: "#fffbe6",
                desc: "整體運作尚可，但局部效率損耗逐漸浮現。",
                remind: "需聚焦關鍵瓶頸進行優化，避免累積性問題擴大。",
                tone: "optimize"
            };
        } else if (score >= 45) {
            return {
                title: "結構失衡型組織",
                color: "#ff7a45",
                bg: "#fff7e6",
                desc: "組織已出現明顯斷層，影響決策與執行品質。",
                remind: "建議優先檢視結構與資訊流動機制，避免進一步惡化。",
                tone: "intervene"
            };
        } else {
            return {
                title: "高風險失序型組織",
                color: "#ff4d4f",
                bg: "#fff1f0",
                desc: "核心運作機制已失效，組織風險極高。",
                remind: "需立即進行結構重整與信任修復。",
                tone: "rebuild"
            };
        }
    }

    const riskUI = getNarrative(totalScore);

    // ===== 3. UI 更新 =====
    document.getElementById('totalScoreVal').innerText = totalScore;
    document.getElementById('totalScoreVal').style.color = riskUI.color;
    document.getElementById('totalScoreCircle').style.borderColor = riskUI.color;
    document.getElementById('riskTitle').innerText = riskUI.title;
    document.getElementById('riskTitle').style.color = riskUI.color;
    document.getElementById('riskDesc').innerText = riskUI.desc;
    document.getElementById('riskMainCard').style.background =
        `linear-gradient(135deg, #fff 0%, ${riskUI.bg} 100%)`;

    document.getElementById('remindText').innerText = riskUI.remind;

    // ===== 4. 問題邏輯（免費版亮點） =====
    function getKeyIssue(scores) {
        const lowest = Object.keys(scores).reduce((a, b) =>
            scores[a] < scores[b] ? a : b
        );

        const mapping = {
            mirror: "認知不一致",
            matrix: "權責結構模糊",
            flow: "資訊傳遞斷層",
            safe: "心理安全不足"
        };

        return mapping[lowest];
    }

    // ===== 5. 結論（顧問語氣） =====
    document.getElementById('conclusionText').innerHTML = `
        本次評估顯示整體組織效能為 <b>${totalScore}分</b>，
        屬於「${riskUI.title}」。<br><br>
        當前主要挑戰來自於 <b>${getKeyIssue(scores)}</b>，
        該因素已開始影響整體決策品質與執行效率。<br><br>
        若未及時調整，可能逐步演變為跨部門協作失衡與組織信任下降。
    `;

    // ===== 6. 補充建議（不給細節） =====
    const suggestions = {
        mirror: "建議強化跨層級認知對齊與回饋機制",
        matrix: "建議重新檢視權責配置與決策結構",
        flow: "建議優化資訊透明度與傳遞效率",
        safe: "建議提升心理安全與回報文化"
    };

    const stepsContainer = document.getElementById('stepsContainer');

    Object.keys(scores).forEach((key, i) => {
        stepsContainer.innerHTML += `
            <div class="step-item">
                <div class="step-num">${i + 1}</div>
                <div class="step-txt">${suggestions[key]}</div>
            </div>
        `;
    });

    // ===== 7. 雷達圖 =====
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ["Mirror", "Matrix", "Flow", "Safety"],
            datasets: [{
                data: [scores.mirror, scores.matrix, scores.flow, scores.safe],
                backgroundColor: `${riskUI.color}22`,
                borderColor: riskUI.color,
                borderWidth: 2
            }]
        },
        options: {
            scales: { r: { min: 0, max: 25 } },
            plugins: { legend: { display: false } }
        }
    });

};
</script>
