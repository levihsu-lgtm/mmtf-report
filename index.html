<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTF 專業組織診斷報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --high: #ff4d4f; --mid: #faad14; --low: #52c41a;
            --primary: #1a3a63; --bg: #f0f2f5; --card-bg: #ffffff;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 30px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: var(--card-bg); padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { margin: 0; color: var(--primary); font-size: 28px; }
        .model-tag { display: inline-block; background: var(--primary); color: #fff; padding: 5px 20px; border-radius: 20px; margin-top: 10px; font-weight: bold; }

        /* 風險概覽 */
        .risk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .risk-box { border: 1px solid #f0f0f0; border-radius: 12px; padding: 20px; display: flex; align-items: center; }
        .score-circle { width: 100px; height: 100px; border: 10px solid #eee; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-right: 20px; }
        .score-num { font-size: 32px; font-weight: bold; }

        /* 數據細項 */
        .data-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; margin-bottom: 30px; }
        .bar-item { margin-bottom: 15px; }
        .bar-info { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        .bar-bg { background: #e8e8e8; height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 1s; }

        /* AI分析卡片 (1x4) */
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .ai-card { background: #fafafa; border-radius: 10px; padding: 15px; border-top: 4px solid var(--primary); text-align: center; }
        .ai-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #555; }
        .ai-status { font-size: 14px; font-weight: bold; }

        /* 結論建議 */
        .summary-section { background: #f4f8ff; padding: 30px; border-radius: 12px; border-left: 6px solid var(--primary); }
        .summary-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; }
        .summary-content { white-space: pre-wrap; font-size: 14px; line-height: 1.8; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MMTF 組織診斷結果報告</h1>
        <div id="model" class="model-tag">正在分析模型型態...</div>
    </div>

    <div class="risk-row">
        <div class="risk-box">
            <div class="score-circle" id="circleBorder">
                <span class="score-num" id="totalScore">0</span>
                <span style="font-size:10px;color:#999">/100</span>
            </div>
            <div>
                <div id="riskLevelTxt" style="font-size:24px; font-weight:bold;">分析中</div>
                <div style="font-size:12px; color:#777;">組織整體健康度指標</div>
            </div>
        </div>
        <div class="risk-box" style="font-size:12px; line-height:1.6; color:#666;">
            <b>風險標註說明：</b><br>
            ● 高風險 (0-50)：核心管理鏈條斷裂<br>
            ● 中風險 (51-75)：存在局部管理短板<br>
            ● 低風險 (76-100)：體系健全，持續優化
        </div>
    </div>

    <div class="data-row">
        <div id="bars">
            </div>
        <div style="text-align:center;">
            <canvas id="radar" width="200" height="200"></canvas>
        </div>
    </div>

    <div class="ai-grid" id="ai">
        </div>

    <div class="summary-section">
        <div class="summary-title">💡 顧問深度結論與建議方案</div>
        <div id="summary" class="summary-content"></div>
    </div>
</div>

<script>
// 1. 數據獲取與初始化
const urlParams = new URLSearchParams(window.location.search);
const s = {
    mirror: parseInt(urlParams.get('mirror')) || 12,
    matrix: parseInt(urlParams.get('matrix')) || 10,
    flow: parseInt(urlParams.get('flow')) || 10,
    safe: parseInt(urlParams.get('safe')) || 10
};
const total = s.mirror + s.matrix + s.flow + s.safe;

// 2. MMTF 模型判定邏輯
function model() {
    let top = (s.mirror + s.matrix) / 2;
    let bot = (s.flow + s.safe) / 2;

    if (top >= 18 && bot < 12) return "制度失真型";
    if (top < 12 && bot >= 15) return "官僚失衡型";
    if (top < 12 && bot < 12) return "全面崩壞型";
    if (top >= 18 && bot >= 18) return "高效能型";
    return "過渡型";
}

// 3. UI 更新：模型、總分與風險等級
const currentModel = model();
document.getElementById('model').innerText = "診斷模型：" + currentModel;
document.getElementById('totalScore').innerText = total;

let riskColor = "var(--low)";
let riskLevel = "低風險狀態";

if (total <= 50) {
    riskColor = "var(--high)";
    riskLevel = "高風險狀態";
} else if (total <= 75) {
    riskColor = "var(--mid)";
    riskLevel = "中風險狀態";
}

document.getElementById('riskLevelTxt').innerText = riskLevel;
document.getElementById('riskLevelTxt').style.color = riskColor;
document.getElementById('circleBorder').style.borderColor = riskColor;
document.getElementById('totalScore').style.color = riskColor;

// 4. 渲染數據條 (Bars)
const dims = [
    ["Mirror (鏡像反饋)", s.mirror],
    ["Matrix (權責結構)", s.matrix],
    ["Flow (資訊流動)", s.flow],
    ["Safety (心理安全)", s.safe]
];

document.getElementById('bars').innerHTML = dims.map(d => {
    let c = d[1] <= 12 ? "var(--high)" : d[1] <= 18 ? "var(--mid)" : "var(--low)";
    return `
    <div class="bar-item">
        <div class="bar-info"><span>${d[0]}</span><span>${d[1]}/25</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${d[1] * 4}%;background:${c}"></div></div>
    </div>`;
}).join("");

// 5. 渲染雷達圖 (Radar)
new Chart(document.getElementById('radar'), {
    type: 'radar',
    data: {
        labels: ["Mirror", "Matrix", "Flow", "Safety"],
        datasets: [{
            data: [s.mirror, s.matrix, s.flow, s.safe],
            borderColor: "#1a3a63",
            backgroundColor: "rgba(26,58,99,.1)",
            borderWidth: 2,
            pointRadius: 3
        }]
    },
    options: {
        plugins: { legend: { display: false } },
        scales: { r: { min: 0, max: 25, ticks: { display: false } } }
    }
});

// 6. 渲染 AI 分析卡片 (1x4)
const aiTitles = ["管理認知落差", "組織結構問題", "資訊傳導效率", "心理安全狀態"];
document.getElementById('ai').innerHTML = aiTitles.map((t, i) => {
    let v = Object.values(s)[i];
    let c = v <= 12 ? "var(--high)" : v <= 18 ? "var(--mid)" : "var(--low)";
    return `
    <div class="ai-card">
        <div class="ai-title">${t}</div>
        <div class="ai-status" style="color:${c}">${v <= 12 ? "🚨 高風險" : v <= 18 ? "⚠️ 待優化" : "✅ 良好"}</div>
    </div>`;
}).join("");

// 7. 顧問結論邏輯
let summary = "";
if (total <= 50) {
    summary = `【診斷結論】\n組織已進入嚴重失衡狀態，模型判定為「${currentModel}」。\n\n【核心問題】\n目前的管理框架已無法有效約束執行層，${currentModel === "全面崩壞型" ? "各維度數據皆低於臨界值，存在系統性倒塌風險。" : "組織認知與基層體感完全斷裂。"}\n\n【主要風險】\n1. 決策嚴重失真：高層指令無法落地。\n2. 組織內耗嚴重：權責不清導致互相推諉。\n3. 人才流失風險：心理安全感缺失導致關鍵人才流向競爭對手。\n\n【90天優先行動方案】\n- 第一階段 (0~30天)：【破冰與重組】重新定義 Matrix 權責矩陣，進行核心高層認知對齊。\n- 第二階段 (30~60天)：【打通血管】建立 Flow 資訊透明看板，減少資訊孤島。\n- 第三階段 (60~90天)：【文化修復】推動 Mirror 回饋機制，修復基層心理安全感。`;
} else if (total <= 75) {
    summary = `【診斷結論】\n組織目前處於「中風險過渡期」，模型判定為「${currentModel}」。\n\n【核心建議】\n1. 針對得分最低的「${dims.reduce((a, b) => a[1] < b[1] ? a : b)[0]}」維度進行專項改善。\n2. 優化跨部門溝通流程，降低協作摩擦力。\n3. 建議每季進行一次複測，監控數據回升狀況。`;
} else {
    summary = `【診斷結論】\n組織運作健康，模型判定為「${currentModel}」。\n\n【維持建議】\n目前的管理機制（MMTF）運行良好，建議保持「高效能型」的運作狀態，並嘗試將成功經驗模組化，複製到其他事業單位。`;
}

document.getElementById('summary').innerText = summary;

</script>
</body>
</html>
