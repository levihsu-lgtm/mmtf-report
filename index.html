<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 組織氣候與管理效能診斷專業報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --high: #52c41a; --mid: #faad14; --low: #ff4d4f;
            --primary: #1a3a63; --bg: #f0f2f5; --card-blue: #f8fafc;
            --conflict-bg: #fff1f0; --conflict-text: #cf1322;
        }
        body { margin: 0; padding: 20px; background-color: #cbd5e1; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; }
        .report-container { width: 1100px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 32px; color: var(--primary); border-bottom: 3px solid var(--primary); padding-bottom: 10px; display: inline-block; }
        
        /* 指標區 */
        .top-risk-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px; margin-bottom: 30px; }
        .risk-main { border: 1px solid #e2e8f0; border-radius: 16px; padding: 25px; display: flex; align-items: center; }
        .score-circle { width: 100px; height: 100px; border: 8px solid #eee; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-right: 20px; }
        .score-val { font-size: 32px; font-weight: bold; }

        /* 四維度卡片 */
        .section-title { font-size: 18px; font-weight: bold; color: var(--primary); margin: 25px 0 15px; border-left: 5px solid var(--primary); padding-left: 10px; }
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .ai-card { background: #fff; border: 1px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 8px; padding: 15px; }
        .ai-theory { font-size: 11px; color: #888; font-style: italic; margin-bottom: 8px; }
        .ai-desc { font-size: 12px; line-height: 1.5; color: #475569; height: 100px; }
        .status-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; float: right; }

        /* 衝突組合工具包樣式 */
        .conflict-box { background: var(--conflict-bg); border: 1px solid #ffa39e; border-radius: 8px; padding: 15px; margin-bottom: 25px; display: none; }
        .conflict-tag { background: var(--conflict-text); color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 10px; }
        .conflict-item { margin-bottom: 10px; border-bottom: 1px dashed #ffa39e; padding-bottom: 10px; }
        .conflict-item:last-child { border: none; }

        .mid-row { display: grid; grid-template-columns: 0.7fr 1.3fr; gap: 40px; margin-top: 30px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
        .radar-box { text-align: center; }
        .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 40px; }
    </style>
</head>
<body>

<div class="report-container">
    <div class="header"><h1>MMTF 專業診斷與衝突組合分析</h1></div>

    <!-- 總分顯示 -->
    <div class="top-risk-row">
        <div class="risk-main" id="riskMainCard">
            <div class="score-circle"><span class="score-val" id="totalScoreVal">--</span></div>
            <div>
                <h2 id="riskTitle" style="margin:0">分析中...</h2>
                <p id="riskDesc" style="font-size:14px; color:#64748b;">正在運算 MMTF 矩陣模型...</p>
            </div>
        </div>
        <div class="risk-main" style="display:block">
            <div style="font-weight:bold; margin-bottom:5px;">💡 核心理念：Mirror Matrix Theory</div>
            <p style="font-size:12px; color:#666; margin:0">評估組織在「認知、結構、資訊、心理」四大維度的對稱能量。任何失衡都將轉化為管理內耗。</p>
        </div>
    </div>

    <!-- 衝突組合工具包 (動態顯示) -->
    <div id="conflictSection" class="conflict-box">
        <div style="font-weight:bold; color:var(--conflict-text); margin-bottom:10px;"><i class="fa-solid fa-triangle-exclamation"></i> 偵測到組織衝突組合 (Conflict Detected)</div>
        <div id="conflictList"></div>
    </div>

    <div class="section-title"><i class="fa-solid fa-magnifying-glass-chart"></i> 擴充顧問深度分析</div>
    <div class="ai-grid" id="aiGrid"></div>

    <div class="mid-row">
        <div class="radar-box">
            <canvas id="radarChart"></canvas>
        </div>
        <div class="conclusion-box" style="font-size:14px; line-height:1.7">
            <h3 style="color:var(--primary); margin-top:0">🔍 診斷綜合結論</h3>
            <div id="conclusionText"></div>
        </div>
    </div>

    <div class="footer" id="reportDate"></div>
</div>

<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const scores = {
        mirror: parseInt(params.get('mirror')) || 15,
        matrix: parseInt(params.get('matrix')) || 15,
        flow: parseInt(params.get('flow')) || 15,
        safe: parseInt(params.get('safe')) || 15
    };
    const totalScore = Math.round(((scores.mirror + scores.matrix + scores.flow + scores.safe) / 100) * 100);

    const insightDB = {
        mirror: { title: "Mirror (鏡像對稱)", theory: "Johari Window",
            high: { status: "認知共振", color: "#52c41a", insight: "團隊目標認知高度對齊，具備極強的自我修正基因。", implication: "決策傳達無須重複確認，執行速度快。" },
            mid:  { status: "認知雜訊", color: "#faad14", insight: "中基層對戰略理解存在細微落差，盲區隱現。", implication: "執行過程中可能出現偏差，需頻繁微調。" },
            low:  { status: "認知斷層", color: "#ff4d4f", insight: "管理層與基層認知嚴重不對稱，存在「黑箱」效應。", implication: "指令在傳遞中失真，基層產生強烈無力感。" }
        },
        matrix: { title: "Matrix (結構效能)", theory: "RACI Theory",
            high: { status: "靈活治理", color: "#52c41a", insight: "權責邊界清晰且具備彈性，資源分配對齊。", implication: "無效溝通成本極低，團隊自主性強。" },
            mid:  { status: "功能重疊", color: "#faad14", insight: "權責定義明確，但跨部門灰色地帶仍多。", implication: "遇到複雜問題時推諉現象偶發，效率耗損。" },
            low:  { status: "結構失序", color: "#ff4d4f", insight: "權責模糊，職能空缺與重疊並存，問責機制失效。", implication: "組織嚴重內耗，重要專案常因無人負責而停滯。" }
        },
        flow: { title: "Flow (資訊能流)", theory: "Communication Theory",
            high: { status: "透明流動", color: "#52c41a", insight: "資訊傳遞幾無損耗，數據驅動決策已成為文化。", implication: "組織對市場變化的反應時間低於同行平均。" },
            mid:  { status: "節點阻滯", color: "#faad14", insight: "資訊在特定管理層級發生阻滯，透明度不均。", implication: "基層反應問題到決策層存在顯著延遲。" },
            low:  { status: "資訊孤島", color: "#ff4d4f", insight: "資訊高度碎片化，各單位僅掌握局部事實。", implication: "策略落地被嚴重扭曲，決策依賴直覺而非數據。" }
        },
        safe: { title: "Safety (心理安全)", theory: "Psychological Safety",
            high: { status: "無畏創新", color: "#52c41a", insight: "團隊容錯率高，具備強大的失敗學習能力。", implication: "員工敢於挑戰現狀，是創新的沃土。" },
            mid:  { status: "條件信任", color: "#faad14", insight: "信任建立在利益上，面對危機時仍有保留。", implication: "負面消息傳遞緩慢，潛在風險易被掩蓋。" },
            low:  { status: "恐懼氛圍", color: "#ff4d4f", insight: "防衛性行為主導，員工傾向於隱瞞錯誤自保。", implication: "組織失去糾錯能力，重大風險正在積聚。" }
        }
    };

    function getLevel(s) { return s >= 18 ? 'high' : (s >= 11 ? 'mid' : 'low'); }

    // 衝突組合工具包邏輯
    function checkConflicts(s) {
        let list = [];
        if (s.flow >= 18 && s.safe <= 10) list.push({ name: "假透明陷阱", desc: "資訊流動極快但心理安全極低。員工會利用透明的渠道傳遞「美化後的數據」。" });
        if (s.matrix >= 18 && s.mirror <= 10) list.push({ name: "僵化指揮鏈", desc: "規章制度極其嚴明，但員工根本不認同目標。形成「機械式執行」但無靈魂。" });
        if (s.safe >= 18 && s.matrix <= 10) list.push({ name: "溫情俱樂部", desc: "大家感情很好、很有安全感，但誰該負責什麼都沒人知道。討論多、落地少。" });
        if (s.mirror >= 18 && s.flow <= 10) list.push({ name: "共識孤島", desc: "核心團隊認知極度一致，但缺乏對外傳遞路徑。好想法全悶在會議室裡。" });
        return list;
    }

    // 渲染 UI
    const conflicts = checkConflicts(scores);
    if (conflicts.length > 0) {
        document.getElementById('conflictSection').style.display = 'block';
        document.getElementById('conflictList').innerHTML = conflicts.map(c => `
            <div class="conflict-item"><span class="conflict-tag">${c.name}</span><span style="font-size:13px; color:#444">${c.desc}</span></div>
        `).join('');
    }

    document.getElementById('totalScoreVal').innerText = totalScore;
    document.getElementById('totalScoreVal').style.color = totalScore >= 70 ? '#52c41a' : (totalScore >= 45 ? '#faad14' : '#ff4d4f');
    document.getElementById('riskTitle').innerText = totalScore >= 70 ? "卓越效能型" : (totalScore >= 45 ? "風險預警型" : "系統失能型");

    // 渲染分析卡片
    ['mirror', 'matrix', 'flow', 'safe'].forEach(k => {
        const d = insightDB[k][getLevel(scores[k])];
        document.getElementById('aiGrid').innerHTML += `
            <div class="ai-card" style="border-top-color:${d.color}">
                <div style="font-weight:bold; font-size:14px; margin-bottom:5px;">${insightDB[k].title} <span class="status-tag" style="background:${d.color}22; color:${d.color}">${d.status}</span></div>
                <div class="ai-theory">${insightDB[k].theory}</div>
                <div class="ai-desc"><strong>洞察：</strong>${d.insight}<br><br><strong>影響：</strong>${d.implication}</div>
            </div>
        `;
    });

    document.getElementById('conclusionText').innerHTML = `
        當前組織 MMTF 指數為 <b>${totalScore}</b>。系統偵測顯示：<br>
        1. 核心優勢在於 <b>${insightDB[Object.keys(scores).reduce((a,b)=>scores[a]>scores[b]?a:b)].title}</b>。<br>
        2. 應優先優化 <b>${insightDB[Object.keys(scores).reduce((a,b)=>scores[a]<scores[b]?a:b)].title}</b> 以解除系統瓶頸。<br>
        ${conflicts.length > 0 ? `<span style="color:red">⚠️ 警告：組織存在 ${conflicts.length} 項結構性衝突，建議立即進行管理對齊。</span>` : "✅ 組織結構相對對稱，運作穩定。"}
    `;

    // 雷達圖
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ["Mirror", "Matrix", "Flow", "Safety"],
            datasets: [{
                data: [scores.mirror, scores.matrix, scores.flow, scores.safe],
                backgroundColor: 'rgba(26, 58, 99, 0.1)',
                borderColor: '#1a3a63',
                pointBackgroundColor: '#1a3a63'
            }]
        },
        options: { scales: { r: { min: 0, max: 25, ticks: { display: false } } }, plugins: { legend: { display: false } } }
    });

    document.getElementById('reportDate').innerText = `MMTF 專業分析模組 v1.2 | 產出日期：${new Date().toLocaleDateString()}`;
};
</script>
</body>
</html>
