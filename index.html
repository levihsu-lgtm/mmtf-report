<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 組織氣候與管理效能診斷專業報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --high-score: #52c41a; --mid-score: #faad14; --low-score: #ff4d4f;
            --primary: #1a3a63; --bg: #f0f2f5; --card-blue: #f8fafc;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background-color: #cbd5e1; display: flex; flex-direction: column; align-items: center; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        .report-container { width: 1100px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); color: #1e293b; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 32px; color: var(--primary); margin: 0; font-weight: 700; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 10px; }
        
        /* 1. 總覽區與動態圓環 */
        .top-risk-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px; margin-bottom: 30px; }
        .risk-main { border: 1px solid #e2e8f0; border-radius: 16px; padding: 25px; display: flex; align-items: center; background: #fff; border-left: 8px solid #eee; }
        .score-circle-wrap { position: relative; width: 110px; height: 110px; margin-right: 25px; flex-shrink: 0; }
        .score-circle-svg { transform: rotate(-90deg); width: 110px; height: 110px; }
        .score-circle-bg { fill: none; stroke: #eee; stroke-width: 10; }
        .score-circle-bar { fill: none; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 1.5s ease-out; }
        .score-text-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
        .score-val { font-size: 32px; font-weight: bold; }
        
        /* 2. 多元組合邏輯分析區 (New) */
        .logic-analysis-box { background: #f1f5f9; border-radius: 12px; padding: 20px; margin-bottom: 30px; border-top: 4px solid var(--primary); }
        .logic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .logic-item { background: #fff; padding: 12px 15px; border-radius: 8px; font-size: 13px; border-left: 4px solid #cbd5e1; }
        .logic-label { font-weight: bold; color: var(--primary); margin-bottom: 5px; display: block; }

        /* 3. AI 實證構面卡片 */
        .section-title { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 10px; margin-top: 25px; }
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 35px; }
        .ai-card { background: #fff; border: 1px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .ai-card h4 { margin: 0 0 8px 0; color: var(--primary); font-size: 14px; display: flex; align-items: center; gap: 5px; justify-content: space-between; }
        .ai-desc { font-size: 12px; line-height: 1.6; color: #475569; margin-bottom: 12px; min-height: 80px; }

        /* 雷達圖與結論 */
        .mid-row { display: grid; grid-template-columns: 0.6fr 1.4fr; gap: 40px; margin-bottom: 35px; }
        #radarChart { max-width: 180px !important; margin: 0 auto; }
        .conclusion-box { font-size: 14px; line-height: 1.8; }
        
        /* 衝突工具包 */
        .toolkit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .toolkit-card { border: 1px solid #ffccc7; border-radius: 12px; padding: 18px; background: #fff1f0; border-left: 6px solid #ff4d4f; }
        
        .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 40px; }
    </style>
</head>
<body>
<div class="report-container">
    <div class="header">
        <h1>MMTF 組織診斷與多元邏輯分析報告</h1>
    </div>
    
    <div class="top-risk-row">
        <div class="risk-main" id="riskMainCard">
            <div class="score-circle-wrap">
                <svg class="score-circle-svg" viewBox="0 0 100 100">
                    <circle class="score-circle-bg" cx="50" cy="50" r="45"></circle>
                    <circle id="scoreBar" class="score-circle-bar" cx="50" cy="50" r="45"></circle>
                </svg>
                <div class="score-text-overlay">
                    <span class="score-val" id="totalScoreVal">--</span>
                    <span style="font-size:10px; color:#999;">TOTAL</span>
                </div>
            </div>
            <div class="risk-text">
                <h2 id="riskTitle">分析中...</h2>
                <p id="riskDesc" style="font-size:14px; color:#64748b; margin:5px 0 0 0;">正在運算多元組合邏輯[cite: 2]。</p>
            </div>
        </div>
        <div class="risk-main" style="display:block; background:#fff; border-left: none;">
            <div style="font-weight:bold; font-size:14px; margin-bottom:10px;">📊 診斷核心摘要</div>
            <div id="conclusionSummary" style="font-size:12px; color:#666; line-height:1.6;">載入中...</div>
        </div>
    </div>

    <!-- 多元組合邏輯分析區 -->
    <div class="section-title"><i class="fa-solid fa-layer-group"></i> 多元組合邏輯分析 (Multidimensional Analysis)</div>
    <div class="logic-analysis-box">
        <div class="logic-grid" id="logicGrid"></div>
    </div>

    <div class="section-title"><i class="fa-solid fa-brain"></i> 四維度實證解析</div>
    <div class="ai-grid" id="aiGrid"></div>

    <div class="mid-row">
        <div class="radar-box">
            <canvas id="radarChart"></canvas>
        </div>
        <div class="conclusion-box">
            <h3 style="margin-top:0; color:var(--primary);">🔍 行動優先級建議</h3>
            <div id="actionPriority"></div>
        </div>
    </div>

    <div id="toolkitSection" style="display:none; margin-bottom: 35px;">
        <div class="section-title" style="color:#ff4d4f; border-left-color:#ff4d4f;"><i class="fa-solid fa-toolbox"></i> 衝突應變處理工具包</div>
        <div class="toolkit-grid" id="toolkitGrid"></div>
    </div>

    <div class="footer" id="reportDate"></div>
</div>

<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const scores = {
        mirror: parseInt(params.get('mirror')) || 10,
        matrix: parseInt(params.get('matrix')) || 10,
        flow: parseInt(params.get('flow')) || 10,
        safe: parseInt(params.get('safe')) || 10
    };
    const totalScore = Math.round(((scores.mirror + scores.matrix + scores.flow + scores.safe) / 100) * 100);
    const riskColor = totalScore >= 70 ? "#52c41a" : (totalScore >= 45 ? "#faad14" : "#ff4d4f");

    // 1. 動態圓環渲染
    const bar = document.getElementById('scoreBar');
    const offset = 283 - (283 * totalScore) / 100;
    setTimeout(() => { bar.style.strokeDashoffset = offset; bar.style.stroke = riskColor; }, 100);
    document.getElementById('totalScoreVal').innerText = totalScore;
    document.getElementById('totalScoreVal').style.color = riskColor;
    document.getElementById('riskTitle').innerText = totalScore >= 70 ? "高能卓越型" : (totalScore >= 45 ? "亞健康運作型" : "高風險失能型");
    document.getElementById('riskTitle').style.color = riskColor;
    document.getElementById('riskMainCard').style.borderLeftColor = riskColor;

    // 2. 多元組合邏輯判斷[cite: 2]
    const logicGrid = document.getElementById('logicGrid');
    const addLogic = (label, text) => {
        logicGrid.innerHTML += `<div class="logic-item"><span class="logic-label">${label}</span>${text}</div>`;
    };

    if (scores.safe < 12 && scores.mirror > 15) {
        addLogic("假性對齊風險", "Safety 低但 Mirror 高，暗示員工可能在壓力下『偽裝對齊』，目標達成可能存在水分[cite: 2]。");
    } else if (scores.safe > 18 && scores.mirror > 18) {
        addLogic("心理共振優勢", "高安全性與高認知對稱，代表組織具備極強的變革韌性[cite: 2]。");
    }

    if (scores.matrix < 12 && scores.flow > 18) {
        addLogic("資訊過載疲勞", "架構模糊但訊息流速快，會導致員工頻繁參與無效會議，產生行政疲勞[cite: 2]。");
    }

    if (scores.safe < 12 && scores.matrix < 12) {
        addLogic("權力真空焦慮", "權責不清且缺乏安全感，組織將陷入嚴重的推諉與內耗循環[cite: 2]。");
    }

    if (logicGrid.innerHTML === "") logicGrid.innerHTML = "<p style='font-size:12px; color:#999;'>未偵測到顯著的組合異常，構面發展相對均衡[cite: 2]。</p>";

    // 3. 維度解析卡片渲染
    const aiGrid = document.getElementById('aiGrid');
    const db = {
        mirror: { n: "Mirror", h: "認知共振", m: "認知雜訊", l: "認知斷層" },
        matrix: { n: "Matrix", h: "靈活治理", m: "功能重疊", l: "結構失序" },
        flow:   { n: "Flow",   h: "透明流動", m: "節點阻滯", l: "資訊孤島" },
        safe:   { n: "Safety", h: "無畏創新", m: "條件信任", l: "恐懼氛圍" }
    };
    
    Object.keys(db).forEach(k => {
        const val = scores[k];
        const status = val >= 18 ? db[k].h : (val >= 12 ? db[k].m : db[k].l);
        const color = val >= 18 ? "#52c41a" : (val >= 12 ? "#faad14" : "#ff4d4f");
        aiGrid.innerHTML += `
            <div class="ai-card" style="border-top-color: ${color}">
                <h4>${db[k].n} <span style="color:${color}; font-size:10px;">● ${status}</span></h4>
                <div class="ai-desc">得分：${val}/25 <br>該指標呈現 ${status} 狀態，對組織傳導效率產生影響[cite: 2]。</div>
            </div>`;
    });

    // 4. 衝突工具包偵測[cite: 1, 2]
    const toolkitGrid = document.getElementById('toolkitGrid');
    if (scores.safe < 12) {
        document.getElementById('toolkitSection').style.display = 'block';
        toolkitGrid.innerHTML += `<div class="toolkit-card"><h5>🚨 恐懼阻斷工具</h5>建議啟動【免責異常申報機制】，優先修復 Safety 以避免決策數據失真[cite: 1, 2]。</div>`;
    }
    if (scores.matrix < 12) {
        document.getElementById('toolkitSection').style.display = 'block';
        toolkitGrid.innerHTML += `<div class="toolkit-card"><h5>🛠 結構重塑工具</h5>建議執行【RACI 職責對齊工作坊】，釐清模糊地帶減少內耗[cite: 1, 2]。</div>`;
    }

    // 結論與圖表
    document.getElementById('conclusionSummary').innerHTML = `根據數據組合，組織目前最顯著的瓶頸在於 <b>${Object.keys(scores).reduce((a, b) => scores[a] < scores[b] ? a : b).toUpperCase()}</b>，這將連帶限制其他高分構面的發揮[cite: 2]。`;
    
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ["Mirror", "Matrix", "Flow", "Safety"],
            datasets: [{ data: [scores.mirror, scores.matrix, scores.flow, scores.safe], backgroundColor: `${riskColor}22`, borderColor: riskColor, borderWidth: 2 }]
        },
        options: { scales: { r: { min: 0, max: 25, ticks: { display: false } } }, plugins: { legend: { display: false } } }
    });

    document.getElementById('reportDate').innerText = `MMTF 邏輯分析模組 v2.0 | 診斷日期：${new Date().toLocaleDateString()}`;
};
</script>
</body>
</html>
