<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 組織氣候與管理效能診斷專業報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #1a3a63; --bg: #f0f2f5; --card-blue: #f8fafc;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background-color: #cbd5e1; display: flex; flex-direction: column; align-items: center; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        .report-container { width: 1100px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); color: #1e293b; }
        
        /* 標題與版權 */
        .header { text-align: center; margin-bottom: 30px; position: relative; }
        .header h1 { font-size: 32px; color: var(--primary); margin: 0; font-weight: 700; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 10px; }
        .copyright { position: absolute; right: 0; bottom: 0; font-size: 12px; color: #94a3b8; }

        /* 1. 動態圓形指標 */
        .top-risk-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px; margin-bottom: 30px; }
        .risk-main { border: 1px solid #e2e8f0; border-radius: 16px; padding: 25px; display: flex; align-items: center; background: #fff; }
        .circle-container { position: relative; width: 120px; height: 120px; margin-right: 25px; flex-shrink: 0; }
        .circle-container svg { transform: rotate(-90deg); width: 120px; height: 120px; }
        .circle-bg { fill: none; stroke: #eee; stroke-width: 10; }
        .circle-bar { 
            fill: none; stroke-width: 10; stroke-linecap: round; 
            stroke-dasharray: 314.15; stroke-dashoffset: 314.15; 
            transition: stroke-dashoffset 1.5s ease-out; /* 動態填滿效果 */
        }
        .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .score-num { font-size: 32px; font-weight: 800; line-height: 1; }

        /* 2. 四維度分析 */
        .section-title { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 10px; margin-top: 25px; }
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 35px; }
        .ai-card { background: #fff; border: 1px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; min-height: 300px; }
        .ai-desc { font-size: 12px; line-height: 1.6; color: #475569; height: 80px; overflow: hidden; margin-top: 10px; }

        /* 3. 中段分析 */
        .mid-row { display: grid; grid-template-columns: 0.6fr 1.4fr; gap: 40px; margin-bottom: 35px; border-top: 1px solid #f1f5f9; padding-top: 30px; }
        #radarChart { max-width: 180px !important; max-height: 180px !important; margin: 0 auto; }
        .conclusion-box { font-size: 14px; line-height: 1.8; color: #334155; }

        /* 4. 下一步指南對策 (進階工具引導) */
        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border-top: 1px solid #f1f5f9; padding-top: 30px; }
        .steps-box { background: var(--card-blue); padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .step-item { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 20px; }
        .step-num { width: 30px; height: 30px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0; }
        .step-header { font-weight: bold; font-size: 14px; margin-bottom: 3px; color: var(--primary); }
        .step-tool { font-size: 12px; color: #64748b; line-height: 1.5; }

        .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 40px; }
    </style>
</head>
<body>
<div class="report-container">
    <div class="header">
        <h1>MMTF 組織診斷與實證分析報告</h1>
        <div class="copyright">許銘祥 / csrrisk.com[cite: 1]</div>
    </div>

    <div class="top-risk-row">
        <div class="risk-main" id="riskMainCard">
            <div class="circle-container">
                <svg>
                    <circle class="circle-bg" cx="60" cy="60" r="50"></circle>
                    <circle class="circle-bar" id="scoreBar" cx="60" cy="60" r="50"></circle>
                </svg>
                <div class="score-text">
                    <span class="score-num" id="totalScoreVal">--</span>
                    <div style="font-size:10px; color:#94a3b8;">對稱指數</div>
                </div>
            </div>
            <div class="risk-text">
                <h2 id="riskTitle">計算中...</h2>
                <p id="riskDesc" style="font-size:14px; color:#64748b; margin:5px 0 0 0;">正在解析 MMTF 管理能量分布...</p>
            </div>
        </div>
        <div class="risk-main" style="display:block; background:#fff;">
            <div style="font-weight:bold; font-size:14px; margin-bottom:10px;">📊 MMTF 指標定義[cite: 1]</div>
            <p style="font-size:12px; color:#666; line-height:1.6; margin:0;">本診斷透過對稱性理論評估管理能量。分數越高代表組織風險越低，能量傳導越精準；滿分 100 代表進入「完全對稱」的卓越狀態[cite: 1, 3]。</p>
        </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-brain"></i>實證構面分析[cite: 1]</div>
    <div class="ai-grid" id="aiGrid"></div>

    <div class="mid-row">
        <div class="radar-box"><canvas id="radarChart"></canvas></div>
        <div class="conclusion-box">
            <h3 style="margin-top:0; color:var(--primary);">🔍 診斷綜合結論</h3>
            <div id="conclusionText">載入中...</div>
        </div>
    </div>

    <div class="bottom-row">
        <div class="steps-box">
            <h4 style="margin:0 0 20px 0; color:var(--primary);">🚀 下一步指南對策 (改善與調整方案)[cite: 3]</h4>
            <div id="stepsContainer"></div>
        </div>
        <div class="steps-box" style="background:#fff;">
            <h4 style="margin:0 0 20px 0; color:var(--primary);">💡 進階工具引導[cite: 3]</h4>
            <div id="advancedTools"></div>
        </div>
    </div>

    <div class="footer" id="reportDate"></div>
</div>

<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const scores = {
        mirror: parseInt(params.get('mirror')) || 15,
        matrix: parseInt(params.get('matrix')) || 15,
        flow: parseInt(params.get('flow')) || 15,
        safe: parseInt(params.get('safe')) || 15
    };
    const totalScore = Math.round(((scores.mirror + scores.matrix + scores.flow + scores.safe) / 100) * 100);
    const isPerfect = totalScore === 100;

    // 1. 動態圓形填滿動畫[cite: 3]
    const bar = document.getElementById('scoreBar');
    const color = isPerfect ? "#1a3a63" : (totalScore >= 70 ? "#52c41a" : "#faad14");
    setTimeout(() => {
        bar.style.stroke = color;
        bar.style.strokeDashoffset = 314.15 - (314.15 * totalScore / 100);
    }, 100);
    document.getElementById('totalScoreVal').innerText = totalScore;
    document.getElementById('totalScoreVal').style.color = color;
    document.getElementById('riskTitle').innerText = isPerfect ? "對稱卓越型組織" : "穩定運作型組織";
    document.getElementById('riskTitle').style.color = color;

    // 2. 下一步指南對策 (引導改善方案)[cite: 3]
    const worstKey = Object.keys(scores).reduce((a, b) => scores[a] < scores[b] ? a : b);
    const steps = isPerfect ? 
        [
            { h: "標竿化管理萃取", d: "將現有對稱經驗模組化，作為未來擴張或新部門的標準模板。" },
            { h: "啟動領航員文化", d: "將卓越的安全感與效能轉化為雇主品牌影響力，吸引頂尖人才。" }
        ] : 
        [
            { h: `修復 ${worstKey.toUpperCase()} 能量斷層`, d: `優先針對 ${worstKey} 進行深度訪談，消除系統內部的傳導阻力。` },
            { h: "建立動態監測指標", d: "導入季度 MMTF 診斷，將管理能量波動納入經營分析會議報告。" }
        ];

    document.getElementById('stepsContainer').innerHTML = steps.map((s, i) => `
        <div class="step-item">
            <div class="step-num">${i+1}</div>
            <div>
                <div class="step-header">${s.h}</div>
                <div class="step-tool">${s.d}</div>
            </div>
        </div>
    `).join('');

    // 3. 進階工具引導 (根據得分引導)[cite: 3]
    const toolDB = {
        mirror: { tool: "Johari Window 工作坊", desc: "用於縮減管理者與基層間的認知「盲目區」，達成共識對齊。" },
        matrix: { tool: "RACI 職權矩陣優化", desc: "釐清跨部門灰色地帶，確保每一項核心任務都有明確的問責者。" },
        flow: { tool: "激進透明看板系統", desc: "建立即時經營數據大屏，消除資訊孤島與傳遞延遲。" },
        safe: { tool: "Amy Edmondson 心理安全掃描", desc: "建立無責異常回報機制，將組織從恐懼驅動轉向學習驅動。" }
    };
    const targetTool = toolDB[worstKey];
    document.getElementById('advancedTools').innerHTML = `
        <div style="border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; border-left: 5px solid ${color};">
            <div style="font-weight:bold; color:var(--primary); margin-bottom:5px;">推薦對策工具：${targetTool.tool}</div>
            <div style="font-size:12px; color:#475569; line-height:1.6;">${targetTool.desc}</div>
            <div style="margin-top:10px; font-size:11px; color:#94a3b8;">* 建議聯繫顧問 Hsu Ming-hsiang 了解進階操作方案。</div>
        </div>
    `;

    // 4. 渲染結論
    document.getElementById('conclusionText').innerHTML = isPerfect ? 
        `組織展現了卓越的對稱性，無需立即性的診斷干預，建議將重心移至「標竿經驗輸出」[cite: 1, 3]。` :
        `目前系統穩定度為 ${totalScore}%，但在 ${worstKey} 存在非對稱風險，建議啟動上述指南進行調整[cite: 1, 3]。`;

    // 5. 雷達圖 (關閉動畫以維持穩定)
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ["Mirror", "Matrix", "Flow", "Safety"],
            datasets: [{ data: Object.values(scores), backgroundColor: `${color}22`, borderColor: color, borderWidth: 2 }]
        },
        options: { animation: false, scales: { r: { min: 0, max: 25, ticks: { display: false } } }, plugins: { legend: { display: false } } }
    });

    document.getElementById('reportDate').innerText = `MMTF 診斷模組 v3.5 | 診斷日期：${new Date().toISOString().split('T')[0]}`;
};
</script>
</body>
</html>
