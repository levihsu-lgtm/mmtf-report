<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTF 組織診斷結果報告（含分析模組）</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --high:#ff4d4f;--mid:#faad14;--low:#52c41a;--primary:#4a90e2;
            --bg:#f8f9fb;--card-bg:#fff;
        }
        body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);margin:0;padding:20px;color:#333;}
        .container{max-width:1000px;margin:auto;background:var(--card-bg);padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.05);}
        .summary-box{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:#fff;border:1px solid #f0f0f0;border-radius:15px;padding:25px;margin-bottom:30px;}
        .total-score-circle{width:120px;height:120px;border:10px solid var(--high);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:auto;}
        .dim-section{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-bottom:40px;}
        .progress-bar-bg{background:#eee;height:12px;border-radius:6px;overflow:hidden;margin:8px 0;}
        .progress-bar-fill{height:100%;border-radius:6px;transition:width 1s ease;}
        .analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px;}
        .analysis-card{background:#fff;border:1px solid #ffeef0;padding:20px;border-radius:12px;}
        .analysis-card.high{background:#fff1f0;border-color:#ffccc7;}
        .analysis-card.mid{background:#fffbe6;border-color:#ffe58f;}
        .analysis-card.low{background:#f6ffed;border-color:#b7eb8f;}
        .suggest-footer{background:#f0f7ff;padding:25px;border-radius:12px;border-left:6px solid var(--primary);margin-top:30px;}
    </style>
</head>
<body>
<div class="container">

<h1 style="text-align:center;">MMTF 組織診斷報告（AI分析升級版）</h1>

<div class="summary-box">
    <div style="display:flex;gap:20px;align-items:center;">
        <div class="total-score-circle" id="circle">
            <span id="total" style="font-size:36px;font-weight:bold;">0</span>
            <span style="font-size:12px;">/100</span>
        </div>
        <div>
            <h2 id="level">分析中</h2>
            <p style="font-size:13px;color:#666;">整體組織風險評估</p>
        </div>
    </div>
</div>

<div class="dim-section">
    <div id="bars"></div>
    <canvas id="radar"></canvas>
</div>

<h3>🧠 AI進階分析模組</h3>
<div id="aiModule" class="analysis-grid"></div>

<div class="suggest-footer">
    <h3>📌 組織診斷策略建議（進階版）</h3>
    <div id="strategy"></div>
</div>

</div>

<script>
const s={
mirror:+new URLSearchParams(location.search).get('mirror')||0,
matrix:+new URLSearchParams(location.search).get('matrix')||0,
flow:+new URLSearchParams(location.search).get('flow')||0,
safe:+new URLSearchParams(location.search).get('safe')||0
};

const total=s.mirror+s.matrix+s.flow+s.safe;
document.getElementById('total').innerText=total;

let level="低風險",color="var(--low)";
if(total<=50){level="高風險";color="var(--high)"}
else if(total<=75){level="中風險";color="var(--mid)"}

document.getElementById('level').innerText=level;
document.getElementById('circle').style.borderColor=color;

document.getElementById('bars').innerHTML=[
['Mirror',s.mirror],['Matrix',s.matrix],['Flow',s.flow],['Safety',s.safe]
].map(([k,v])=>`
<div>
<div style="display:flex;justify-content:space-between;font-size:13px;">
<span>${k}</span><b>${v}/25</b>
</div>
<div class="progress-bar-bg">
<div class="progress-bar-fill" style="width:${v/25*100}%;background:${color}"></div>
</div>
</div>`).join('');

new Chart(document.getElementById('radar'),{
type:'radar',
data:{labels:['Mirror','Matrix','Flow','Safety'],datasets:[{data:[s.mirror,s.matrix,s.flow,s.safe],borderColor:'#4a90e2',backgroundColor:'rgba(74,144,226,.2)'}]},
options:{scales:{r:{min:0,max:25}}}
});

const dims=[
{name:'Mirror',v:s.mirror,insight:'回饋機制不足將導致資訊失真與決策偏差',action:'建立雙向回饋＋匿名回饋系統'},
{name:'Matrix',v:s.matrix,insight:'結構模糊會造成責任不清與效率下降',action:'重構RACI權責模型'},
{name:'Flow',v:s.flow,insight:'資訊延遲會造成跨部門協作失效',action:'建立即時資訊儀表板'},
{name:'Safety',v:s.safe,insight:'心理安全不足會抑制創新與回饋',action:'導入心理安全訓練'}
];

// AI分析模組
let aiHTML='';

dims.forEach(d=>{
const risk=d.v<=12?'high':d.v<=18?'mid':'low';
if(risk!=='low'){
aiHTML+=`
<div class="analysis-card ${risk}">
<h4>${d.name}風險分析</h4>
<p><b>洞察：</b>${d.insight}</p>
<p><b>建議：</b>${d.action}</p>
</div>`;
}
});

document.getElementById('aiModule').innerHTML=aiHTML||"<p>目前無顯著風險</p>";

// 策略引擎
let strategy='';
if(total<=50){
strategy='⚠️ 建議啟動組織重整專案（90天改善計畫）';
}else if(total<=75){
strategy='🔧 建議導入流程優化與溝通改善專案（60天）';
}else{
strategy='✅ 建議維持並導入持續改善機制（KPI監控）';
}

document.getElementById('strategy').innerText=strategy;
</script>
</body>
</html>
