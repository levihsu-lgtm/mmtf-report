<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTF 組織診斷報告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
 --high:#ff4d4f; --mid:#faad14; --low:#52c41a;
 --primary:#4a90e2; --bg:#f5f7fa;
}
body{
 font-family:"Microsoft JhengHei";
 background:var(--bg);
 margin:0; padding:20px;
}
.container{
 max-width:1000px;
 margin:auto;
 background:#fff;
 padding:40px;
 border-radius:12px;
 box-shadow:0 4px 20px rgba(0,0,0,0.05);
}
.summary{
 display:flex; gap:30px; align-items:center;
 margin-bottom:30px;
}
.circle{
 width:120px;height:120px;
 border:10px solid var(--high);
 border-radius:50%;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
}
.progress-bar-bg{background:#eee;height:10px;border-radius:5px;}
.progress-bar-fill{height:100%;border-radius:5px;}
.analysis-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:20px;
}
.analysis-card{
 padding:15px;
 border-radius:10px;
 background:#fafafa;
 border-left:5px solid var(--primary);
}
.footer-box{
 margin-top:30px;
 padding:20px;
 background:#f0f7ff;
 border-left:5px solid var(--primary);
}
</style>
</head>

<body>

<div class="container">

<h1 style="text-align:center;">MMTF 組織診斷報告</h1>

<!-- 總覽 -->
<div class="summary">
 <div class="circle" id="circle">
   <span id="total" style="font-size:32px;font-weight:bold;">0</span>
   <span>/100</span>
 </div>
 <div>
   <h2 id="rank">分析中</h2>
   <div id="model"></div>
 </div>
</div>

<!-- 維度 -->
<h3>📊 四大維度</h3>
<div id="bars"></div>

<!-- 雷達 -->
<canvas id="radar" style="max-height:300px;"></canvas>

<!-- AI分析 -->
<h3>🧠 AI顧問分析</h3>
<div class="analysis-grid" id="analysis"></div>

<!-- 結論 -->
<div class="footer-box">
<h3>📌 顧問結論</h3>
<div id="summary"></div>
</div>

</div>

<script>

// ===== 讀取參數 =====
const p=new URLSearchParams(location.search);
const s={
 mirror:+p.get('mirror')||0,
 matrix:+p.get('matrix')||0,
 flow:+p.get('flow')||0,
 safe:+p.get('safe')||0
};

// ===== 總分 =====
const total=s.mirror+s.matrix+s.flow+s.safe;
document.getElementById('total').innerText=total;

// ===== 風險 =====
let rank="低風險",color="var(--low)";
if(total<=50){rank="高風險";color="var(--high)"}
else if(total<=75){rank="中風險";color="var(--mid)"}

document.getElementById('rank').innerText=rank;
document.getElementById('rank').style.color=color;
document.getElementById('circle').style.borderColor=color;

// ===== MMTF模型 =====
function getModel(s){
 let top=(s.mirror+s.matrix)/2;
 let bottom=(s.flow+s.safe)/2;

 if(top<12&&bottom<12)return ["全面崩壞型","Collapse Model"];
 if(top>=15&&bottom<12)return ["制度失真型","Disconnect Model"];
 if(top<12&&bottom>=15)return ["官僚失衡型","Bureaucratic Model"];
 if(top>=18&&bottom>=18)return ["高效能型","High Performance Model"];
 return ["過渡型","Transitional Model"];
}
const model=getModel(s);
document.getElementById('model').innerHTML=`模型：${model[0]} (${model[1]})`;

// ===== 維度 =====
const dims=[
 {name:"Mirror",v:s.mirror,desc:"回饋與認知"},
 {name:"Matrix",v:s.matrix,desc:"結構與權責"},
 {name:"Flow",v:s.flow,desc:"資訊流"},
 {name:"Safety",v:s.safe,desc:"心理安全"}
];

// ===== 進度條 =====
document.getElementById('bars').innerHTML=dims.map(d=>{
 let c=d.v<=12?"var(--high)":d.v<=18?"var(--mid)":"var(--low)";
 return `
 <div style="margin-bottom:10px;">
 <div style="display:flex;justify-content:space-between;font-size:13px;">
 ${d.name} (${d.desc}) <b>${d.v}/25</b>
 </div>
 <div class="progress-bar-bg">
 <div class="progress-bar-fill" style="width:${d.v/25*100}%;background:${c}"></div>
 </div>
 </div>`;
}).join('');

// ===== 雷達圖 =====
new Chart(document.getElementById('radar'),{
 type:'radar',
 data:{
  labels:['Mirror','Matrix','Flow','Safety'],
  datasets:[{
   data:[s.mirror,s.matrix,s.flow,s.safe],
   borderColor:'#4a90e2',
   backgroundColor:'rgba(74,144,226,.2)'
  }]
 },
 options:{scales:{r:{min:0,max:25}}}
});

// ===== AI分析 =====
let html="";
dims.forEach(d=>{
 let insight="",actions=[];
 if(d.v<=12){
  insight="屬於關鍵風險區，已影響組織運作";
  actions=["立即改善","導入制度","主管介入"];
 }
 else if(d.v<=18){
  insight="存在優化空間，影響效率";
  actions=["優化流程","強化管理","提升協作"];
 }
 else{
  insight="表現良好，具備優勢";
  actions=["建立標準化","擴散成功經驗"];
 }

 html+=`
 <div class="analysis-card">
 <h4>${d.name}</h4>
 <p>${insight}</p>
 <ul>${actions.map(a=>"<li>"+a+"</li>").join('')}</ul>
 </div>`;
});
document.getElementById('analysis').innerHTML=html;

// ===== 顧問結論 =====
let summary="";

switch(model[0]){
 case "制度失真型":
 summary="制度存在但未落地，決策層與現場脫節，建議強化資訊流與心理安全";
 break;
 case "全面崩壞型":
 summary="組織基礎失效，需進行結構與管理重建";
 break;
 case "官僚失衡型":
 summary="流程僵化影響效率，建議提升決策彈性";
 break;
 case "高效能型":
 summary="組織成熟穩定，建議擴散最佳實務形成競爭優勢";
 break;
 default:
 summary="組織處於轉型期，建議優先改善低分構面";
}

document.getElementById('summary').innerText=summary;

</script>

</body>
</html>
