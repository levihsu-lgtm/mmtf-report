<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>MMTF 組織診斷報告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Microsoft JhengHei;background:#eef2f7;margin:0;padding:20px}
.container{max-width:1100px;margin:auto;background:#fff;padding:30px;border-radius:10px}
.card{border:1px solid #ddd;padding:15px;border-radius:8px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
</style>
</head>

<body>
<div class="container">

<h2>MMTF 組織診斷報告</h2>

<div class="card">
總分：<span id="totalScore">--</span>
</div>

<div class="grid" id="aiGrid"></div>

<div class="card">
<h3>診斷結論</h3>
<div id="conclusionText">載入中...</div>
</div>

<div class="card">
<h3>顧問關鍵提醒</h3>
<div id="remindText">載入中...</div>
</div>

<canvas id="radarChart"></canvas>

<div id="reportDate"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

try{

// ===== 1. 讀參數 =====
const params = new URLSearchParams(window.location.search);

const scores = {
mirror: parseInt(params.get('mirror')) || 15,
matrix: parseInt(params.get('matrix')) || 15,
flow: parseInt(params.get('flow')) || 15,
safe: parseInt(params.get('safe')) || 15
};

const totalScore = scores.mirror + scores.matrix + scores.flow + scores.safe;

// ===== 2. 工具 =====
function getLevel(s){
return s >=18 ? 'high' : (s>=12 ? 'mid':'low');
}

// ===== 3. 顧問資料庫 =====
const insightDB = {
mirror:{title:"Mirror"},
matrix:{title:"Matrix"},
flow:{title:"Flow"},
safe:{title:"Safety"}
};

// ===== 4. 衝突引擎（顧問核心）=====
function detectConflict(s){

let c=[];

if(s.flow>=18 && s.safe<=10){
c.push("假透明組織：資訊流動但不敢講真話");
}

if(s.matrix>=18 && s.mirror<=10){
c.push("結構僵化：有制度但認知錯位");
}

if(s.mirror>=18 && s.flow<=10){
c.push("共識卡死：知道但做不動");
}

if(s.safe>=18 && s.matrix<=10){
c.push("過度民主：有安全但沒決策");
}

if(Math.max(...Object.values(s)) - Math.min(...Object.values(s)) >=12){
c.push("結構失衡：四構面落差過大");
}

return c;
}

// ===== 5. 計算 =====
const conflictList = detectConflict(scores);

const bestKey = Object.keys(scores).reduce((a,b)=>scores[a]>scores[b]?a:b);
const worstKey = Object.keys(scores).reduce((a,b)=>scores[a]<scores[b]?a:b);

// ===== 6. UI =====
document.getElementById("totalScore").innerText = totalScore;

// 卡片
const grid = document.getElementById("aiGrid");

Object.keys(scores).forEach(k=>{
grid.innerHTML += `<div class="card">${k}: ${scores[k]}</div>`;
});

// ===== 7. 結論 =====
document.getElementById("conclusionText").innerHTML = `
優勢：${bestKey} (${scores[bestKey]})<br>
弱點：${worstKey} (${scores[worstKey]})<br>
建議優先修復弱點構面
`;

// ===== 8. 顧問引擎輸出（重點）=====
let conflictHTML = "";

if(conflictList.length>0){

conflictHTML += "<b>顧問決策引擎：</b><br>";

conflictList.forEach(i=>{
conflictHTML += "• "+i+"<br>";
});

}

document.getElementById("remindText").innerHTML =
"請優先處理低分構面<br><br>" + conflictHTML;


// ===== 9. 雷達圖 =====
new Chart(document.getElementById("radarChart"),{
type:"radar",
data:{
labels:["Mirror","Matrix","Flow","Safety"],
datasets:[{
data:[scores.mirror,scores.matrix,scores.flow,scores.safe]
}]
}
});

// ===== 10. 日期 =====
const today = new Date();
document.getElementById("reportDate").innerText =
"日期："+today.toLocaleDateString();

}catch(e){

console.error(e);
document.body.innerHTML = "<h2>系統錯誤，請開啟Console</h2>";

}

});
</script>

</body>
</html>
