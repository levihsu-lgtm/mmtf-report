<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTF 組織診斷報告系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --high: #ff4d4f; --mid: #faad14; --low: #52c41a;
            --primary: #1a3a63; --bg: #f4f7f9;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .report-container { max-width: 900px; margin: auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        /* 標題區 */
        .title-section { text-align: center; margin-bottom: 30px; }
        .title-section h1 { margin: 0; font-size: 32px; letter-spacing: 2px; }
        .title-section p { color: #888; margin-top: 10px; }

        /* 頂部總覽卡片 */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { border: 1px solid #edf2f7; border-radius: 12px; padding: 20px; position: relative; }
        .card-title { font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; font-size: 16px; }

        .score-display { display: flex; align-items: center; gap: 20px; }
        .circle-score { width: 90px; height: 90px; border: 8px solid #eee; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
        
        /* 四大維度與雷達圖 */
        .details-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-bottom: 30px; }
        .dim-item { margin-bottom: 15px; }
        .dim-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .progress-bg { background: #eee; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 5px; transition: width 1s; }

        /* AI 分析結果 */
        .ai-analysis-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .ai-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 8px; padding: 15px; font-size: 12px; }
        .ai-card h5 { margin: 0 0 8px 0; color: var(--high); font-size: 14px; }
        .ai-card ul { padding-left: 15px; margin: 8px 0 0 0; color: #666; }

        /* 底部行動建議 */
        .action-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .step-item { background: #f0f7ff; padding: 15px; border-radius: 10px; text-align: center; position: relative; }
        .step-num { width: 24px; height: 24px; background: var(--primary); color: #fff; border-radius: 50%; display: inline-block; margin-bottom: 8px; font-size: 12px; line-height: 24px; }
        .step-text { font-size: 13px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="report-container">
    <div class="title-section">
        <h1>MMTF 組織診斷報告</h1>
        <p>透過四大維度評估組織當前運作狀態，提供改善建議與行動方向</p>
    </div>

    <div class="summary-grid">
        <div class="card">
            <div class="card-title">🚨 整體風險等級</div>
            <div class="score-display">
                <div class="circle-score" id="main-circle">
                    <span id="total-val" style="font-size:32px;">0</span>
                    <span style="font-size:12px; color:#999;">/ 100</span>
                </div>
                <div>
                    <h2 id="rank-name" style="margin:0;">計算中...</h2>
                    <p style="font-size:13px; color:#666; margin:5px 0;">建議優先改善較弱維度以提升效能</p>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">💡 風險等級說明</div>
            <div style="font-size:13px; line-height:1.8;">
                <span style="color:var(--high)">●</span> 高風險 (0-50分)：需立即關注改善<br>
                <span style="color:var(--mid)">●</span> 中風險 (51-75分)：建議積極改善強化<br>
                <span style="color:var(--low)">●</span> 低風險 (76-100分)：組織狀態良好，持續維持
            </div>
        </div>
    </div>

    <div class="details-grid">
        <div class="card">
            <div class="card-title">🎯 四大維度得分</div>
            <div id="dim-bars"></div>
        </div>
        <div class="card" style="text-align:center;">
            <div class="card-title">📈 MMTF 四維度雷達圖</div>
            <canvas id="radarChart" style="max-height: 200px;"></canvas>
        </div>
    </div>

    <h3 style="margin-bottom:15px; font-size:18px;">🧠 AI 分析結果</h3>
    <div class="ai-analysis-grid" id="ai-results"></div>

    <div class="card" style="background:#f8faff; border-left: 6px solid var(--primary);">
        <div class="card-title">💡 總結與建議</div>
        <p id="final-summary" style="font-size:14px; line-height:1.6;"></p>
        <div class="action-steps" id="action-steps-ui"></div>
    </div>
    
    <p style="text-align:center; color:#ccc; font-size:12px; margin-top:30px;">報告產生時間：2026-04-28</p>
</div>

<script>
window.onload = function() {
    const p = new URLSearchParams(window.location.search);
    const s = {
        mirror: parseInt(p.get('mirror')) || 0,
        matrix: parseInt(p.get('matrix')) || 0,
        flow: parseInt(p.get('flow')) || parseInt(p.get('informationFlow')) || 0,
        safe: parseInt(p.get('safe')) || parseInt(p.get('psychologicalSafety')) || 0
    };

    const total = s.mirror + s.matrix + s.flow + s.safe;
    document.getElementById('total-val').innerText = total;

    // 風險等級判定
    let rank = { n: "低風險", c: "#52c41a" };
    if(total <= 50) rank = { n: "高風險", c: "#ff4d4f" };
    else if(total <= 75) rank = { n: "中風險", c: "#faad14" };

    document.getElementById('rank-name').innerText = rank.n;
    document.getElementById('rank-name').style.color = rank.c;
    document.getElementById('main-circle').style.borderColor = rank.c;

    const dims = [
        {k:'mirror', l:'Mirror (鏡像)', d:'回饋機制薄弱，認知落差大。', a:['建立雙向回饋','定期意見收集']},
        {k:'matrix', l:'Matrix (結構)', d:'組織結構與職責劃分不清。', a:['釐清角色職責','優化架構流程']},
        {k:'flow', l:'Flow (資訊流)', d:'資訊流通不暢，溝通阻礙。', a:['建立共享平台','減少傳遞層級']},
        {k:'safe', l:'Safety (心理安全)', d:'信任不足，不敢表達想法。', a:['營造包容文化','鼓勵表達觀點']}
    ];

    // 生成 Bars 與 AI Cards
    let barsH = ""; let aiH = "";
    dims.forEach(d => {
        let v = s[d.k];
        let color = v <= 12 ? "#ff4d4f" : v <= 18 ? "#faad14" : "#52c41a";
        barsH += `
            <div class="dim-item">
                <div class="dim-header"><span>${d.l}</span><span style="font-weight:bold; color:${color}">${v}/25</span></div>
                <div class="progress-bg"><div class="progress-fill" style="width:${(v/25)*100}%; background:${color}"></div></div>
            </div>`;
        aiH += `
            <div class="ai-card">
                <h5 style="color:${color}">${d.l} 偏低</h5>
                <p style="margin:0; color:#666;">${d.d}</p>
                <ul>${d.a.map(act => `<li>${act}</li>`).join('')}</ul>
            </div>`;
    });
    document.getElementById('dim-bars').innerHTML = barsH;
    document.getElementById('ai-results').innerHTML = aiH;

    // 總結與步驟
    document.getElementById('final-summary').innerHTML = `整體而言，組織在四大維度均處於 ${rank.n}。建議優先從表現最弱的構面著手改善。`;
    const steps = ["優先改善鏡像與結構", "強化溝通與資訊流通", "提升心理安全感", "持續追蹤與檢視"];
    document.getElementById('action-steps-ui').innerHTML = steps.map((txt, i) => `
        <div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${txt}</div></div>
    `).join('');

    // 雷達圖
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ['Mirror', 'Matrix', 'Flow', 'Safety'],
            datasets: [{
                data: [s.mirror, s.matrix, s.flow, s.safe],
                backgroundColor: 'rgba(255, 77, 79, 0.2)',
                borderColor: '#ff4d4f',
                pointBackgroundColor: '#ff4d4f',
                borderWidth: 2
            }]
        },
        options: {
            scales: { r: { min: 0, max: 25, ticks: { display: false } } },
            plugins: { legend: { display: false } }
        }
    });
};
</script>
</body>
</html>
