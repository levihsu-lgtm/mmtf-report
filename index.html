<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MMTF 專業診斷報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #1a3a63; --bg: #cbd5e1; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background: var(--bg); font-family: sans-serif; }
        body::before { content: "版權所有@許銘祥"; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 80px; color: rgba(0,0,0,0.05); pointer-events: none; z-index: 9999; }
        
        .report-container { width: 1100px; background: #fff; padding: 40px; border-radius: 12px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px solid var(--primary); margin-bottom: 30px; padding-bottom: 10px; }
        
        .top-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-bottom: 30px; }
        .card { border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; display: flex; align-items: center; }
        .score-circle { width: 100px; height: 100px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-right: 20px; }
        
        .ai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .ai-card { border: 1px solid #e2e8f0; border-top: 5px solid var(--primary); padding: 15px; border-radius: 8px; }
        .status-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; float: right; }

        .mid-row { display: grid; grid-template-columns: 0.6fr 1.4fr; gap: 30px; padding-top: 20px; border-top: 1px solid #eee; }
        #radarChart { max-width: 180px; margin: auto; }

        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .remind-box { padding: 20px; border-radius: 16px; border: 1px dashed #ccc; }
        .toolkit-box { background: rgba(255,255,255,0.8); border-radius: 8px; padding: 15px; border-left: 4px solid; margin-top: 15px; }
    </style>
</head>
<body>

<div class="report-container">
    <div class="header"><h1>MMTF 組織氣候診斷報告</h1></div>

    <div class="top-row">
        <div class="card" id="riskMainCard">
            <div class="score-circle" id="scoreCircle">
                <b id="totalScoreVal" style="font-size:32px;">--</b>
                <small style="color:#888;">/100</small>
            </div>
            <div>
                <h2 id="riskTitle" style="margin:0;">診斷中...</h2>
                <p id="riskDesc" style="color:#666; font-size:14px; margin:5px 0 0;"></p>
            </div>
        </div>
        <div class="card" style="font-size:12px; line-height:1.6; display:block;">
            <b>指標說明：</b>本報告依據對稱性理論評估管理能量。高分代表風險低、傳導精準[cite: 1]。
        </div>
    </div>

    <div class="ai-grid" id="aiGrid"></div>

    <div class="mid-row">
        <div><canvas id="radarChart"></canvas></div>
        <div style="font-size:14px;">
            <h3>🔍 綜合診斷</h3>
            <p id="conclusionText"></p>
        </div>
    </div>

    <div class="bottom-row">
        <div class="card" style="display:block; background:#f8fafc;">
            <h4 style="margin-top:0;"><i class="fa-solid fa-list-check"></i> 行動指引</h4>
            <ul style="font-size:13px; padding-left:20px;">
                <li>確認數據與現場感受。</li>
                <li>召開核心會議進行對齊。</li>
                <li>運用顧問衝突工具包介入。</li>
            </ul>
        </div>
        <div class="remind-box" id="remindBox"></div>
    </div>
</div>

<script>
window.onload = function() {
    const p = new URLSearchParams(window.location.search);
    const s = { 
        mirror: parseInt(p.get('mirror')) || 15, 
        matrix: parseInt(p.get('matrix')) || 15, 
        flow: parseInt(p.get('flow')) || 15, 
        safe: parseInt(p.get('safe')) || 15 
    };
    const total = Math.round((s.mirror + s.matrix + s.flow + s.safe));
    const worst = Object.keys(s).reduce((a, b) => s[a] < s[b] ? a : b);

    const db = {
        mirror: { n: "Mirror", t: "Johari Window", h: "認知共振", m: "認知雜訊", l: "認知斷層", c: "#52c41a", mc: "#faad14", lc: "#ff4d4f" },
        matrix: { n: "Matrix", t: "RACI Theory", h: "靈活治理", m: "功能重疊", l: "結構失序" },
        flow: { n: "Flow", t: "Shannon Theory", h: "透明流動", m: "節點阻滯", l: "資訊孤島" },
        safe: { n: "Safety", t: "Psychological Safety", h: "無畏創新", m: "條件信任", l: "恐懼氛圍" }
    };

    const ui = total >= 70 ? { 
        t: "高能卓越型", c: "#52c41a", b: "#f6ffed", r: "組織運作流暢，應預防成功後的路徑依賴。",
        tk: "成長維護", act: "引導顧問可透過「同儕回饋」深化信任，激發創新動能。"
    } : total >= 45 ? { 
        t: "亞健康運作型", c: "#faad14", b: "#fffbe6", r: "效能受損，應優先解決核心瓶頸。",
        tk: "專業調解", act: "引導顧問啟動「關鍵對話」，介入處理跨部門目標衝突。"
    } : { 
        t: "高風險失能型", c: "#ff4d4f", b: "#fff1f0", r: "組織失能，必須立即進行結構性干預。",
        tk: "危機重建", act: "引導顧問應優先執行「心理安全掃描」並召開核心對齊會議。"
    };

    document.getElementById('totalScoreVal').innerText = total;
    document.getElementById('totalScoreVal').style.color = ui.c;
    document.getElementById('riskTitle').innerText = ui.t;
    document.getElementById('riskTitle').style.color = ui.c;
    document.getElementById('riskMainCard').style.background = `linear-gradient(135deg, #fff, ${ui.b})`;

    document.getElementById('remindBox').style.borderColor = ui.c;
    document.getElementById('remindBox').style.background = ui.b;
    document.getElementById('remindBox').innerHTML = `
        <h4 style="color:${ui.c}; margin:0 0 10px;"><i class="fa-solid fa-bell"></i> 管理優化核心提醒</h4>
        <p style="font-size:13px; color:#1e293b;">${ui.r}</p>
        <div class="toolkit-box" style="border-color:${ui.c};">
            <div style="font-size:12px; font-weight:bold; color:${ui.c}; margin-bottom:5px;">
                <i class="fa-solid fa-toolbox"></i> ${ui.tk}工具包 <span style="float:right; font-weight:normal; color:#999;">顧問引導：尹勤</span>
            </div>
            <div style="font-size:12px; color:#475569;"><strong>行動：</strong>${ui.act}</div>
        </div>`;

    const grid = document.getElementById('aiGrid');
    Object.keys(s).forEach(k => {
        const lv = s[k] >= 18 ? 'h' : (s[k] >= 12 ? 'm' : 'l');
        const color = s[k] >= 18 ? '#52c41a' : (s[k] >= 12 ? '#faad14' : '#ff4d4f');
        grid.innerHTML += `<div class="ai-card" style="border-top-color:${color}">
            <span class="status-tag" style="background:${color}11; color:${color}">${db[k][lv]}</span>
            <b style="font-size:14px; color:var(--primary);">${db[k].n}</b>
            <div style="font-size:10px; color:#999; font-style:italic;">${db[k].t}</div>
        </div>`;
    });

    document.getElementById('conclusionText').innerHTML = `總分 <b>${total}</b>。建議優先關注 <b>${db[worst].n}</b> 構面[cite: 1]。`;

    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: { labels: ["Mirror", "Matrix", "Flow", "Safety"], datasets: [{ data: [s.mirror, s.matrix, s.flow, s.safe], backgroundColor: ui.c+'22', borderColor: ui.c, borderWidth: 2 }] },
        options: { scales: { r: { min:0, max:25, ticks: { display:false } } }, plugins: { legend: { display:false } } }
    });

    let st = null;
    function anim(t) {
        if(!st) st = t;
        let prg = Math.min((t - st) / 1000, 1);
        document.getElementById('scoreCircle').style.background = `radial-gradient(closest-side, white 80%, transparent 0%), conic-gradient(${ui.c} ${prg * total}%, #eee 0%)`;
        if(prg < 1) requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
};
</script>
</body>
</html>
