<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMTF 組織診斷報告系統 - 專業版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --high: #ff4d4f; --mid: #faad14; --low: #52c41a;
            --primary: #1a3a63; --bg: #f4f7f9;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .report-container { max-width: 950px; margin: auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        .title-section { text-align: center; margin-bottom: 30px; }
        .title-section h1 { margin: 0; font-size: 30px; color: var(--primary); letter-spacing: 1px; }
        .title-section p { color: #666; margin-top: 8px; font-size: 14px; }

        .summary-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-bottom: 30px; }
        .card { border: 1px solid #edf2f7; border-radius: 12px; padding: 22px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .card-title { font-weight: bold; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; font-size: 16px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }

        .score-display { display: flex; align-items: center; gap: 25px; }
        .circle-score { width: 95px; height: 95px; border: 8px solid #eee; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .dim-item { margin-bottom: 16px; }
        .dim-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
        .progress-bg { background: #f0f0f0; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 5px; transition: width 1.2s ease-out; }

        /* AI 分析卡片 */
        .ai-analysis-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .ai-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; padding: 18px; border-top: 4px solid var(--primary); }
        .theory-tag { display: inline-block; font-size: 10px; background: #eef5ff; color: var(--primary); padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 8px; }
        .ai-card h5 { margin: 5px 0; font-size: 16px; }
        .ai-card p { font-size: 13px; color: #555; line-height: 1.5; margin: 8px 0; }
        .ai-card ul { padding-left: 18px; margin: 10px 0 0 0; font-size: 13px; color: #444; }

        /* 行動建議步步高升 */
        .action-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .step-item { background: #fff; border: 1px solid #d0e3ff; padding: 15px; border-radius: 10px; text-align: center; }
        .step-num { width: 26px; height: 26px; background: var(--primary); color: #fff; border-radius: 50%; display: inline-block; margin-bottom: 10px; font-size: 13px; line-height: 26px; font-weight: bold; }
        .step-text { font-size: 13px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="report-container">
    <div class="title-section">
        <h1>Mirror Matrix Theory Feedback (MMTF) 診斷報告</h1>
        <p>基於組織行為學與管理效率框架產出之實證分析</p>
    </div>

    <div class="summary-grid">
        <div class="card">
            <div class="card-title">🚨 組織風險總覽</div>
            <div class="score-display">
                <div class="circle-score" id="main-circle">
                    <span id="total-val" style="font-size:34px;">0</span>
                    <span style="font-size:12px; color:#999;">/ 100</span>
                </div>
                <div>
                    <h2 id="rank-name" style="margin:0;">計算中...</h2>
                    <p style="font-size:13px; color:#666; margin:8px 0;">當前指標反映組織基礎功能狀態。</p>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">💡 風險評等標準</div>
            <div style="font-size:13px; line-height:2;">
                <b style="color:var(--high)">● 高風險 (0-50)</b>：功能失效，需立即介入。<br>
                <b style="color:var(--mid)">● 中風險 (51-75)</b>：效率受損，建議優化。<br>
                <b style="color:var(--low)">● 低風險 (76-100)</b>：運作良好，持續追蹤。
            </div>
        </div>
    </div>

    <div class="details-grid">
        <div class="card">
            <div class="card-title">📊 四大維度量化得分</div>
            <div id="dim-bars"></div>
        </div>
        <div class="card" style="text-align:center;">
            <div class="card-title">🕸️ MMTF 雷達分布圖</div>
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <div class="ai-analysis-grid" id="ai-results"></div>

    <div class="card" style="background:#f0f7ff; border-top: 5px solid var(--primary);">
        <div class="card-title">🎯 顧問統合行動建議</div>
        <p id="final-summary" style="font-size:14px; line-height:1.6; color:#1a3a63; font-weight:500;"></p>
        <div class="action-steps" id="action-steps-ui"></div>
    </div>
    
    <p style="text-align:center; color:#bbb; font-size:11px; margin-top:40px;">本報告由 MMTF 診斷系統自動產出 | 數據基於 URL 參數解析</p>
</div>

<script>
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const scores = {
        mirror: parseInt(urlParams.get('mirror')) || 0,
        matrix: parseInt(urlParams.get('matrix')) || 0,
        flow: parseInt(urlParams.get('flow')) || parseInt(urlParams.get('informationFlow')) || 0,
        safe: parseInt(urlParams.get('safe')) || parseInt(urlParams.get('psychologicalSafety')) || 0
    };

    const total = scores.mirror + scores.matrix + scores.flow + scores.safe;
    document.getElementById('total-val').innerText = total;

    // 風險色塊判定
    let rank = { n: "低風險", c: "#52c41a" };
    if(total <= 50) rank = { n: "高風險", c: "#ff4d4f" };
    else if(total <= 75) rank = { n: "中風險", c: "#faad14" };

    document.getElementById('rank-name').innerText = rank.n;
    document.getElementById('rank-name').style.color = rank.c;
    document.getElementById('main-circle').style.borderColor = rank.c;

    // 核心分析維度資料庫
    const dims = [
        {
            k:'mirror', l:'Mirror (鏡像回饋)', theory: '回饋環路理論 (Feedback Loop)',
            d:'反映領導者與基層間的認知落差。',
            a:['建立 360 度雙向回饋機制','定期進行管理層認知落差分析']
        },
        {
            k:'matrix', l:'Matrix (組織結構)', theory: '權變理論 (Contingency Theory)',
            d:'反映權責劃分之清晰度與決策路徑。',
            a:['定義 RACI 權責矩陣','減少重疊的彙報層級']
        },
        {
            k:'flow', l:'Info Flow (資訊流動)', theory: '資訊效能模型 (Shannon-Weaver)',
            d:'反映資訊傳遞之透明度與流動速度。',
            a:['推動單一資訊來源 (SSoT) 平台','優化跨部門水平溝通機制']
        },
        {
            k:'safe', l:'Safety (心理安全感)', theory: 'Edmondson 安全感框架',
            d:'反映組織容錯率與員工建言意願。',
            a:['推行無責異常申報制度','建立支持型領導文化與培訓']
        }
    ];

    let barsH = ""; let aiH = "";
    dims.forEach(d => {
        let v = scores[d.k];
        let color = v <= 12 ? "#ff4d4f" : v <= 18 ? "#faad14" : "#52c41a";
        
        // 進度條
        barsH += `
            <div class="dim-item">
                <div class="dim-header"><span>${d.l}</span><span style="font-weight:bold; color:${color}">${v}/25</span></div>
                <div class="progress-bg"><div class="progress-fill" style="width:${(v/25)*100}%; background:${color}"></div></div>
            </div>`;
        
        // AI 分析卡片
        aiH += `
            <div class="ai-card">
                <div class="theory-tag">${d.theory}</div>
                <h5 style="color:${color}">${d.l} 狀態診斷</h5>
                <p>${d.d}</p>
                <ul>${d.a.map(act => `<li>${act}</li>`).join('')}</ul>
            </div>`;
    });

    document.getElementById('dim-bars').innerHTML = barsH;
    document.getElementById('ai-results').innerHTML = aiH;

    // 總結文字
    const model = (scores.mirror + scores.matrix) < 24 ? "全面崩壞型" : "局部失衡型";
    document.getElementById('final-summary').innerHTML = `
        當前診斷為「${model}」。數據顯示組織在基礎構建上存在顯著瓶頸。
        建議優先針對得分最低之維度進行結構化調整。
    `;

    const steps = ["優先改善鏡像與結構落差", "優化資訊透明化工具", "提升心理安全感機制", "建立持續改善與監控機制"];
    document.getElementById('action-steps-ui').innerHTML = steps.map((txt, i) => `
        <div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${txt}</div></div>
    `).join('');

    // 雷達圖繪製
    new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ['Mirror', 'Matrix', 'Flow', 'Safety'],
            datasets: [{
                data: [scores.mirror, scores.matrix, scores.flow, scores.safe],
                backgroundColor: 'rgba(26, 58, 99, 0.15)',
                borderColor: '#1a3a63',
                pointBackgroundColor: '#1a3a63',
                pointRadius: 4,
                borderWidth: 2
            }]
        },
        options: {
            scales: { r: { min: 0, max: 25, ticks: { display: false }, grid: { color: '#eee' } } },
            plugins: { legend: { display: false } }
        }
    });
};
</script>
</body>
</html>
