<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>MMTF 組織診斷報告（顧問版）</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: "Microsoft JhengHei";
    background:#e2e8f0;
    padding:20px;
}
.container {
    background:#fff;
    padding:30px;
    border-radius:10px;
    width:1000px;
    margin:auto;
}
h1 { text-align:center; }

.section { margin-top:30px; }

.card {
    border:1px solid #ddd;
    padding:15px;
    border-radius:8px;
    margin-bottom:10px;
}

.btn {
    background:#1a3a63;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container" id="report">

<h1>MMTF 組織診斷報告</h1>

<div id="summary"></div>

<div class="section">
    <h3>📊 雷達圖</h3>
    <canvas id="chart"></canvas>
</div>

<div class="section">
    <h3>⚠️ 衝突診斷</h3>
    <div id="conflict"></div>
</div>

<div class="section">
    <h3>🚀 顧問方案包（3週改善計畫）</h3>
    <div id="plan"></div>
</div>

<div class="section">
    <h3>📈 KPI 指標</h3>
    <div id="kpi"></div>
</div>

<br>
<button class="btn" onclick="downloadPDF()">📄 匯出PDF報告</button>

</div>

<script>

// ===== 基本分數 =====
const params = new URLSearchParams(window.location.search);

const scores = {
    mirror: +params.get('mirror') || 5,
    matrix: +params.get('matrix') || 5,
    flow: +params.get('flow') || 5,
    safe: +params.get('safe') || 5
};

// ===== 衝突偵測 =====
function detectConflict(s) {

    let list = [];

    if (s.flow >= 18 && s.safe <= 10) {
        list.push({
            type:"假透明組織",
            solution:"心理安全重建方案"
        });
    }

    if (s.matrix >= 18 && s.mirror <= 10) {
        list.push({
            type:"結構僵化組織",
            solution:"認知對齊方案"
        });
    }

    if (s.mirror >= 18 && s.flow <= 10) {
        list.push({
            type:"共識卡死組織",
            solution:"資訊流程再造方案"
        });
    }

    if (s.safe >= 18 && s.matrix <= 10) {
        list.push({
            type:"過度民主組織",
            solution:"決策結構重建方案"
        });
    }

    if (Math.max(...Object.values(s)) - Math.min(...Object.values(s)) >= 12) {
        list.push({
            type:"結構失衡組織",
            solution:"系統平衡重建方案"
        });
    }

    return list;
}

const conflicts = detectConflict(scores);

// ===== 顧問方案包 =====
function getPlan(type){

const plans = {

"假透明組織": {
week:[
"建立匿名回報機制",
"主管公開承認錯誤",
"建立心理安全會議"
],
kpi:[
"匿名回報率↑50%",
"錯誤揭露時間↓30%",
"員工發言率↑40%"
]
},

"結構僵化組織": {
week:[
"高層戰略對齊會議",
"中層翻譯任務",
"基層回饋驗證"
],
kpi:[
"戰略理解一致性↑60%",
"指令重工率↓40%",
"跨層誤解率↓50%"
]
},

"共識卡死組織": {
week:[
"流程盤點",
"決策節點縮短",
"導入即時資訊工具"
],
kpi:[
"決策時間↓40%",
"資訊傳遞時間↓50%",
"延誤率↓35%"
]
},

"過度民主組織": {
week:[
"建立RACI",
"決策權責明確化",
"導入決策SOP"
],
kpi:[
"決策時間↓50%",
"責任不清事件↓60%",
"專案完成率↑30%"
]
},

"結構失衡組織": {
week:[
"最低分構面優先修復",
"跨構面協同設計",
"建立監控儀表板"
],
kpi:[
"最低分構面↑50%",
"構面差距↓40%",
"整體分數↑30%"
]
}

};

return plans[type];

}

// ===== 渲染 =====

document.getElementById("summary").innerHTML =
`總分：${(scores.mirror+scores.matrix+scores.flow+scores.safe)} / 100`;


// 衝突
if(conflicts.length > 0){

const c = conflicts[0];

document.getElementById("conflict").innerHTML =
`<div class="card">
<strong>${c.type}</strong><br>
對應方案：${c.solution}
</div>`;

// 計畫
const p = getPlan(c.type);

document.getElementById("plan").innerHTML =
p.week.map((w,i)=>`Week ${i+1}：${w}`).join("<br>");

document.getElementById("kpi").innerHTML =
p.kpi.map(k=>`• ${k}`).join("<br>");

}


// ===== 雷達圖 =====
new Chart(document.getElementById('chart'), {
type:'radar',
data:{
labels:["Mirror","Matrix","Flow","Safety"],
datasets:[{
data:Object.values(scores)
}]
}
});

// ===== PDF =====
function downloadPDF(){
html2pdf().from(document.getElementById("report")).save("MMTF_Report.pdf");
}

</script>

</body>
</html>
