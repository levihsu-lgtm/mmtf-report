<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMTF 顧問級診斷報告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--high:#ff4d4f;--mid:#faad14;--low:#52c41a;
--primary:#1a3a63;--bg:#f5f7fb;
}
body{margin:0;font-family:"Microsoft JhengHei";background:var(--bg);}
.container{max-width:1100px;margin:auto;background:#fff;padding:30px;border-radius:14px;}

/* header */
.header{text-align:center;margin-bottom:25px;}
.header h1{margin:0;color:var(--primary);}
.sub{color:#888;font-size:13px}

/* top */
.top{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.card{border:1px solid #eee;border-radius:12px;padding:20px;}

.circle{
width:110px;height:110px;border:10px solid var(--mid);
border-radius:50%;display:flex;flex-direction:column;
align-items:center;justify-content:center;
}

/* grid */
.grid{display:grid;grid-template-columns:1.4fr 0.6fr;gap:25px;margin-bottom:20px;}
.bar{margin-bottom:12px;}
.bar-bg{height:10px;background:#eee;border-radius:6px;}
.bar-fill{height:10px;border-radius:6px;}

/* AI */
.ai{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
.ai-card{border:1px solid #eee;border-radius:10px;padding:12px;font-size:12px;}
.ai-title{font-weight:bold;margin-bottom:6px}

/* summary */
.summary{background:#f0f6ff;padding:20px;border-radius:10px;margin-top:15px;}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>MMTF 組織診斷報告</h1>
<div class="sub">顧問級分析版本｜Mirror Matrix Theory Feedback</div>
</div>

<div class="top">
<div class="card" style="display:flex;gap:20px;align-items:center;">
<div class="circle" id="circle">
<div id="total" style="font-size:32px;font-weight:bold">0</div>
<div style="font-size:12px">/100</div>
</div>
<div>
<h2 id="level">分析中</h2>
<div id="model" style="color:#888"></div>
</div>
</div>

<div class="card">
<b>風險等級說明</b><br><br>
🔴 高風險：組織運作失衡，需立即介入<br>
🟡 中風險：存在結構或溝通斷層<br>
🟢 低風險：具備穩定運作能力
</div>
</div>

<div class="grid">
<div id="bars"></div>
<canvas id="radar"></canvas>
</div>

<h3>🧠 顧問級分析</h3>
<div class="ai" id="ai"></div>

<div class="summary">
<h3>📌 管理顧問結論與轉型建議</h3>
<div id="summary"></div>
</div>

</div>

<script>
const p=new URLSearchParams(location.search);

const s={
mirror:+p.get('mirror')||0,
matrix:+p.get('matrix')||0,
flow:+p.get('flow')||0,
safe:+p.get('safe')||0
};

const total=s.mirror+s.matrix+s.flow+s.safe;
document.getElementById('total').innerText=total;

let level="低風險",color="var(--low)";
if(total<=50){level="高風險";color="var(--high)"}
else if(total<=75){level="中風險";color="var(--mid)"}

document.getElementById('level').innerText=level;
document.getElementById('circle').style.borderColor=color;

/* MMTF模型 */
function model(){
let top=(s.mirror+s.matrix)/2;
let bot=(s.flow+s.safe)/2;

if(top>=18&&bot<12) return "制度失真型";
if(top<12&&bot>=15) return "官僚失衡型";
if(top<12&&bot<12) return "全面崩壞型";
if(top>=18&&bot>=18) return "高效能型";
return "過渡型";
}

document.getElementById('model').innerText="MMTF模型："+model();

/* bars */
const dims=[
["Mirror",s.mirror],
["Matrix",s.matrix],
["Flow",s.flow],
["Safety",s.safe]
];

document.getElementById('bars').innerHTML=dims.map(d=>{
let c=d[1]<=12?"var(--high)":d[1]<=18?"var(--mid)":"var(--low)";
return `
<div class="bar">
<div>${d[0]} ${d[1]}/25</div>
<div class="bar-bg">
<div class="bar-fill" style="width:${d[1]*4}%;background:${c}"></div>
</div>
</div>`;
}).join("");

/* radar */
new Chart(document.getElementById('radar'),{
type:'radar',
data:{labels:["Mirror","Matrix","Flow","Safety"],
datasets:[{data:[s.mirror,s.matrix,s.flow,s.safe],
borderColor:"#1a3a63",backgroundColor:"rgba(26,58,99,.15)"}]},
options:{plugins:{legend:{display:false}},scales:{r:{min:0,max:25}}}
});

/* AI顧問分析 */
const ai=[
{n:"Mirror",v:s.mirror,t:"管理認知與現場落差"},
{n:"Matrix",v:s.matrix,t:"組織結構與權責清晰度"},
{n:"Flow",v:s.flow,t:"資訊流與決策傳導效率"},
{n:"Safety",v:s.safe,t:"心理安全與真實回饋"}
];

document.getElementById('ai').innerHTML=ai.map(d=>{
let risk=d.v<=12?"高風險":d.v<=18?"中風險":"穩定";
return `
<div class="ai-card">
<div class="ai-title">${d.n}（${risk}）</div>
<div>${d.t}</div>
<div style="margin-top:6px;color:#666">
${d.v<=12?"已影響組織決策品質，建議立即介入":"可優化提升組織效率"}
</div>
</div>`;
}).join("");

/* summary */
let text="";

if(level==="高風險"){
text="建議啟動90天組織重整計畫，優先處理Mirror與Flow斷層，否則制度將持續失效。";
}
else if(level==="中風險"){
text="組織存在結構與行為落差，建議60天內完成流程與回饋優化。";
}
else{
text="組織運作穩定，建議導入持續改善與數據監控機制。";
}

document.getElementById('summary').innerText=text;

</script>
</body>
</html>
